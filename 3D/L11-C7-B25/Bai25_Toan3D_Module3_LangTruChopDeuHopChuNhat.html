    "athenaGuidance":"Bài học đặt học sinh vào vai người điều khiển Athena trong kho hàng để đo và phân loại khối 3D. 1) Câu hỏi: Container nào xếp chồng an toàn? — Lựa chọn: Container A; Container B; Container C; học sinh có thể chọn nhiều đáp án. 2) Câu hỏi: Giá đỡ nào ổn định, nghĩa là đỉnh cách đều bốn góc đáy? — Lựa chọn: Giá đỡ 1; Giá đỡ 2. 3) Câu hỏi: Với một hình chóp đều, các mặt bên có luôn vuông góc với đáy không? — Lựa chọn: Có, luôn vuông góc; Không, đó không phải tính chất chung. Hãy gợi học sinh hình dung chóp rất thấp để bác bỏ nhận định sai; không khẳng định mọi mặt bên vuông góc đáy. 4) Tương tác: chọn hai đường chéo của container 4×3×2 m để đo độ dài và giao điểm; lưu ý tính chất bằng nhau không đúng cho hình hộp xiên bất kỳ. 5) Ôn diện tích: hình vuông cạnh a có S=a²; hình chữ nhật a×b có S=ab; đa giác đều có S bằng một nửa chu vi nhân trung đoạn. 6) Hoạt động: phân loại Rubik, container chữ nhật, container xiên, hộp quà ngũ giác, giá đỡ chóp và khối đá vào các kệ Lăng trụ đứng, Lăng trụ đều, Lăng trụ xiên, Không phải lăng trụ. Rubik và hộp quà được chấp nhận ở cả kệ lăng trụ đứng và lăng trụ đều. Athena chỉ đưa gợi ý theo dữ kiện cạnh bên, đáy và chân đường cao; không bao giờ nói thẳng đáp án trước khi học sinh hết lượt hoặc đã trả lời."

  <script>
  (()=>{'use strict';
    function LMS(){return window.AiducationLMS||{ready(){},progress(){},event(){},state(){},complete(){},resize(){}}}
    const canvas=document.getElementById('three-canvas'),wrap=document.getElementById('canvas-wrap'),content=document.getElementById('content'),measureEl=document.getElementById('measure'),chip=document.getElementById('scene-chip');

    const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(44,1,.1,100),controls=new THREE.OrbitControls(camera,canvas);controls.enableDamping=true;controls.minDistance=4;controls.maxDistance=22;scene.add(new THREE.HemisphereLight(0xe8f3ff,0x172235,1.25));const sun=new THREE.DirectionalLight(0xffffff,1);sun.position.set(6,9,7);scene.add(sun);
    const C={blue:0x3b82f6,purple:0xa78bfa,green:0x34d399,orange:0xfb923c,pink:0xe879f9,base:0x64748b,edge:0xe6edf3,hidden:0x444d56,result:0xFAC775,wrong:0xef6b4a};

    function prism(points,height,offset,pos,color,key,label){const vertices=[],n=points.length;points.forEach(p=>vertices.push(p[0],0,p[1]));points.forEach(p=>vertices.push(p[0]+offset.x,height,p[1]+offset.z));const indices=[];for(let i=1;i<n-1;i++){indices.push(0,i+1,i,n,n+i,n+i+1)}for(let i=0;i<n;i++){const j=(i+1)%n;indices.push(i,j,n+j,i,n+j,n+i)}const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));geometry.setIndex(indices);geometry.computeVertexNormals();const group=new THREE.Group(),mesh=new THREE.Mesh(geometry,material(color,.4));group.add(mesh);group.add(new THREE.LineSegments(new THREE.EdgesGeometry(geometry),edgeMaterial()));group.position.copy(pos);root.add(group);if(key){mesh.userData.key=key;pickables.push(mesh)}if(label)addLabel(label,pos.clone().add(V(offset.x*.5,height+.35,0)));return group}
    function pyramid(base,apex,pos,color,key,label){const points=[[-base/2,0,-base/2],[base/2,0,-base/2],[base/2,0,base/2],[-base/2,0,base/2],[apex.x,apex.y,apex.z]],indices=[0,2,1,0,3,2,0,1,4,1,2,4,2,3,4,3,0,4],geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.Float32BufferAttribute(points.flat(),3));geometry.setIndex(indices);geometry.computeVertexNormals();const group=new THREE.Group(),mesh=new THREE.Mesh(geometry,material(color,.43));group.add(mesh);group.add(new THREE.LineSegments(new THREE.EdgesGeometry(geometry),edgeMaterial()));const footGeo=new THREE.BufferGeometry().setFromPoints([V(apex.x,apex.y,apex.z),V(apex.x,0,apex.z)]),foot=new THREE.Line(footGeo,new THREE.LineDashedMaterial({color:C.result,dashSize:.16,gapSize:.1}));foot.computeLineDistances();group.add(foot);group.position.copy(pos);root.add(group);mesh.userData.key=key;pickables.push(mesh);addLabel(label,pos.clone().add(apex).add(V(0,.35,0)));return group}
    function addLine(a,b,color,key,label){const geometry=new THREE.BufferGeometry().setFromPoints([a,b]),line=new THREE.Line(geometry,new THREE.LineBasicMaterial({color,linewidth:2}));line.userData.key=key;root.add(line);pickables.push(line);if(label)addLabel(label,a.clone().lerp(b,.5),key?'result':'');return line}
    function ground(size=13){const grid=new THREE.GridHelper(size,Math.round(size),0x38516a,0x20364d);grid.material.opacity=.45;grid.material.transparent=true;root.add(grid)}
    function setCamera(pos,target=V(0,1,0)){camera.position.copy(pos);controls.target.copy(target);controls.update()}
    function buildStep1(){clearScene();ground(14);const tri=[[-1.15,-.85],[1.1,-.65],[-.35,1.05]],hex=Array.from({length:6},(_,i)=>[Math.cos(Math.PI/3*i),Math.sin(Math.PI/3*i)]);prism(tri,2.7,V(),V(-4,0,0),C.blue,'A','A');prism(hex,2.7,V(),V(0,0,0),C.green,'B','B');prism(hex,2.55,V(.75,0,0),V(3.8,0,0),C.orange,'C','C');chip.textContent='Kho container · chạm từng khối để đo';setCamera(V(8,7.2,14),V(0,1.2,0))}
    function buildStep2(){clearScene();ground(12);pyramid(2,V(0,Math.sqrt(15),0),V(-2.6,0,0),C.green,'support1','Giá 1');pyramid(2,V(1.6,Math.sqrt(12.328),1),V(2.2,0,0),C.purple,'support2','Giá 2');chip.textContent='Hai giá đỡ · chạm để đo bốn cạnh';setCamera(V(8,6.3,10),V(0,1.6,0))}
    function buildStep3(){clearScene();ground(10);box(V(4,2,3),V(0,1,0),C.blue,'box','4 × 3 × 2 m');const a=V(-2,0,-1.5),g=V(2,2,1.5),b=V(2,0,-1.5),h=V(-2,2,1.5);addLine(a,g,C.result,'diag1','d₁');addLine(b,h,C.orange,'diag2','d₂');const center=new THREE.Mesh(new THREE.SphereGeometry(.1,16,12),material(C.result,1));center.position.set(0,1,0);root.add(center);addLabel('I',V(0,1.2,0),'result');chip.textContent='Container 4 × 3 × 2 m · chọn hai đường chéo';setCamera(V(7,5.2,8),V(0,1,0))}
    function buildCargo(){clearScene();ground(9);if(sortIndex>=cargo.length){buildSummaryScene();return}const item=cargo[sortIndex];if(item.id==='rubik')box(V(2.4,2.4,2.4),V(0,1.2,0),C.green,'cargo','Rubik');else if(item.id==='box')box(V(4,2,2.3),V(0,1,0),C.blue,'cargo','Container');else if(item.id==='skew'){const hex=Array.from({length:6},(_,i)=>[Math.cos(Math.PI/3*i)*1.2,Math.sin(Math.PI/3*i)*1.2]);prism(hex,2.5,V(.85,0,0),V(0,0,0),C.orange,'cargo','Xiên')}else if(item.id==='gift'){const pent=Array.from({length:5},(_,i)=>[Math.cos(-Math.PI/2+Math.PI*2/5*i)*1.35,Math.sin(-Math.PI/2+Math.PI*2/5*i)*1.35]);prism(pent,2.6,V(),V(0,0,0),C.pink,'cargo','Hộp quà')}else if(item.id==='pyramid')pyramid(3,V(0,3.2,0),V(),C.purple,'cargo','Hình chóp');else{const geometry=new THREE.DodecahedronGeometry(1.55,0),group=new THREE.Group(),mesh=new THREE.Mesh(geometry,material(C.base,.72)),edges=new THREE.LineSegments(new THREE.EdgesGeometry(geometry),edgeMaterial());group.add(mesh,edges);group.scale.set(1.2,.85,1);group.position.y=1.4;mesh.userData.key='cargo';root.add(group);pickables.push(mesh);addLabel('Khối đá',V(0,3,0))}chip.textContent=`Băng chuyền · kiện ${sortIndex+1}/6`;measureEl.textContent='KÉO HOẶC CHẠM';setCamera(V(6,4.6,7),V(0,1.2,0))}
    function buildSummaryScene(){clearScene();ground(10);box(V(2,2,2),V(-2.5,1,0),C.green,null,'Đã phân loại');pyramid(2.4,V(0,2.7,0),V(2.3,0,0),C.purple,null,'6/6');chip.textContent='Kho hàng đã được phân loại';measureEl.textContent='HOÀN TẤT';setCamera(V(7,5,8),V(0,1,0))}
    function buildScene(){if(step===1)buildStep1();else if(step===2)buildStep2();else if(step===3)buildStep3();else buildCargo()}
    function notebook(){const items=['<b>Lăng trụ đứng:</b> cạnh bên vuông góc với hai đáy; đáy có thể là đa giác bất kỳ.'];if(unlocked>=2)items.push('<b>Lăng trụ đều:</b> lăng trụ đứng có thêm điều kiện đáy là đa giác đều.','<b>Chóp đều:</b> đáy đều và chân đường cao trùng tâm đáy; chóp đều không kéo theo mọi mặt bên vuông góc đáy.','<b>Diện tích đáy cơ bản:</b> hình vuông cạnh a có S = a²; hình chữ nhật a × b có S = ab; đa giác đều có S = ½ × chu vi × trung đoạn.');if(unlocked>=3)items.push('<b>Hình hộp chữ nhật:</b> các đường chéo bằng nhau và cắt nhau tại trung điểm mỗi đường; không suy rộng tính chất bằng nhau cho hình hộp xiên bất kỳ.');if(unlocked>=4)items.push('<b>Hình lập phương:</b> hình hộp chữ nhật có tất cả các cạnh bằng nhau.');return `<details class="notebook"><summary><i class="ti ti-notebook"></i> Sổ tay kiến thức</summary><ul>${items.map(x=>`<li>${x}</li>`).join('')}</ul></details>`}
    function feedback(done,success,strikes,successText,failText,hint){if(done)return `<div class="feedback ${success?'good':'bad'}">${success?successText:failText}</div>`;if(strikes>0)return `<div class="feedback warn"><b>Gợi ý lần ${strikes}/3:</b> ${hint}</div>`;return ''}
    function render1(){const all=s1Measured.length===3;content.innerHTML=`<p class="eyebrow">Bước 1 · Đứng khác đều</p><h2 class="title">Kiểm định ba container</h2><div class="athena"><b>✦ Athena</b>Chỉ container có cạnh bên vuông góc với hai đáy mới xếp chồng ổn định. Hãy chạm từng khối để đo, bất kể đáy đẹp hay xấu.</div><div class="measure-grid">${[['A','90,00°'],['B','90,00°'],['C','73,50°']].map(([id,value])=>`<button class="measure-card ${s1Measured.includes(id)?'seen':''}" onclick="m3.measureContainer('${id}')"><b>Container ${id}</b>${s1Measured.includes(id)?`<span class="mono">${value}</span>`:'Chạm để đo'}</button>`).join('')}</div>${all?`<div class="card" id="s1-card"><h3>Container nào xếp chồng an toàn?</h3><p class="small">Có thể chọn nhiều đáp án rồi nhấn kiểm tra.</p>${['A','B','C'].map(id=>`<button class="choice ${s1Selected.includes(id)?'selected':''} ${s1Done&&['A','B'].includes(id)?'correct':s1Done&&id==='C'?'wrong':''}" ${s1Done?'disabled':''} onclick="m3.toggleContainer('${id}')">Container ${id}</button>`).join('')}<button class="btn primary" ${s1Done?'disabled':''} onclick="m3.submitContainers()">Kiểm tra lựa chọn</button>${feedback(s1Done,s1Success,s1Strikes,'Chính xác. A đáy không đều nhưng vẫn đứng; B vừa đứng vừa đều.','Đáp án đúng là A và B. C có đáy đều nhưng cạnh bên xiên.','“Đứng” phụ thuộc cạnh bên ⟂ đáy, không phụ thuộc đáy có đẹp hoặc đều.')}</div>`:'<div class="feedback info">Hãy đo đủ A, B và C trước khi phân loại.</div>'}${notebook()}<div class="btn-row"><button class="btn primary" ${!s1Done?'disabled':''} onclick="m3.next()">Sang giá đỡ hình chóp →</button></div>`}
    function render2(){const both=s2Measured.length===2;content.innerHTML=`<p class="eyebrow">Bước 2 · Chóp đều</p><h2 class="title">Tâm đáy quyết định cân bằng</h2><div class="athena"><b>✦ Athena</b>Hai giá đều có đáy hình vuông. Giá nào có đỉnh cách đều bốn góc và đủ ổn định để treo biển?</div><div class="stats"><button class="measure-card ${s2Measured.includes('support1')?'seen':''}" onclick="m3.measureSupport('support1')"><b>Giá đỡ 1</b>${s2Measured.includes('support1')?'<span class="mono">4,123 · 4,123<br>4,123 · 4,123</span>':'Đo SA, SB, SC, SD'}</button><button class="measure-card ${s2Measured.includes('support2')?'seen':''}" onclick="m3.measureSupport('support2')"><b>Giá đỡ 2</b>${s2Measured.includes('support2')?'<span class="mono">4,805 · 4,085<br>3,562 · 4,369</span>':'Đo SA, SB, SC, SD'}</button></div><div class="card"><h3>Ôn diện tích đáy</h3><p class="small">Đáy giá đỡ là hình vuông cạnh 2 m.</p><div class="mono">S<sub>đáy</sub> = 2² = 4 m²</div></div>${both?`<div class="card"><h3>Giá nào ổn định?</h3><button class="choice ${s2SupportDone&&s2Support===1?'correct':s2Support===2?'wrong':''}" ${s2SupportDone?'disabled':''} onclick="m3.answerSupport(1)">Giá đỡ 1</button><button class="choice ${s2Support===2?'wrong':''}" ${s2SupportDone?'disabled':''} onclick="m3.answerSupport(2)">Giá đỡ 2</button>${s2SupportDone?'<div class="feedback good">Giá 1 là chóp đều: đáy đều và đỉnh chiếu đúng tâm đáy. Giá 2 có đỉnh lệch tâm.</div>':''}</div>`:''}${s2SupportDone?`<div class="card" id="face-card"><h3>Mặt bên của chóp đều có luôn vuông góc đáy?</h3><button class="choice ${s2FaceStrikes>0&&!s2FaceSuccess?'wrong':''}" ${s2FaceDone?'disabled':''} onclick="m3.answerFace(true)">Có, luôn vuông góc</button><button class="choice ${s2FaceDone?'correct':''}" ${s2FaceDone?'disabled':''} onclick="m3.answerFace(false)">Không, đó không phải tính chất chung</button>${feedback(s2FaceDone,s2FaceSuccess,s2FaceStrikes,'Đúng. Đây không phải tính chất chung của chóp đều. Với chóp rất thấp, mặt bên gần nằm ngang; chỉ trong cấu hình đặc biệt góc giữa mặt bên và đáy mới có thể tiến gần góc vuông.','Đáp án đúng đã được đánh dấu. Một chóp đều rất thấp cho thấy mặt bên không vuông góc đáy.','Hãy tưởng tượng một chóp đều rất thấp, gần như dẹt: mặt bên gần nằm ngang hay gần thẳng đứng?')}</div>`:''}${notebook()}<div class="btn-row"><button class="btn secondary" onclick="m3.prev()">← Quay lại</button><button class="btn primary" ${!s2FaceDone?'disabled':''} onclick="m3.next()">Đo đường chéo container →</button></div>`}
    function render3(){content.innerHTML=`<p class="eyebrow">Bước 3 · Hình hộp chữ nhật</p><h2 class="title">Hai đường chéo qua tâm khối</h2><div class="athena"><b>✦ Athena</b>Container có kích thước 4 × 3 × 2 m. Chạm lần lượt d₁ và d₂ trên mô hình để đo.</div><div class="card"><h3>Kết quả đo</h3><button class="choice ${s3Measured.includes('diag1')?'correct':''}" onclick="m3.measureDiagonal('diag1')"><span class="mono">d₁</span> ${s3Measured.includes('diag1')?'= 5,3852 m':'— chạm để đo'}</button><button class="choice ${s3Measured.includes('diag2')?'correct':''}" onclick="m3.measureDiagonal('diag2')"><span class="mono">d₂</span> ${s3Measured.includes('diag2')?'= 5,3852 m':'— chạm để đo'}</button>${s3Done?'<div class="feedback good">Hai đường chéo bằng nhau và cùng đi qua I(2; 1,5; 1), là trung điểm của mỗi đường.</div><div class="feedback warn"><b>Phạm vi áp dụng:</b> đường chéo bằng nhau là tính chất của hình hộp chữ nhật, không đúng với hình hộp xiên bất kỳ.</div>':'<div class="feedback info">Cần chọn đủ hai đường chéo để so sánh.</div>'}</div><div class="card"><h3>Kiểm chứng độ dài và diện tích đáy</h3><div class="mono">d = √(4² + 3² + 2²) = √29 ≈ 5,3852 m<br>S<sub>đáy</sub> = 4 × 3 = 12 m²</div></div>${notebook()}<div class="btn-row"><button class="btn secondary" onclick="m3.prev()">← Quay lại</button><button class="btn primary" ${!s3Done?'disabled':''} onclick="m3.next()">Mở băng chuyền →</button></div>`}
    function render4(){if(sortIndex>=cargo.length){renderSummary();return}const item=cargo[sortIndex];content.innerHTML=`<p class="eyebrow">Bước 4 · Phân loại tổng hợp</p><h2 class="title">Băng chuyền sáu khối</h2><div class="athena"><b>✦ Athena</b>Kéo kiện hàng vào một kệ. Trên mobile, bạn cũng có thể chạm kiện rồi chạm kệ.</div><div class="sort-progress"><span>Đã xếp ${sortIndex}/6</span><span>Sai ${sortAttempts} lượt</span></div><div class="conveyor"><div class="cargo ${selectedCargo?'selected':''}" id="cargo" draggable="true" tabindex="0" role="button" aria-pressed="${selectedCargo}" onclick="m3.selectCargo()"><span>${item.icon}</span><span>${item.name}</span></div></div><div class="shelves">${Object.entries(shelfNames).map(([id,name])=>`<button class="shelf" data-shelf="${id}" onclick="m3.dropCargo('${id}')">${name}</button>`).join('')}</div><div id="sort-feedback" aria-live="polite"></div>${notebook()}<div class="btn-row"><button class="btn secondary" onclick="m3.prev()">← Quay lại</button></div>`;bindDrag()}
    function renderSummary(){content.innerHTML=`<p class="eyebrow">Bước 4 · Hoàn tất phân loại</p><h2 class="title">Kho hàng đã an toàn</h2><div class="feedback good"><b>Đã phân loại đủ 6/6 khối.</b> Hãy xem lại lý do của từng kiện.</div><div class="card"><h3>Lý do phân loại sáu khối</h3><ol class="reason-list">${cargo.map((item,i)=>`<li><b>${item.name}:</b> ${item.reason} <span class="mono">→ ${shelfNames[sortAnswers[i]]}</span></li>`).join('')}</ol></div><div class="feedback warn"><b>Hai bẫy quan trọng:</b> container đáy đều vẫn có thể là lăng trụ xiên; hình chóp chỉ có một đáy nên không phải lăng trụ.</div><div class="card"><h3>Tổng hợp kiến thức Module 3</h3><div class="table-scroll"><table class="summary-table"><thead><tr><th>Khối kiến thức</th><th>Nội dung</th><th>Xem lại</th></tr></thead><tbody><tr><td>1. Đứng ≠ Đều</td><td>Lăng trụ đứng có cạnh bên ⟂ đáy; lăng trụ đều còn yêu cầu đáy đều.</td><td>Bước 1 · A, B, C</td></tr><tr><td>2. Chóp đều</td><td>Đáy đều và chân đường cao trùng tâm đáy; mặt bên không luôn ⟂ đáy.</td><td>Bước 2 · Hai giá đỡ</td></tr><tr><td>3. Hình hộp chữ nhật</td><td>Đường chéo bằng nhau, cắt nhau tại trung điểm; không suy rộng cho hộp xiên.</td><td>Bước 3 · Container</td></tr><tr><td>4. Phân loại tổng hợp</td><td>Sáu khối với hai bẫy: đáy đều nhưng xiên và hình chóp chỉ có một đáy.</td><td>Bước 4 · Băng chuyền</td></tr></tbody></table></div></div>${notebook()}${finished?'<div class="feedback good"><b>Hoàn thành Module 3!</b> Bạn đã phân biệt được đứng – đều, chóp đều và tính chất đường chéo hình hộp.</div>':''}<div class="btn-row"><button class="btn secondary" onclick="m3.prev()">← Quay lại</button><button class="btn primary" id="finish-btn" ${finished?'disabled':''} onclick="m3.finish()">${finished?'✓ Đã hoàn thành':'Hoàn thành Module'}</button></div>`}
    function render(){document.getElementById('progress').textContent=`BƯỚC ${step}/4`;document.querySelectorAll('.tab').forEach(tab=>{const n=+tab.dataset.step;tab.disabled=n>unlocked;tab.classList.toggle('active',n===step);tab.classList.toggle('done',n<unlocked)});if(step===1)render1();else if(step===2)render2();else if(step===3)render3();else render4();reportHeight();saveState('xem bước '+step)}
    function progress(){const done=[s1Done,s2FaceDone,s3Done,sortIndex>=6].filter(Boolean).length;safe(()=>LMS().progress({done,total:4}),'progress')}
    function saveState(lastAction){safe(()=>LMS().state({currentStep:step,totalSteps:4,unlocked,finished,s1Measured,s1Selected,s1Strikes,s1Done,s1Success,s2Measured,s2Support,s2SupportDone,s2SupportSuccess,s2FaceStrikes,s2FaceDone,s2FaceSuccess,s3Measured,s3Done,sortIndex,sortAttempts,sortAnswers,lastAction}),'state')}
    function go(n){if(n<1||n>unlocked)return;step=n;selectedCargo=false;buildScene();render()}
    function next(){if(step===1&&!s1Done||step===2&&!s2FaceDone||step===3&&!s3Done)return;unlocked=Math.max(unlocked,Math.min(4,step+1));progress();go(step+1)}
    function pulse(id){const el=document.getElementById(id);if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}}
    function measureContainer(id){if(!s1Measured.includes(id))s1Measured.push(id);measureEl.textContent=`${id}: ${id==='C'?'73,50°':'90,00°'}`;safe(()=>LMS().event('measured',{id:'prism-edge-angle',container:id,value:id==='C'?73.5:90}),'event');render1();saveState('đo container '+id)}
    function toggleContainer(id){if(s1Done)return;s1Selected=s1Selected.includes(id)?s1Selected.filter(x=>x!==id):[...s1Selected,id];render1();saveState('chọn container '+id)}
    function submitContainers(){if(s1Done||!s1Selected.length)return;const correct=s1Selected.length===2&&s1Selected.includes('A')&&s1Selected.includes('B');if(correct){s1Done=true;s1Success=true}else{s1Strikes++;if(s1Strikes>=3){s1Done=true;s1Selected=['A','B']}}render1();if(!correct&&!s1Done)pulse('s1-card');safe(()=>LMS().event('answered',{id:'prism-sort',chosen:s1Selected.join(','),correct,strike:s1Strikes}),'event');progress();saveState('kiểm tra container an toàn')}
    function measureSupport(id){if(!s2Measured.includes(id))s2Measured.push(id);measureEl.textContent=id==='support1'?'4 CẠNH = 4,123':'4 CẠNH KHÁC NHAU';safe(()=>LMS().event('measured',{id:'pyramid-edges',support:id,values:id==='support1'?[4.123,4.123,4.123,4.123]:[4.805,4.085,3.562,4.369]}),'event');render2();saveState('đo '+id)}
    function answerSupport(choice){if(s2SupportDone)return;s2Support=choice;const correct=choice===1;if(correct){s2SupportDone=true;s2SupportSuccess=true}render2();safe(()=>LMS().event('answered',{id:'regular-pyramid',chosen:'Giá đỡ '+choice,correct}),'event');saveState('chọn giá đỡ '+choice)}
    function answerFace(yes){if(s2FaceDone)return;const correct=!yes;if(correct){s2FaceDone=true;s2FaceSuccess=true}else{s2FaceStrikes++;if(s2FaceStrikes>=3)s2FaceDone=true}render2();if(!correct&&!s2FaceDone)pulse('face-card');safe(()=>LMS().event('answered',{id:'pyramid-side-face',chosen:yes?'Có':'Không',correct,strike:s2FaceStrikes}),'event');progress();saveState('trả lời mặt bên chóp đều')}
    function measureDiagonal(id){if(!s3Measured.includes(id))s3Measured.push(id);measureEl.textContent=`${id==='diag1'?'d₁':'d₂'} = 5,3852 m`;s3Done=s3Measured.length===2;render3();safe(()=>LMS().event('measured',{id:'box-diagonals',diagonal:id,value:5.3852,midpoint:[2,1.5,1]}),'event');progress();saveState('đo '+id)}
