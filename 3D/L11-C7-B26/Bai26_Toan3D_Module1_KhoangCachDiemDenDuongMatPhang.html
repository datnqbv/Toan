  <script type="application/json" id="athena-context">

      "Thực hiện quy trình tính khoảng cách bằng hệ thức lượng trong hình chóp đều",
      "Thành thạo kỹ thuật kẻ hai lần trong hình lăng trụ/hình hộp",
      "Vận dụng thành thạo kỹ thuật dời điểm theo tỉ số khoảng cách"

    "structure": [
      { "id": "step1-definition", "title": "Khoảng cách ngắn nhất" },
      { "id": "step2-trig-calc", "title": "Tính bằng hệ thức lượng" },
      { "id": "step3-two-step-draw", "title": "Kỹ thuật kẻ hai lần" },
      { "id": "step4-point-shift", "title": "Kỹ thuật dời điểm" }
    ],
    "misconceptions": [
      "Dùng đoạn thẳng bất kỳ nối điểm với đường/mặt mà không kiểm tra tính vuông góc",
      "Xác định sai chân đường vuông góc khi đáy hình học không quen thuộc",
      "Kẻ đường vuông góc nhưng không chứng minh được nó vuông góc với mặt phẳng",
      "Quên kỹ thuật kẻ hai lần để tìm đoạn vuông góc thực sự",
      "Lập sai tỉ số hệ số khoảng cách khi dời điểm"
    ],
    "athenaGuidance": "Bối cảnh xuyên suốt: Kỹ sư xây dựng Trạm phát sóng viễn thông. Bước 1: Kéo điểm K dọc theo con đường a để thấy MK nhỏ nhất khi K trùng H (MH vuông góc a). Bước 2: Tính chiều cao giá đỡ 3 chân tripod bằng cách tìm bán kính đáy OA trước, rồi dùng Pythagore tính SO = 140,71cm. Bước 3: Khung thiết bị hình hộp đứng đáy thoi, kẻ AO vuông góc BD trong đáy rồi chứng minh AO vuông góc (BDD'B') để ra d = 2,57m. Bước 4: Dây giằng néo cột, di chuyển điểm M trên SA và quan sát khoảng cách d(M,đáy) thay đổi đúng theo tỉ lệ MA/SA. Khi SM:MA = 1:3 thì d = 3/4 * 8m = 6m."
  }

  <!-- MAIN APP SHELL -->
  <main class="app-shell">
    
    <!-- 3D VIEWPORT -->
    <section class="viewport" id="canvas-wrap" aria-label="Mô hình hình học 3D">

  <!-- JAVASCRIPT THREE.JS ENGINE & LESSON LOGIC -->
  <script>
  (() => {
    'use strict';

    // 0. LMS INTEGRATION
    const LMS = () => window.AiducationLMS || {
      ready() {}, progress() {}, event() {}, state() {}, complete() {}, resize() {}
    };

    // 1. THREE.JS INITIALIZATION
    const canvas = document.getElementById('three-canvas');
    const wrap = document.getElementById('canvas-wrap');
    const stepBody = document.getElementById('step-body');
    const labelLayer = document.getElementById('label-layer');
    const headerProgress = document.getElementById('header-progress');
    const sceneChip = document.getElementById('scene-chip');
    const distanceReadout = document.getElementById('distance-readout');

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0x0a1628);
    renderer.outputEncoding = THREE.sRGBEncoding;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 100);
    const controls = new THREE.OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 4;
    controls.maxDistance = 26;

    // Lights
    scene.add(new THREE.HemisphereLight(0xddeeff, 0x172235, 1.2));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.15);
    dirLight.position.set(6, 10, 8);
    scene.add(dirLight);

    const backLight = new THREE.DirectionalLight(0x38bdf8, 0.4);
    backLight.position.set(-6, -4, -6);
    scene.add(backLight);

    // Color Palette Tokens
    const COLORS = {
      slate: 0x4E6E7E,
      sand: 0xD8C4A0,
      sandFill: 0xD8C4A0,
      jade: 0x2D8B6F,
      accent: 0xE8A24A,
      ochre: 0xB9782D,
      point: 0xFAC775,
      axis: 0x475569,
      groundGrid: 0x1e293b
    };

    // State Variables
    let currentStep = 1;
    let unlocked = 1;
    let rootGroup = null;
    let labels = [];
    let objects = {};
    let dragTarget = null;

    let kX = 2.5;           // Bước 1: Vị trí K trên đường x
    let mRatio = 0.5;       // Bước 4: Vị trí M trên SA (0 to 1)
    let wasKAtH = false;
    let step2Stage = 0;     // 0: chọn O, 1: tính OA, 2: tính SO, 3: hoàn tất
    let step3Stage = 0;     // 0: dựng AO, 1: AO⊥BD, 2: AO⊥BB', 3: hoàn tất

    // Quiz & Strikes
    let q1Strikes = 0, q1Done = false;
    let q3Strikes = 0, q3Done = false;
    let q4Strikes = 0, q4Done = false;
    let q1Correct = false, q3Correct = false, q4Correct = false;
    let q1Chosen = null, q3Chosen = null, q4Chosen = null;
    let step2FootChosen = null, step2OAChosen = null, step2SOChosen = null;
    let step3CheckBD = null, step3CheckBB = null;
    let completed = false;

    // Math Helpers
    const V = (x=0, y=0, z=0) => new THREE.Vector3(x, y, z);
    const fmt = n => n.toFixed(2).replace('.', ',');

    function dispose(obj) {
      if (!obj) return;
      obj.traverse(o => {
        if (o.geometry) o.geometry.dispose();
        if (o.material) {
          (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose());
        }
      });
      if (obj.parent) obj.parent.remove(obj);
    }

    function clearScene() {
      dispose(rootGroup);
      rootGroup = new THREE.Group();
      scene.add(rootGroup);
      labels.forEach(x => x.el.remove());
      labels = [];
      objects = {};
    }

    // 2. GEOMETRIC BUILDER HELPERS
    function addLabel(text, pos, cls = '') {
      const el = document.createElement('div');
      el.className = 'label ' + cls;
      el.textContent = text;
      labelLayer.appendChild(el);
      const item = { el, pos };
      labels.push(item);
      return item;
    }

    function line(a, b, color, width = 1.5, dashed = false) {
      const g = new THREE.BufferGeometry().setFromPoints([a, b]);
      let m;
      if (dashed) {
        m = new THREE.LineDashedMaterial({ color, dashSize: 0.2, gapSize: 0.1, linewidth: width });
      } else {
        m = new THREE.LineBasicMaterial({ color, linewidth: width, transparent: true, opacity: 0.95 });
      }
      const l = new THREE.Line(g, m);
      if (dashed) l.computeLineDistances();
      rootGroup.add(l);
      return l;
    }

    function updateLine(lineObj, a, b) {
      lineObj.geometry.setFromPoints([a, b]);
      lineObj.geometry.attributes.position.needsUpdate = true;
      if (lineObj.material.isLineDashedMaterial) lineObj.computeLineDistances();
    }

    function dot(pos, color = COLORS.point, r = 0.1, name = '') {
      const g = new THREE.SphereGeometry(r, 20, 16);
      const m = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.35 });
      const mesh = new THREE.Mesh(g, m);
      mesh.position.copy(pos);
      mesh.userData.name = name;
      rootGroup.add(mesh);
      return mesh;
    }

    function cylinderLeg(a, b, r = 0.045, color = COLORS.slate) {
      const dir = b.clone().sub(a);
      const len = dir.length();
      const g = new THREE.CylinderGeometry(r, r, len, 16);
      const m = new THREE.MeshStandardMaterial({ color, metalness: 0.3, roughness: 0.4 });
      const mesh = new THREE.Mesh(g, m);
      mesh.position.copy(a.clone().add(b).multiplyScalar(0.5));
      mesh.quaternion.setFromUnitVectors(V(0, 1, 0), dir.clone().normalize());
      rootGroup.add(mesh);
      return mesh;
    }

    function boxBeam(a, b, thickness = 0.075, color = COLORS.slate) {
      const dir = b.clone().sub(a);
      const len = dir.length();
      const g = new THREE.BoxGeometry(thickness, len, thickness);
      const m = new THREE.MeshStandardMaterial({ color, metalness: 0.72, roughness: 0.28 });
      const mesh = new THREE.Mesh(g, m);
      mesh.position.copy(a.clone().add(b).multiplyScalar(0.5));
      mesh.quaternion.setFromUnitVectors(V(0, 1, 0), dir.clone().normalize());
      rootGroup.add(mesh);
      return mesh;
    }

    function curvedCable(a, b, sag = 0.32, color = COLORS.ochre) {
      const mid = a.clone().add(b).multiplyScalar(0.5);
      mid.y = Math.max(0.12, mid.y - sag);
      const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
      const g = new THREE.TubeGeometry(curve, 28, 0.022, 7, false);
      const m = new THREE.MeshStandardMaterial({ color, metalness: 0.15, roughness: 0.65 });
      const mesh = new THREE.Mesh(g, m);
      rootGroup.add(mesh);
      return mesh;
    }

    function saveState() {
      LMS().state({
        currentStep, unlocked, kX, mRatio, step2Stage, step3Stage,
        q1Strikes, q1Done, q1Correct,
        q3Strikes, q3Done, q3Correct,
        q4Strikes, q4Done, q4Correct,
        q1Chosen, q3Chosen, q4Chosen,
        step2FootChosen, step2OAChosen, step2SOChosen,
        step3CheckBD, step3CheckBB,
        completed
      });
    }

    function planeMesh(pts, color = COLORS.sandFill, opacity = 0.22) {
      const shape = new THREE.Shape();
      shape.moveTo(pts[0].x, pts[0].z);
      for (let i = 1; i < pts.length; i++) shape.lineTo(pts[i].x, pts[i].z);
      shape.closePath();
      const g = new THREE.ShapeGeometry(shape);
      g.rotateX(Math.PI / 2);
      const m = new THREE.MeshPhongMaterial({ color, transparent: true, opacity, side: THREE.DoubleSide, depthWrite: false });
      const mesh = new THREE.Mesh(g, m);
      mesh.position.y = pts[0].y;
      rootGroup.add(mesh);
      return mesh;
    }

    function quadMesh3D(a, b, c, d, color, opacity = 0.22) {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute([
        a.x,a.y,a.z, b.x,b.y,b.z, c.x,c.y,c.z,
        a.x,a.y,a.z, c.x,c.y,c.z, d.x,d.y,d.z
      ], 3));
      g.computeVertexNormals();
      const m = new THREE.MeshPhongMaterial({ color, transparent: true, opacity, side: THREE.DoubleSide, depthWrite: false });
      const mesh = new THREE.Mesh(g, m);
      rootGroup.add(mesh);
      return mesh;
    }

    function rightAngleMark(vertex, dir1, dir2, size = 0.25, color = COLORS.jade) {
      const u = dir1.clone().normalize().multiplyScalar(size);
      const v = dir2.clone().normalize().multiplyScalar(size);
      const p1 = vertex.clone().add(u);
      const p2 = vertex.clone().add(u).add(v);
      const p3 = vertex.clone().add(v);
      const g = new THREE.BufferGeometry().setFromPoints([p1, p2, p3]);
      const m = new THREE.LineBasicMaterial({ color, linewidth: 2 });
      const l = new THREE.Line(g, m);
      rootGroup.add(l);
      return l;
    }

    function angleArcXZ(vertex, startAngle, endAngle, radius = 0.65, color = COLORS.accent) {
      const pts = [];
      for (let i = 0; i <= 24; i++) {
        const t = i / 24;
        const a = startAngle + (endAngle - startAngle) * t;
        pts.push(V(vertex.x + Math.cos(a) * radius, vertex.y + 0.025, vertex.z + Math.sin(a) * radius));
      }
      const g = new THREE.BufferGeometry().setFromPoints(pts);
      const arc = new THREE.Line(g, new THREE.LineBasicMaterial({ color, linewidth: 2 }));
      rootGroup.add(arc);
      return arc;
    }

    // 3. SCENE BUILDERS

    // -------------------------------------------------------------
    // STEP 1: ĐỊNH NGHĨA KHOẢNG CÁCH NGẮN NHẤT
    // -------------------------------------------------------------
    function buildStep1Scene() {
      clearScene();

      // Sàn mặt đất
      planeMesh([V(-6, 0, -4), V(6, 0, -4), V(6, 0, 4), V(-6, 0, 4)], COLORS.sandFill, 0.15);
      const grid = new THREE.GridHelper(12, 12, 0x1e293b, 0x1e293b);
      grid.position.y = -0.01;
      rootGroup.add(grid);

      // Cột trạm phát sóng M(0, 4, 0)
      cylinderLeg(V(0, 0, 0), V(0, 4, 0), 0.08, COLORS.slate);
      dot(V(0, 4, 0), COLORS.slate, 0.14, 'M');
      dot(V(0, 0, 0), COLORS.jade, 0.1, 'H');

      // Vòng cung phát sóng tại đỉnh M
      for (let i = 1; i <= 3; i++) {
        const ringG = new THREE.RingGeometry(i * 0.35, i * 0.35 + 0.025, 32);
        const ringM = new THREE.MeshBasicMaterial({ color: COLORS.jade, transparent: true, opacity: 0.7 - i * 0.18, side: THREE.DoubleSide });
        const ring = new THREE.Mesh(ringG, ringM);
        ring.position.set(0, 4, 0);
        ring.rotation.x = Math.PI / 2;
        rootGroup.add(ring);
      }

      // Con đường thẳng a
      line(V(-6.5, 0, 0), V(6.5, 0, 0), COLORS.sand, 3);

      // Điểm K kéo được trên đường a
      objects.kMesh = dot(V(kX, 0, 0), COLORS.accent, 0.16, 'K');
      
      // Đoạn vuông góc chuẩn MH
      objects.mhLine = line(V(0, 4, 0), V(0, 0, 0), COLORS.jade, 2.5);
      objects.rightAngle = rightAngleMark(V(0, 0, 0), V(0, 1, 0), V(1, 0, 0), 0.35, COLORS.jade);

      // Đoạn nối thử MK
      objects.mkLine = line(V(0, 4, 0), V(kX, 0, 0), COLORS.accent, 2);

      // Labels
      addLabel('M', V(0, 4.3, 0), 'result');
      addLabel('H', V(0, -0.3, 0), 'jade');
      objects.kLabel = addLabel('K', V(kX, -0.35, 0), 'result');
      objects.mkMeasure = addLabel('MK', V(kX / 2, 2.15, 0), 'measure');
      addLabel('Đường a', V(5.5, 0.2, 0));
      addLabel('Mặt (P)', V(-4.8, 0, 3.2));

      updateStep1Geometry();
    }

    function updateStep1Geometry() {
      if (!objects.kMesh) return;
      const Kpos = V(kX, 0, 0);
      const Mpos = V(0, 4, 0);
      objects.kMesh.position.copy(Kpos);
      updateLine(objects.mkLine, Mpos, Kpos);
      objects.kLabel.pos.copy(Kpos).add(V(0, -0.35, 0));

      const dist = Math.sqrt(kX * kX + 16);
      const isAtH = Math.abs(kX) < 0.08;
      if (objects.mkMeasure) {
        objects.mkMeasure.pos.copy(Mpos.clone().add(Kpos).multiplyScalar(0.5)).add(V(0, 0.18, 0));
        objects.mkMeasure.el.textContent = `MK = ${fmt(dist)}m`;
      }

      if (isAtH) {
        objects.mkLine.material.color.setHex(COLORS.jade);
        objects.kMesh.material.color.setHex(COLORS.jade);
        distanceReadout.textContent = `MK = MH = 4,00m (NGẮN NHẤT)`;
        distanceReadout.style.borderColor = '#34D399';
        distanceReadout.style.color = '#34D399';
        if (!wasKAtH) {
          distanceReadout.classList.remove('lock-pulse');
          void distanceReadout.offsetWidth;
          distanceReadout.classList.add('lock-pulse');
          objects.kMesh.scale.setScalar(1.28);
          setTimeout(() => { if (objects.kMesh) objects.kMesh.scale.setScalar(1); }, 420);
        }
      } else {
        objects.mkLine.material.color.setHex(COLORS.accent);
        objects.kMesh.material.color.setHex(COLORS.accent);
        distanceReadout.textContent = `MK = ${fmt(dist)}m ≥ 4,00m`;
        distanceReadout.style.borderColor = 'rgba(250,199,117,.5)';
        distanceReadout.style.color = '#FAC775';
      }
      wasKAtH = isAtH;

      const out = document.querySelector('[data-out="kx"]');
      if (out) out.textContent = fmt(kX) + 'm';
      const mVal = document.getElementById('measured-dist-val');
      if (mVal) mVal.textContent = fmt(dist) + 'm';
    }

    // -------------------------------------------------------------
    // STEP 2: TÍNH BẰNG HỆ THỨC LƯỢNG (GIÁ ĐỠ 3 CHÂN TRIPOD)
    // -------------------------------------------------------------
    function buildStep2Scene() {
      clearScene();

      const rO = 1.732;
      const hSO = 4.69;

      const S = V(0, hSO, 0);
      const A = V(rO * Math.cos(Math.PI / 2), 0, -rO * Math.sin(Math.PI / 2));
      const B = V(rO * Math.cos(Math.PI / 2 + 2 * Math.PI / 3), 0, -rO * Math.sin(Math.PI / 2 + 2 * Math.PI / 3));
      const C = V(rO * Math.cos(Math.PI / 2 + 4 * Math.PI / 3), 0, -rO * Math.sin(Math.PI / 2 + 4 * Math.PI / 3));
      const O = V(0, 0, 0);

      // Mặt đất đáy tam giác đều
      planeMesh([A, B, C], COLORS.sandFill, 0.28);
      line(A, B, COLORS.sand, 2);
      line(B, C, COLORS.sand, 2);
      line(C, A, COLORS.sand, 2);

      // 3 chân giá đỡ tripod
      cylinderLeg(S, A, 0.055, COLORS.slate);
      cylinderLeg(S, B, 0.055, COLORS.slate);
      cylinderLeg(S, C, 0.055, COLORS.slate);

      dot(S, COLORS.point, 0.15, 'S');
      dot(A, COLORS.point, 0.1, 'A');
      dot(B, COLORS.point, 0.1, 'B');
      dot(C, COLORS.point, 0.1, 'C');
      objects.step2OMesh = dot(O, step2Stage >= 1 ? COLORS.jade : COLORS.accent, 0.15, 'O');

      // Chỉ mở các đường dựng khi học sinh hoàn thành đúng từng cửa.
      if (step2Stage >= 1) {
        objects.oaLine = line(O, A, COLORS.ochre, 2, true);
        rightAngleMark(O, V(0, 1, 0), A.clone().sub(O), 0.35, COLORS.jade);
        addLabel('OA = 51,96cm', O.clone().add(A).multiplyScalar(0.5).add(V(0, 0.15, 0)), 'measure');
      }
      if (step2Stage >= 2) {
        const confirmed = step2Stage >= 3;
        objects.soLine = line(S, O, confirmed ? COLORS.jade : COLORS.accent, confirmed ? 3 : 2, !confirmed);
        addLabel(confirmed ? 'SO = 140,71cm' : 'SO = ?', S.clone().add(O).multiplyScalar(0.5).add(V(0.2, 0, 0)), 'measure');
      }

      // Labels
      addLabel('S (Đỉnh)', S.clone().add(V(0, 0.35, 0)), 'result');
      addLabel('A', A.clone().add(V(0, -0.25, -0.2)));
      addLabel('B', B.clone().add(V(-0.25, -0.25, 0.1)));
      addLabel('C', C.clone().add(V(0.25, -0.25, 0.1)));
      addLabel(step2Stage >= 1 ? 'O (Tâm đáy)' : '? Chọn chân đường cao', O.clone().add(V(0.25, 0.15, 0.25)), step2Stage >= 1 ? 'jade' : 'result');

      const step2Readouts = [
        'Hãy xác định chân đường cao',
        'Đã chọn O · Hãy tính OA',
        'OA = 51,96cm · Hãy tính SO',
        'SO = 140,71cm · HOÀN TẤT'
      ];
      distanceReadout.textContent = step2Readouts[step2Stage];
      const done = step2Stage >= 3;
      distanceReadout.style.borderColor = done ? '#34D399' : 'rgba(250,199,117,.5)';
      distanceReadout.style.color = done ? '#34D399' : '#FAC775';
    }

    // -------------------------------------------------------------
    // STEP 3: KỸ THUẬT KẺ HAI LẦN (KHUNG HỘP ĐỨNG ĐÁY THOI)
    // -------------------------------------------------------------
    function buildStep3Scene() {
      clearScene();

      const aO = 2.5712;
      const bO = 3.064;
      const h = 5;

      const O = V(0, 0, 0);
      const A = V(-aO, 0, 0);
      const C = V(aO, 0, 0);
      const B = V(0, 0, bO);
      const D = V(0, 0, -bO);

      const A1 = A.clone().add(V(0, h, 0));
      const B1 = B.clone().add(V(0, h, 0));
      const C1 = C.clone().add(V(0, h, 0));
      const D1 = D.clone().add(V(0, h, 0));

      angleArcXZ(A, -50 * Math.PI / 180, 50 * Math.PI / 180, 0.72, COLORS.accent);
      addLabel('100°', A.clone().add(V(0.82, 0.12, 0)), 'measure');

      // Hai đáy mờ và khung nhôm BoxGeometry, không dùng line thuần.
      planeMesh([A, B, C, D], COLORS.sandFill, 0.2);
      planeMesh([A1, B1, C1, D1], COLORS.sandFill, 0.12);
      [[A,B],[B,C],[C,D],[D,A],[A1,B1],[B1,C1],[C1,D1],[D1,A1],
       [A,A1],[B,B1],[C,C1],[D,D1]].forEach(([p,q]) => boxBeam(p, q, 0.085, COLORS.slate));

      // Mặt phẳng chéo (BDD'B')
      quadMesh3D(B, D, D1, B1, 0x38bdf8, 0.22);
      line(B, D, COLORS.ochre, 2, true);
      line(B1, D1, COLORS.ochre, 1.5, true);

      // AO và các dấu xác nhận chỉ xuất hiện theo đúng tiến trình.
      if (step3Stage >= 1) {
        line(A, O, step3Stage >= 3 ? COLORS.jade : COLORS.accent, 3.5, step3Stage < 3);
        addLabel(step3Stage >= 3 ? 'AO = 2,57m' : 'AO đang kiểm tra', A.clone().add(O).multiplyScalar(0.5).add(V(0, 0.18, 0)), 'measure');
      }
      dot(O, step3Stage >= 1 ? COLORS.jade : COLORS.accent, 0.11, 'O');
      dot(A, COLORS.point, 0.12, 'A');
      dot(A1, COLORS.point, 0.12, "A'");
      dot(B, COLORS.point, 0.1, 'B');
      dot(D, COLORS.point, 0.1, 'D');

      if (step3Stage >= 2) rightAngleMark(O, V(-1, 0, 0), V(0, 0, 1), 0.35, COLORS.jade);
      if (step3Stage >= 3) rightAngleMark(A, V(1, 0, 0), V(0, 1, 0), 0.35, COLORS.jade);

      // Labels
      addLabel('A', A.clone().add(V(-0.25, 0, 0)), 'result');
      addLabel("A'", A1.clone().add(V(-0.3, 0.25, 0)), 'result');
      addLabel('B', B.clone().add(V(0, 0, 0.25)));
      addLabel('D', D.clone().add(V(0, 0, -0.25)));
      addLabel('O', O.clone().add(V(0.2, 0.15, 0.2)), 'jade');
      addLabel('(BDD\'B\')', B1.clone().add(D1).multiplyScalar(0.5).add(V(0.2, 0.2, 0)));

      const step3Readouts = [
        'Lần 1 · Hãy dựng AO trong đáy',
        'Kiểm tra 1 · AO có vuông góc BD?',
        "Kiểm tra 2 · AO có vuông góc BB'?",
        `d(AA', BDD'B') = AO = 2,57m`
      ];
      distanceReadout.textContent = step3Readouts[step3Stage];
      const done = step3Stage >= 3;
      distanceReadout.style.borderColor = done ? '#34D399' : 'rgba(250,199,117,.5)';
      distanceReadout.style.color = done ? '#34D399' : '#FAC775';
    }

    // -------------------------------------------------------------
    // STEP 4: KỸ THUẬT DỜI ĐIỂM (DÂY GIẰNG NÉO CỘT)
    // -------------------------------------------------------------
    function buildStep4Scene() {
      clearScene();

      const h = 5.0;
      const S = V(0, h, 0);
      const A = V(0, 0, 0);

      // Mặt đất
      planeMesh([V(-4.5, 0, -4.5), V(4.5, 0, -4.5), V(4.5, 0, 4.5), V(-4.5, 0, 4.5)], COLORS.sandFill, 0.18);
      const grid = new THREE.GridHelper(10, 10, 0x1e293b, 0x1e293b);
      grid.position.y = -0.01;
      rootGroup.add(grid);

      // Cột chính SA
      cylinderLeg(A, S, 0.085, COLORS.slate);
      dot(S, COLORS.point, 0.15, 'S');
      dot(A, COLORS.point, 0.12, 'A');

      // 3 điểm neo dây giằng dưới đất
      const B = V(3.5, 0, 0);
      const C = V(-1.75, 0, 3.03);
      const D = V(-1.75, 0, -3.03);

      dot(B, COLORS.ochre, 0.09, 'B');
      dot(C, COLORS.ochre, 0.09, 'C');
      dot(D, COLORS.ochre, 0.09, 'D');

      // Dây giằng thật: ống rất mảnh, võng nhẹ theo đường cong Bezier.
      curvedCable(S, B, 0.32, COLORS.ochre);
      curvedCable(S, C, 0.32, COLORS.ochre);
      curvedCable(S, D, 0.32, COLORS.ochre);

      // Điểm M trượt trên cột SA
      objects.mMesh = dot(V(0, h * mRatio, 0), COLORS.accent, 0.16, 'M');
      
      // Đoạn khoảng cách từ M xuống đất (MA)
      objects.maLine = line(V(0, h * mRatio, 0), V(0, 0, 0), COLORS.jade, 3.5);
      rightAngleMark(A, V(0, 1, 0), V(1, 0, 0), 0.35, COLORS.jade);

      // Labels
      addLabel('S (8m)', S.clone().add(V(0, 0.35, 0)), 'result');
      addLabel('A (0m)', A.clone().add(V(0, -0.25, 0.25)));
      objects.mLabel = addLabel(`M`, V(0, h * mRatio + 0.2, 0), 'result');
      objects.maMeasure = addLabel('MA', V(0.25, h * mRatio / 2, 0), 'measure');
      addLabel('Mặt đất (ABC)', V(2.5, 0, 2.5));

      updateStep4Geometry();
    }

    function updateStep4Geometry() {
      if (!objects.mMesh) return;
      const h = 5.0;
      const mY = h * mRatio;
      const Mpos = V(0, mY, 0);
      objects.mMesh.position.copy(Mpos);
      updateLine(objects.maLine, Mpos, V(0, 0, 0));

      const actualDist = 8.0 * mRatio;
      objects.mLabel.pos.copy(Mpos).add(V(0.3, 0.15, 0));
      objects.maMeasure.pos.copy(Mpos.clone().multiplyScalar(0.5)).add(V(0.25, 0, 0));
      objects.maMeasure.el.textContent = `MA = ${fmt(actualDist)}m`;
      const confirmed = dragTarget !== 'M' && Math.abs(mRatio - 0.75) <= 0.025;
      const mColor = confirmed ? COLORS.jade : COLORS.accent;
      objects.mMesh.material.color.setHex(mColor);
      objects.mMesh.material.emissive.setHex(mColor);
      objects.mLabel.el.className = `label ${confirmed ? 'jade' : 'result'}`;

      distanceReadout.textContent = `d(M, đất) = ${fmt(actualDist)}m (${(mRatio*100).toFixed(0)}% SA)`;
      distanceReadout.style.borderColor = confirmed ? '#34D399' : 'rgba(250,199,117,.5)';
      distanceReadout.style.color = confirmed ? '#34D399' : '#FAC775';

      const out = document.querySelector('[data-out="mratio"]');
      if (out) out.textContent = fmt(actualDist) + 'm (Tỉ lệ ' + mRatio.toFixed(2) + ')';
    }

    // 4. CAMERA VIEW PRESETS
    function setCamera(mode = 'perspective') {
      if (mode === 'top') {
        camera.position.set(0.01, 14, 0);
        controls.target.set(0, 0, 0);
      } else if (mode === 'side') {
        camera.position.set(11, 3, 0);
        controls.target.set(0, 2, 0);
      } else {
        camera.position.set(7.5, 6.5, 9);
        controls.target.set(0, 1.8, 0);
      }
      camera.up.set(0, 1, 0);
      controls.update();
    }

    // 5. STEP CONTENT RENDERING (CLEAN & NATIVE TYPOGRAPHY)
    function renderStep() {
      headerProgress.textContent = `BƯỚC ${currentStep}/4`;
      document.querySelectorAll('.step-tab').forEach(b => {
        const n = +b.dataset.step;
        b.classList.toggle('active', n === currentStep);
        b.classList.toggle('done', n < unlocked);
        b.disabled = n > unlocked;
      });

      if (currentStep === 1) renderStep1UI();
      if (currentStep === 2) renderStep2UI();
      if (currentStep === 3) renderStep3UI();
      if (currentStep === 4) renderStep4UI();

      reportHeight();
      saveState();
    }

      if (sb) sb.scrollTop = 0;
      if (n === 1) { buildStep1Scene(); setCamera('perspective'); }

      if (n === 3) { buildStep3Scene(); setCamera('perspective'); }
      if (n === 4) { buildStep4Scene(); setCamera('perspective'); }
      renderStep();
    }

      if ((currentStep === 1 && !q1Done) || (currentStep === 2 && step2Stage < 3) || (currentStep === 3 && (step3Stage < 3 || !q3Done))) return;
      unlocked = Math.max(unlocked, Math.min(4, currentStep + 1));
      LMS().progress({ done: currentStep, total: 4 });
      LMS().event('completed-section', { id: ['step1-definition', 'step2-trig-calc', 'step3-two-step-draw', 'step4-point-shift'][currentStep - 1] });
      if (currentStep < 4) goStep(currentStep + 1);

          LMS().event('identified-foot', { id: 'step2-foot-o', chosen: choice, correct: false });
          const fb = document.getElementById('step2-feedback');
          if (fb) fb.innerHTML = '<div class="feedback bad">Chưa đúng. Với chóp đều, chân đường cao trùng tâm của đáy.</div>';
        }
      },
      answerOA(value) {
        if (step2Stage !== 1) return;
        step2OAChosen = value;
        saveState();
        const correct = Math.abs(value - 51.96) < 0.02;
        LMS().event('answered', { id: 'step2-calculate-oa', chosen: value, correct });
        if (correct) {
          step2Stage = 2;
          buildStep2Scene();
          renderStep2UI();
          saveState();
        } else {
          const fb = document.getElementById('step2-feedback');
          if (fb) fb.innerHTML = '<div class="feedback bad">Chưa đúng. Bán kính ngoại tiếp tam giác đều cạnh a là a√3/3.</div>';
        }
      },
      answerSO(value) {
        if (step2Stage !== 2) return;
        step2SOChosen = value;
        saveState();
        const correct = Math.abs(value - 140.71) < 0.02;
        LMS().event('answered', { id: 'step2-calculate-so', chosen: value, correct });
        if (correct) {
          step2Stage = 3;
          buildStep2Scene();
          renderStep2UI();
          saveState();
        } else {
          const fb = document.getElementById('step2-feedback');
          if (fb) fb.innerHTML = '<div class="feedback bad">Chưa đúng. Trong tam giác vuông SOA: SO² = SA² − OA².</div>';
        }
      },
      advanceStep3(action) {
        if (step3Stage !== 0 || action !== 'construct') return;
        step3Stage = 1;
        LMS().event('constructed', { id: 'step3-construct-ao', correct: true });
        buildStep3Scene();
        renderStep3UI();
        saveState();
      },
      verifyStep3(correct) {
        if (step3Stage !== 1 && step3Stage !== 2) return;
        if (step3Stage === 1) step3CheckBD = correct ? 'Đúng' : 'Sai';
        if (step3Stage === 2) step3CheckBB = correct ? 'Đúng' : 'Sai';
        saveState();
        const id = step3Stage === 1 ? 'step3-check-ao-bd' : 'step3-check-ao-bb-prime';
        LMS().event('answered', { id, correct });
        if (correct) {
          step3Stage++;
          buildStep3Scene();
          renderStep3UI();
          saveState();
        } else {
          const fb = document.getElementById('step3-feedback');
          if (fb) fb.innerHTML = '<div class="feedback bad">Chưa đúng. Hãy dùng tính chất đường chéo hình thoi và các cạnh bên song song của hình hộp đứng.</div>';
        }
      },
      answerQ1(choice) {
        if (q1Done) return;
        q1Chosen = choice;
        if (choice === 1) {
          q1Done = true;
          q1Correct = true;
          LMS().event('answered', { id: 'q1-definition', correct: true });
          renderStep1UI();
          saveState();
        } else {
          q1Strikes++;
          saveState();
          LMS().event('answered', { id: 'q1-definition', correct: false, strikes: q1Strikes });
          const card = document.getElementById('q1-card');
          if (card) {
            card.classList.add('shake');
            setTimeout(() => card.classList.remove('shake'), 320);
          }
          const fb = document.getElementById('q1-feedback');
          if (fb) fb.innerHTML = '<div class="feedback bad">Chưa đúng. Gợi ý: Khoảng cách ngắn nhất chỉ đạt được khi đoạn nối vuông góc!</div>';
          if (q1Strikes >= 3) {
            q1Done = true;
            q1Correct = false;
            renderStep1UI();
            saveState();
          }
        }
      },
      answerQ3(isCorrect) {
        if (q3Done) return;
        q3Chosen = isCorrect ? 'Không, phải kiểm tra đủ hai đường cắt nhau' : 'Có thể kết luận ngay';
        if (isCorrect) {
          q3Done = true;
          q3Correct = true;
          LMS().event('answered', { id: 'q3-two-step', correct: true });
          renderStep3UI();
          saveState();
        } else {
          q3Strikes++;
          saveState();
          LMS().event('answered', { id: 'q3-two-step', correct: false, strikes: q3Strikes });
          const card = document.getElementById('q3-card');
          if (card) {
            card.classList.add('shake');
            setTimeout(() => card.classList.remove('shake'), 320);
          }
          const fb = document.getElementById('q3-feedback');
          if (fb) fb.innerHTML = '<div class="feedback bad">Chưa đúng. Một đường thẳng vuông góc với 1 đường trong mặt chưa đủ để vuông góc với cả mặt phẳng!</div>';
          if (q3Strikes >= 3) {
            q3Done = true;
            q3Correct = false;
            renderStep3UI();
            saveState();
          }
        }
      },
      answerQ4(ans) {
        if (q4Done) return;
        q4Chosen = ans;
        if (ans === 6) {
          q4Done = true;
          q4Correct = true;
          mRatio = 0.75;
          updateStep4Geometry();
          LMS().event('answered', { id: 'q4-point-shift', correct: true });
          renderStep4UI();
          saveState();
        } else {
          q4Strikes++;
          saveState();
          LMS().event('answered', { id: 'q4-point-shift', correct: false, strikes: q4Strikes });
          const card = document.getElementById('q4-card');
          if (card) {
            card.classList.add('shake');
            setTimeout(() => card.classList.remove('shake'), 320);
          }
          const fb = document.getElementById('q4-feedback');
          if (fb) fb.innerHTML = '<div class="feedback bad">Chưa đúng. Cẩn thận bẫy: SM : MA = 1 : 3 thì đoạn MA chiếm 3/4 chiều cao!</div>';
          if (q4Strikes >= 3) {
            q4Done = true;
            q4Correct = false;
            renderStep4UI();
            saveState();
          }
        }
      },
      completeStep,
      prevStep() { goStep(currentStep - 1); },
      finish
    };

    // Tab clicks & Camera buttons
    document.querySelectorAll('.step-tab').forEach(b => b.onclick = () => goStep(+b.dataset.step));
    document.getElementById('btn-reset').onclick = () => setCamera('perspective');
    document.getElementById('btn-top').onclick = () => setCamera('top');
    document.getElementById('btn-side').onclick = () => setCamera('side');

    // 7. RAYCASTING DIRECT DRAG INTERACTIONS
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    function pointerRay(e) {
      const r = canvas.getBoundingClientRect();
      pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      raycaster.setFromCamera(pointer, camera);
    }

    canvas.addEventListener('pointerdown', e => {
      pointerRay(e);
      if (currentStep === 1 && objects.kMesh && raycaster.intersectObject(objects.kMesh).length) {
        dragTarget = 'K';
        controls.enabled = false;
        canvas.setPointerCapture(e.pointerId);
      } else if (currentStep === 2 && step2Stage === 0 && objects.step2OMesh && raycaster.intersectObject(objects.step2OMesh).length) {
        lesson.selectFootO('O');
      } else if (currentStep === 4 && objects.mMesh && raycaster.intersectObject(objects.mMesh).length) {
        dragTarget = 'M';
        controls.enabled = false;
        canvas.setPointerCapture(e.pointerId);
      }
    });

    canvas.addEventListener('pointermove', e => {
      if (!dragTarget) return;
      pointerRay(e);

      if (dragTarget === 'K') {
        const planeY0 = new THREE.Plane(V(0, 1, 0), 0);
        const hit = V();
        if (raycaster.ray.intersectPlane(planeY0, hit)) {
          kX = Math.max(-5, Math.min(5, hit.x));
          const slider = document.querySelector('input[type="range"]');
          if (slider) slider.value = kX;
          updateStep1Geometry();
        }
      } else if (dragTarget === 'M') {
        const planeZ0 = new THREE.Plane(V(0, 0, 1), 0);
        const hit = V();
        if (raycaster.ray.intersectPlane(planeZ0, hit)) {
          mRatio = Math.max(0, Math.min(1, hit.y / 5.0));
          const slider = document.querySelector('input[type="range"]');
          if (slider) slider.value = mRatio;
          updateStep4Geometry();
        }
      }
    });

    function endDrag() {
      const finishedTarget = dragTarget;
      if (finishedTarget) LMS().event('dragged-point', { target: finishedTarget });
      dragTarget = null;
      controls.enabled = true;
      if (finishedTarget === 'M') updateStep4Geometry();
      if (finishedTarget) saveState();
    }
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    // 8. RENDER LOOP & RESIZING
    function resize() {
      const w = wrap.clientWidth;
      const h = wrap.clientHeight;
      camera.aspect = w / Math.max(1, h);
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    }
    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(() => {
        clearTimeout(window._canvasResizeTimer);
        window._canvasResizeTimer = setTimeout(resize, 40);
      }).observe(wrap);
    }
    window.addEventListener('resize', resize);

    function updateLabels() {
      labels.forEach(l => {
        const p = l.pos.clone().project(camera);
        const show = p.z > -1 && p.z < 1;
        l.el.style.display = show ? 'block' : 'none';
        if (show) {
          l.el.style.transform = `translate(${(p.x * 0.5 + 0.5) * wrap.clientWidth}px, ${(-p.y * 0.5 + 0.5) * wrap.clientHeight}px) translate(-50%, -115%)`;
        }
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      updateLabels();
      renderer.render(scene, camera);
    }

    function reportHeight() {
      LMS().resize({ height: document.documentElement.scrollHeight });
    }
    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(() => {
        clearTimeout(window._rh);
        window._rh = setTimeout(reportHeight, 100);
      }).observe(document.body);
    } else {
      setInterval(reportHeight, 800);
    }

    // Initial Execution
    buildStep1Scene();
    setCamera('perspective');
    renderStep();
    resize();
    animate();
    LMS().ready({ id: 'bai26-module1-khoang-cach-diem-den-duong-mat-phang' });

    if (window.AiducationLMS) {
      window.AiducationLMS.onResume = s => {
        if (!s) return;
        kX = Number.isFinite(s.kX) ? s.kX : kX;
        mRatio = Number.isFinite(s.mRatio) ? s.mRatio : mRatio;
        step2Stage = Number.isFinite(s.step2Stage) ? Math.max(0, Math.min(3, s.step2Stage)) : step2Stage;
        step3Stage = Number.isFinite(s.step3Stage) ? Math.max(0, Math.min(3, s.step3Stage)) : step3Stage;
        q1Strikes = Number.isFinite(s.q1Strikes) ? s.q1Strikes : q1Strikes;
        q3Strikes = Number.isFinite(s.q3Strikes) ? s.q3Strikes : q3Strikes;
        q4Strikes = Number.isFinite(s.q4Strikes) ? s.q4Strikes : q4Strikes;
        q1Done = Boolean(s.q1Done); q1Correct = Boolean(s.q1Correct);
        q3Done = Boolean(s.q3Done); q3Correct = Boolean(s.q3Correct);
        q4Done = Boolean(s.q4Done); q4Correct = Boolean(s.q4Correct);
        q1Chosen = Number.isFinite(s.q1Chosen) ? s.q1Chosen : q1Chosen;
        q3Chosen = typeof s.q3Chosen === 'string' ? s.q3Chosen : q3Chosen;
        q4Chosen = Number.isFinite(s.q4Chosen) ? s.q4Chosen : q4Chosen;
        step2FootChosen = typeof s.step2FootChosen === 'string' ? s.step2FootChosen : step2FootChosen;
        step2OAChosen = Number.isFinite(s.step2OAChosen) ? s.step2OAChosen : step2OAChosen;
        step2SOChosen = Number.isFinite(s.step2SOChosen) ? s.step2SOChosen : step2SOChosen;
        step3CheckBD = typeof s.step3CheckBD === 'string' ? s.step3CheckBD : step3CheckBD;
        step3CheckBB = typeof s.step3CheckBB === 'string' ? s.step3CheckBB : step3CheckBB;
        completed = Boolean(s.completed);
        unlocked = Math.max(1, Math.min(4, s.unlocked || 1));
        goStep(Math.min(unlocked, s.currentStep || 1));
      };
    }
  })();
  </script>
</body>
