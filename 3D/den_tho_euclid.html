<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đền thờ Euclid: Hành trình đầu tiên</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --gold: #e8c27a;
      --gold-bright: #ffe3a3;
      --amber: #f0a84e;
      --ink: #1a1410;
      --panel-bg: rgba(20, 14, 8, 0.82);
      --panel-border: rgba(232, 194, 122, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050403;
      font-family: 'Crimson Pro', serif;
      color: #f3e6cf;
    }

    h1,
    h2,
    h3,
    .title-font {
      font-family: 'Cinzel', serif;
    }

    #bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      filter: brightness(0.7) saturate(0.9);
      transition: filter 1.2s ease, background-image 0.6s ease;
      z-index: 0;
    }

    /* Ánh sáng tăng dần theo trạm */
    body[data-station="0"] #bg {
      background-image: url('https://lh3.googleusercontent.com/d/1_Kv5bB17f9Juq1axPkANuCgrKEUwY8wG');
      filter: brightness(0.45) saturate(0.7);
    }

    body[data-station="1"] #bg {
      background-image: url('https://lh3.googleusercontent.com/d/1MLlXZkNmPP4rXs9MAC7aYbHKSJBgMOOR');
      filter: brightness(0.62) saturate(0.85);
    }

    body[data-station="2"] #bg {
      background-image: url('https://lh3.googleusercontent.com/d/1LblxGJdQxJ51oNkJwIYYO1hKvTUAgbIu');
      filter: brightness(0.72) saturate(0.9);
    }

    body[data-station="3"] #bg {
      background-image: url('https://lh3.googleusercontent.com/d/1a-RqkU3rRw0v4M1FtHe1Eq9KuLI4tou2');
      filter: brightness(0.8) saturate(0.95);
    }

    body[data-station="4"] #bg {
      background-image: url('https://lh3.googleusercontent.com/d/19Eb4_QRdwzHw__gSMiGqNGNY3JvvJGFy');
      filter: brightness(0.85) saturate(1);
    }

    body[data-station="5"] #bg {
      background-image: url('https://lh3.googleusercontent.com/d/1q1UsPlQU6ojLTa5eJiJV4iFMtZWXAsnJ');
      filter: brightness(1.05) saturate(1.1);
    }

    #warm-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 40%, rgba(255, 190, 110, 0.10), rgba(0, 0, 0, 0.35) 75%);
      mix-blend-mode: screen;
      transition: opacity 1s ease;
      opacity: 0.2;
    }

    body[data-station="0"] #warm-overlay {
      opacity: 0.05;
    }

    body[data-station="1"] #warm-overlay {
      opacity: 0.15;
    }

    body[data-station="2"] #warm-overlay {
      opacity: 0.25;
    }

    body[data-station="3"] #warm-overlay {
      opacity: 0.35;
    }

    body[data-station="4"] #warm-overlay {
      opacity: 0.5;
    }

    body[data-station="5"] #warm-overlay {
      opacity: 0.75;
    }

    #three-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: block;
    }

    #three-canvas.no-interact {
      pointer-events: none;
    }

    #ui-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    #ui-layer>* {
      pointer-events: auto;
    }

    /* ---------- Sidebar trái: phù điêu + điểm + rank ---------- */
    #sidebar {
      position: absolute;
      top: 18px;
      left: 18px;
      width: 210px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 12px 14px;
      backdrop-filter: blur(3px);
      box-shadow: 0 0 22px rgba(0, 0, 0, 0.5);
    }

    #sidebar h3 {
      margin: 0 0 8px;
      font-size: 15px;
      color: var(--gold-bright);
      letter-spacing: 0.5px;
    }

    #relic-frame {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      margin-bottom: 10px;
    }

    .relic-slot {
      width: 100%;
      aspect-ratio: 1;
      border: 1px solid rgba(232, 194, 122, 0.4);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.35);
      transition: all .4s ease;
    }

    .relic-slot.filled {
      background: rgba(232, 194, 122, 0.18);
      box-shadow: 0 0 10px rgba(232, 194, 122, 0.5) inset;
    }

    .relic-slot svg {
      width: 70%;
      height: 70%;
      opacity: 0.85;
    }

    #score-line {
      font-size: 14px;
      margin: 4px 0;
    }

    #score-value {
      color: var(--gold-bright);
      font-weight: 700;
    }

    #rank-line {
      font-size: 13px;
      color: #d8b98a;
    }

    #stars-line {
      font-size: 14px;
      letter-spacing: 2px;
      color: var(--amber);
    }

    /* ---------- Keeper dialogue box ---------- */
    #keeper-box {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: min(680px, 88vw);
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 16px 20px;
      text-align: center;
      box-shadow: 0 0 26px rgba(0, 0, 0, 0.55);
    }

    #keeper-name {
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--amber);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    #keeper-text {
      font-size: 16px;
      line-height: 1.5;
      color: #f3e6cf;
      min-height: 24px;
    }

    #keeper-buttons {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    /* ---------- Nút chung ---------- */
    button.btn {
      font-family: 'Crimson Pro', serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(180deg, #7a5424, #4a340f);
      border: 1px solid var(--gold);
      color: var(--gold-bright);
      padding: 9px 18px;
      border-radius: 7px;
      cursor: pointer;
      transition: all .2s ease;
      text-transform: uppercase;
    }

    button.btn:hover:not(:disabled) {
      background: linear-gradient(180deg, #93662d, #5c4113);
      box-shadow: 0 0 14px rgba(232, 194, 122, 0.5);
    }

    button.btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    button.btn.secondary {
      background: rgba(40, 30, 18, 0.6);
    }

    /* ---------- Panel trạm (góc phải) ---------- */
    #station-panel {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 340px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 16px 18px;
      backdrop-filter: blur(3px);
      box-shadow: 0 0 22px rgba(0, 0, 0, 0.5);
      max-height: 78vh;
      overflow-y: auto;
    }

    #station-panel h4 {
      margin: 0 0 10px;
      font-size: 17px;
      color: var(--gold-bright);
    }

    #station-panel p.hint {
      font-size: 16px;
      color: #cbb896;
      line-height: 1.55;
      margin: 8px 0 12px;
    }

    .rule-list {
      font-size: 15px;
      color: #d8c8a8;
      margin: 8px 0;
      padding-left: 18px;
      line-height: 1.45;
    }

    .rule-list li {
      margin-bottom: 5px;
    }

    .plane-choice-btn {
      display: block;
      width: 100%;
      text-align: left;
      margin-bottom: 8px;
      background: rgba(40, 30, 18, 0.55);
      border: 1px solid rgba(232, 194, 122, 0.3);
      color: #f0e2c4;
      padding: 9px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Crimson Pro', serif;
      font-size: 16px;
    }

    .plane-choice-btn.selected {
      border-color: var(--gold-bright);
      background: rgba(232, 194, 122, 0.22);
    }

    .plane-choice-btn:hover {
      background: rgba(232, 194, 122, 0.15);
    }

    #station4-input-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 8px 0;
    }

    #m-percent-input {
      width: 70px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid var(--panel-border);
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      font-size: 16px;
    }

    #feedback-line {
      font-size: 16px;
      font-weight: 600;
      margin: 8px 0 4px;
      min-height: 20px;
    }

    #history-log {
      font-size: 14px;
      color: #c9b691;
      max-height: 110px;
      overflow-y: auto;
      margin-top: 6px;
      border-top: 1px dashed rgba(232, 194, 122, 0.25);
      padding-top: 6px;
    }

    #history-log div {
      margin-bottom: 2px;
    }

    .checkitem-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      text-align: left;
      margin-bottom: 8px;
      background: rgba(40, 30, 18, 0.5);
      border: 1px solid rgba(232, 194, 122, 0.3);
      color: #f0e2c4;
      padding: 9px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15.5px;
    }

    .checkitem-btn.done {
      background: rgba(120, 200, 140, 0.15);
      border-color: rgba(150, 220, 160, 0.5);
      color: #cdeed4;
    }

    .checkitem-btn .tick {
      width: 16px;
      text-align: center;
    }

    /* ---------- Màn intro Trạm 0 ---------- */
    #intro-screen {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 40px;
    }

    #intro-lines {
      max-width: 720px;
      font-size: 21px;
      line-height: 1.95;
      color: #f3e6cf;
    }

    #intro-lines .line {
      opacity: 0;
      transition: opacity 1.1s ease;
      margin-bottom: 12px;
    }

    #intro-lines .line.show {
      opacity: 1;
    }

    #intro-actions {
      margin-top: 28px;
      display: flex;
      gap: 16px;
    }

    #intro-actions button.btn {
      font-size: 16px;
      padding: 11px 24px;
    }

    #floor-score-badge {
      margin-top: 20px;
      font-size: 16px;
      color: var(--amber);
    }

    /* ---------- Trạm 5 overlay tổng kết ---------- */
    #ending-overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.35);
      flex-direction: column;
      text-align: center;
    }

    #ending-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 28px 36px;
      width: min(480px, 88vw);
      box-shadow: 0 0 40px rgba(255, 200, 120, 0.25);
    }

    #ending-card h2 {
      margin: 0 0 6px;
      color: var(--gold-bright);
    }

    .ending-stat {
      font-size: 15px;
      margin: 6px 0;
      color: #e9d8b6;
    }

    .ending-stat b {
      color: var(--gold-bright);
      font-size: 20px;
    }

    #leaderboard-list {
      margin-top: 14px;
      max-height: 180px;
      overflow-y: auto;
      font-size: 13.5px;
      text-align: left;
    }

    #leaderboard-list div {
      display: flex;
      justify-content: space-between;
      padding: 3px 6px;
      border-radius: 5px;
    }

    #leaderboard-list div.me {
      background: rgba(232, 194, 122, 0.2);
    }

    #name-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    #name-row input {
      flex: 1;
      padding: 7px 10px;
      border-radius: 6px;
      border: 1px solid var(--panel-border);
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
    }

    /* mảnh phù điêu cuối - kéo thả 2D */
    #relic-drop-zone {
      position: absolute;
      inset: 0;
      display: none;
    }

    #drop-zone-hint {
      position: absolute;
      top: 22%;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Cinzel', serif;
      font-size: 15px;
      color: #fff;
      text-align: center;
      background: rgba(10, 8, 4, 0.55);
      padding: 8px 18px;
      border-radius: 8px;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
      white-space: nowrap;
    }

    #final-slot {
      position: absolute;
      width: 100px;
      height: 100px;
      border-radius: 12px;
      border: 3px dashed #7de8ff;
      box-shadow: 0 0 22px rgba(125, 232, 255, 0.55), inset 0 0 18px rgba(125, 232, 255, 0.25);
      background: rgba(10, 20, 30, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: slotPulse 1.8s ease-in-out infinite;
    }

    @keyframes slotPulse {

      0%,
      100% {
        box-shadow: 0 0 22px rgba(125, 232, 255, 0.55), inset 0 0 18px rgba(125, 232, 255, 0.25);
      }

      50% {
        box-shadow: 0 0 46px rgba(125, 232, 255, 0.95), inset 0 0 30px rgba(125, 232, 255, 0.5);
      }
    }

    #final-slot svg,
    #final-piece svg {
      width: 65%;
      height: 65%;
    }

    #final-piece {
      position: absolute;
      width: 100px;
      height: 100px;
      cursor: grab;
      touch-action: none;
      background: radial-gradient(circle, rgba(255, 240, 200, 0.95), rgba(255, 200, 110, 0.85));
      border: 3px solid #fff8e0;
      border-radius: 12px;
      box-shadow: 0 0 26px rgba(255, 220, 140, 0.9), 0 0 8px rgba(255, 255, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: piecePulse 1.2s ease-in-out infinite;
    }

    @keyframes piecePulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }
    }

    #final-piece.snapped {
      cursor: default;
      animation: none;
      background: radial-gradient(circle, rgba(200, 255, 235, 0.95), rgba(125, 232, 255, 0.85));
      border: 3px dashed #7de8ff;
      border-radius: 12px;
      box-shadow: 0 0 34px rgba(125, 232, 255, 0.95), inset 0 0 20px rgba(125, 232, 255, 0.5);
      transform: scale(1);
    }

    #final-slot.near {
      border-color: #fff;
      box-shadow: 0 0 36px rgba(125, 232, 255, 0.9), inset 0 0 26px rgba(125, 232, 255, 0.4);
      transform: scale(1.04);
    }

    .flash-white {
      position: fixed;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      transition: opacity .35s ease;
    }

    .flash-white.on {
      opacity: 0.9;
      transition: opacity .05s ease;
    }

    #wrong-toast {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(90, 20, 10, 0.75);
      border: 1px solid rgba(255, 150, 120, 0.5);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13.5px;
      opacity: 0;
      transition: opacity .3s ease;
      pointer-events: none;
    }

    #wrong-toast.show {
      opacity: 1;
    }

    .hidden {
      display: none !important;
    }

    .point-label {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 6;
      font-family: 'Cinzel', serif;
      font-size: 15px;
      font-weight: 700;
      text-shadow: 0 0 6px rgba(0, 0, 0, 0.9), 0 0 10px rgba(0, 0, 0, 0.7);
      transform: translate(-50%, -140%);
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(232, 194, 122, 0.4);
      border-radius: 4px;
    }
  </style>
</head>

<body data-station="0">

  <div id="bg"></div>
  <div id="warm-overlay"></div>
  <canvas id="three-canvas"></canvas>

  <div id="ui-layer">
    <div id="sidebar">
      <h3>🏺 Hành trình</h3>
      <div id="relic-frame"></div>
      <div id="score-line">Điểm: <span id="score-value">250</span></div>
      <div id="rank-line">Nhà khảo cổ tập sự</div>
      <div id="stars-line">⭐</div>
      <button class="btn secondary" id="btn-reset-station"
        style="width:100%; margin-top:10px; font-size:10.5px; padding:7px 8px;">↺ Làm lại trạm này</button>
    </div>

    <div id="station-panel" class="hidden"></div>

    <div id="wrong-toast"></div>

    <div id="keeper-box" class="hidden">
      <div id="keeper-name">Người Gác Đền</div>
      <div id="keeper-text"></div>
      <div id="keeper-buttons"></div>
    </div>

    <div id="intro-screen">
      <div id="intro-lines"></div>
      <div id="intro-actions" style="display:none;">
        <button class="btn secondary" id="btn-skip-intro">Bỏ qua</button>
        <button class="btn" id="btn-enter">Bước vào Đền thờ</button>
      </div>
      <div id="floor-score-badge"></div>
    </div>

    <div id="relic-drop-zone">
      <div id="drop-zone-hint">👉 Kéo mảnh phù điêu sáng vào khung viền xanh</div>
      <div id="final-slot"></div>
      <div id="final-piece"></div>
    </div>

    <div id="ending-overlay">
      <div id="ending-card">
        <h2>Tinh thể Tri thức đã đánh thức</h2>
        <div class="ending-stat">Tổng điểm: <b id="final-score">0</b></div>
        <div class="ending-stat" id="final-rank-line">Rank: —</div>
        <div class="ending-stat" id="final-time-line">Thời gian: —</div>
        <div id="ending-keeper" style="margin:10px 0; font-style:italic; color:#e9d8b6;"></div>
        <div id="name-row">
          <input id="player-name" placeholder="Tên của ngươi..." maxlength="24">
          <button class="btn" id="btn-save-score">Lưu điểm</button>
        </div>
        <div id="leaderboard-list"></div>
        <div style="margin-top:14px;">
          <button class="btn secondary" id="btn-replay">Khám phá lại Đền thờ</button>
        </div>
      </div>
    </div>
  </div>

  <div class="flash-white" id="flash-white"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    /* =========================================================================
       ĐỀN THỜ EUCLID — HÀNH TRÌNH ĐẦU TIÊN
       File HTML độc lập — dựa trên kịch bản "Kich_ban_Game_DenThoEuclid..."
       Ghép ảnh: đặt 6 file ảnh cùng tên gốc vào CÙNG thư mục với file HTML này:
         Bat_dau_vao_Tram_0.png, 1_Cong_den_Tram_1.png, 2_Hanh_lang_Tram_2.png,
         3_Buong_trung_tam_Tram_3.png, 4_Kho_bau_Tram_4.png, 5_Dich_cuoi_Tram_5.png
       ========================================================================= */

    /* ---------------------- KIỂM TRA THƯ VIỆN ĐÃ LOAD THÀNH CÔNG ---------------------- */
    if (typeof THREE === 'undefined' || typeof THREE.OrbitControls === 'undefined') {
      document.body.innerHTML = `<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#1a1410;color:#f3e6cf;font-family:sans-serif;text-align:center;padding:30px;">
    <div>
      <h2 style="color:#e8c27a;">Không tải được thư viện Three.js</h2>
      <p>Vui lòng kiểm tra kết nối Internet (game cần tải Three.js từ CDN) rồi tải lại trang (F5).</p>
    </div></div>`;
      throw new Error('THREE hoặc THREE.OrbitControls chưa được load — dừng khởi tạo game.');
    }

    /* ---------------------- PHẦN A — HÀM TOÁN HỌC (verify sẵn) ---------------------- */

    function definePlaneFromPoints(A, B, C) {
      const AB = new THREE.Vector3().subVectors(B, A);
      const AC = new THREE.Vector3().subVectors(C, A);
      const normal = new THREE.Vector3().crossVectors(AB, AC);
      if (normal.lengthSq() < 1e-8) return null; // 3 điểm gần thẳng hàng
      normal.normalize();
      return { normal, pointOnPlane: A.clone() };
    }

    function projectPointOntoPlane(M, plane) {
      const toPoint = new THREE.Vector3().subVectors(M, plane.pointOnPlane);
      const signedDist = toPoint.dot(plane.normal);
      const H = M.clone().sub(plane.normal.clone().multiplyScalar(signedDist));
      return { H, distance: Math.abs(signedDist), signedDist };
    }

    function classifyTwoPlanes(plane1, plane2) {
      const cross = new THREE.Vector3().crossVectors(plane1.normal, plane2.normal);
      return cross.lengthSq() < 1e-6 ? 'parallel' : 'intersects';
    }

    function intersectionOfTwoPlanes(plane1, plane2) {
      const dir = new THREE.Vector3().crossVectors(plane1.normal, plane2.normal);
      if (dir.lengthSq() < 1e-6) return null;
      dir.normalize();
      const n1 = plane1.normal, n2 = plane2.normal;
      const d1 = n1.dot(plane1.pointOnPlane);
      const d2 = n2.dot(plane2.pointOnPlane);
      const n1n2 = n1.dot(n2);
      // Giải hệ Cramer chuẩn cho [[1,k],[k,1]][c1;c2]=[d1;d2] với k=n1·n2:
      // định thức = 1 - k². (Bản trước đó dùng "k²-1" — SAI DẤU, khiến điểm trả
      // về là ẢNH ĐỐI XỨNG của điểm đúng qua gốc toạ độ, không nằm trên mặt phẳng
      // nào cả. Đã verify lại bằng script Node độc lập: residual cũ ≈ 2.26,
      // residual sau khi sửa ≈ 0.)
      const denom = 1 - n1n2 * n1n2;
      if (Math.abs(denom) < 1e-8) return null;
      const c1 = (d1 - d2 * n1n2) / denom;
      const c2 = (d2 - d1 * n1n2) / denom;
      const point = new THREE.Vector3().addScaledVector(n1, c1).addScaledVector(n2, c2);
      return { point, dir };
    }

    function lineIntersectPlane(lineStart, lineEnd, plane) {
      const lineDir = new THREE.Vector3().subVectors(lineEnd, lineStart);
      const denom = lineDir.dot(plane.normal);
      if (Math.abs(denom) < 1e-8) return null;
      const t = new THREE.Vector3().subVectors(plane.pointOnPlane, lineStart).dot(plane.normal) / denom;
      const point = lineStart.clone().add(lineDir.clone().multiplyScalar(t));
      return { point, t };
    }

    function projectPointOntoLine(M, linePoint, lineDir) {
      const d = lineDir.clone().normalize();
      const t = new THREE.Vector3().subVectors(M, linePoint).dot(d);
      const H = linePoint.clone().add(d.clone().multiplyScalar(t));
      return { H, distance: M.distanceTo(H), t };
    }

    // Diện tích đa giác phẳng — fan triangulation. QUAN TRỌNG: đỉnh truyền vào
    // PHẢI đúng thứ tự chu vi thật (không tự cắt) — xem 06_geometry_math.md PHẦN G.1
    function polygonArea(vertices) {
      if (vertices.length < 3) return 0;
      let total = 0;
      const v0 = vertices[0];
      for (let i = 1; i < vertices.length - 1; i++) {
        const v1 = new THREE.Vector3().subVectors(vertices[i], v0);
        const v2 = new THREE.Vector3().subVectors(vertices[i + 1], v0);
        total += v1.clone().cross(v2).length() / 2;
      }
      return total;
    }

    // Giao điểm 2 đoạn thẳng hữu hạn, giả định đồng phẳng (dùng cho tìm điểm
    // chung trên mặt đáy). Trả {point,t,s} hoặc null nếu song song / ngoài đoạn.
    function segmentIntersection(p1, p2, p3, p4) {
      const plane = definePlaneFromPoints(p1, p2, p3) || definePlaneFromPoints(p1, p2, p4);
      if (!plane) return null;
      const u = new THREE.Vector3().subVectors(p2, p1).normalize();
      const v = new THREE.Vector3().crossVectors(plane.normal, u).normalize();
      const to2D = (P) => {
        const rel = new THREE.Vector3().subVectors(P, p1);
        return { x: rel.dot(u), y: rel.dot(v) };
      };
      const a = to2D(p1), b = to2D(p2), c = to2D(p3), d = to2D(p4);
      const denom = (b.x - a.x) * (d.y - c.y) - (b.y - a.y) * (d.x - c.x);
      if (Math.abs(denom) < 1e-9) return null;
      const t = ((c.x - a.x) * (d.y - c.y) - (c.y - a.y) * (d.x - c.x)) / denom;
      const s = ((c.x - a.x) * (b.y - a.y) - (c.y - a.y) * (b.x - a.x)) / denom;
      if (t < -1e-6 || t > 1 + 1e-6 || s < -1e-6 || s > 1 + 1e-6) return null;
      const point = new THREE.Vector3().lerpVectors(p1, p2, t);
      return { point, t, s };
    }

    /* ---------------------- PHẦN B — THREE.JS SCENE CƠ BẢN ---------------------- */

    const canvas = document.getElementById('three-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0); // trong suốt để lộ ảnh nền phía sau

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2.2, 7.5);

    const orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
    orbitControls.enableDamping = true;
    orbitControls.dampingFactor = 0.08;
    orbitControls.minDistance = 3;
    orbitControls.maxDistance = 16;

    const ambient = new THREE.AmbientLight(0x8a6a3f, 0.55);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffdca8, 0.9);
    dirLight.position.set(3, 6, 4);
    scene.add(dirLight);
    const warmPoint = new THREE.PointLight(0xffb763, 0.6, 20);
    warmPoint.position.set(0, 3, 2);
    scene.add(warmPoint);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      orbitControls.update();
      if (window.__frameHook) window.__frameHook();
      renderer.render(scene, camera);
    }
    animate();

    function setLightingForStation(n) {
      const warmth = [0.35, 0.5, 0.65, 0.8, 0.95, 1.25][n] ?? 0.5;
      ambient.intensity = 0.3 + warmth * 0.35;
      dirLight.intensity = 0.5 + warmth * 0.7;
      warmPoint.intensity = 0.3 + warmth * 0.8;
      const hue = 0.09 - warmth * 0.02;
      dirLight.color.setHSL(hue, 0.55, 0.7);
    }

    function clearScene3D() {
      // Xoá mọi object động (giữ lại lights + camera + controls)
      const keep = new Set([ambient, dirLight, warmPoint]);
      [...scene.children].forEach(obj => {
        if (keep.has(obj)) return;
        scene.remove(obj);
        obj.traverse?.(o => {
          if (o.geometry) o.geometry.dispose();
          if (o.material) {
            (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose && m.dispose());
          }
        });
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          (Array.isArray(obj.material) ? obj.material : [obj.material]).forEach(m => m.dispose && m.dispose());
        }
      });
      window.__frameHook = null;
      window.__onDragUpdate = null;
      allDraggableHitMeshes = [];
      clearAllLabels();
    }

    /* ---------------------- PHẦN C — HỆ THỐNG KÉO ĐIỂM TỰ DO ---------------------- */

    let allDraggableHitMeshes = [];
    const raycaster = new THREE.Raycaster();
    const mouseNDC = new THREE.Vector2();
    let dragState = { active: false, point: null, dragPlane: null };

    function updateMouseNDC(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      const cx = event.clientX ?? (event.touches && event.touches[0].clientX);
      const cy = event.clientY ?? (event.touches && event.touches[0].clientY);
      mouseNDC.x = ((cx - rect.left) / rect.width) * 2 - 1;
      mouseNDC.y = -((cy - rect.top) / rect.height) * 2 + 1;
    }

    class DraggablePoint {
      constructor(position, color, label, radius = 0.11) {
        this.label = label; this.color = color;
        const geometry = new THREE.SphereGeometry(radius, 24, 24);
        const material = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.4 });
        this.mesh = new THREE.Mesh(geometry, material);
        this.mesh.position.copy(position);
        this.mesh.userData.draggable = this;
        scene.add(this.mesh);

        const hitGeo = new THREE.SphereGeometry(radius * 3.5, 12, 12);
        const hitMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false });
        this.hitMesh = new THREE.Mesh(hitGeo, hitMat);
        this.hitMesh.position.copy(position);
        this.hitMesh.userData.draggable = this;
        scene.add(this.hitMesh);

        allDraggableHitMeshes.push(this.mesh, this.hitMesh);

        const ringGeo = new THREE.RingGeometry(radius * 1.6, radius * 2, 32);
        const ringMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0, side: THREE.DoubleSide });
        this.ring = new THREE.Mesh(ringGeo, ringMat);
        this.ring.position.copy(position);
        scene.add(this.ring);
      }
      get position() { return this.mesh.position; }
      setDragging(active) {
        if (this.locked) return;
        this.ring.material.opacity = active ? 0.85 : 0;
        this.mesh.material.emissiveIntensity = active ? 0.75 : 0.4;
      }
      setLocked(locked) {
        this.locked = locked;
        if (locked) {
          this.ring.material.opacity = 0;
          this.mesh.material.emissiveIntensity = 0.5;
        }
      }
      syncRing() {
        this.ring.position.copy(this.mesh.position);
        this.ring.lookAt(camera.position);
        this.hitMesh.position.copy(this.mesh.position);
      }
      dispose() {
        scene.remove(this.mesh); scene.remove(this.hitMesh); scene.remove(this.ring);
      }
    }

    function makeFixedMarker(pos, color, radius = 0.1) {
      const geo = new THREE.SphereGeometry(radius, 20, 20);
      const mat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.5 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(pos);
      scene.add(mesh);
      return mesh;
    }

    /* ---------------------- NHÃN CHỮ CHO ĐIỂM 3D (label overlay) ---------------------- */
    // Nhãn HTML theo dõi vị trí 1 điểm 3D — cần để học sinh phân biệt được
    // điểm nào là điểm nào (S, A, B, C, D, M, N, P, Q...) khi chọn mặt phẳng.
    let activeLabels = [];
    function createLabel3D(text, color = '#ffe3a3') {
      const el = document.createElement('div');
      el.className = 'point-label';
      el.textContent = text;
      el.style.color = color;
      document.body.appendChild(el);
      const activeLabels_ref = activeLabels;
      const entry = {
        el,
        update(worldPos) {
          const p = worldPos.clone().project(camera);
          if (p.z > 1 || p.z < -1) { el.style.display = 'none'; return; }
          el.style.display = 'block';
          el.style.left = ((p.x * 0.5 + 0.5) * window.innerWidth) + 'px';
          el.style.top = ((-p.y * 0.5 + 0.5) * window.innerHeight) + 'px';
        }
      };
      activeLabels_ref.push(entry);
      return entry;
    }
    function clearAllLabels() {
      activeLabels.forEach(l => l.el.remove());
      activeLabels = [];
    }
    function updateAllLabels(labelMap) {
      // labelMap: [{entry, pos}] — gọi mỗi frame từ __frameHook của từng trạm
      labelMap.forEach(({ entry, pos }) => entry.update(pos));
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (canvas.classList.contains('no-interact')) return;
      updateMouseNDC(e);
      raycaster.setFromCamera(mouseNDC, camera);
      const hits = raycaster.intersectObjects(allDraggableHitMeshes);
      if (hits.length > 0) {
        const pt = hits[0].object.userData.draggable;
        if (pt.locked) return; // Khoá điểm khi đã hoàn thành
        dragState.active = true; dragState.point = pt;
        const camDir = new THREE.Vector3(); camera.getWorldDirection(camDir);
        dragState.dragPlane = new THREE.Plane().setFromNormalAndCoplanarPoint(camDir, pt.position);
        pt.setDragging(true);
        orbitControls.enabled = false;
      }
    });
    canvas.addEventListener('pointermove', (e) => {
      updateMouseNDC(e);
      if (!dragState.active || !dragState.point) {
        raycaster.setFromCamera(mouseNDC, camera);
        const hits = raycaster.intersectObjects(allDraggableHitMeshes);
        const hoverable = hits.length > 0 && !hits[0].object.userData.draggable.locked;
        canvas.style.cursor = hoverable ? 'grab' : 'default';
        return;
      }
      raycaster.setFromCamera(mouseNDC, camera);
      const intersection = new THREE.Vector3();
      if (raycaster.ray.intersectPlane(dragState.dragPlane, intersection)) {
        dragState.point.mesh.position.copy(intersection);
        if (window.__onDragUpdate) window.__onDragUpdate(dragState.point);
      }
    });
    function endDrag() {
      if (dragState.active && dragState.point) dragState.point.setDragging(false);
      dragState.active = false; dragState.point = null; dragState.dragPlane = null;
      orbitControls.enabled = true;
    }
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointerleave', endDrag);

    /* ---------------------- PHẦN D — TRẠNG THÁI GAME & ĐIỂM ---------------------- */

    const FLOOR_SCORE = 250;
    const game = {
      station: 0,
      bonuses: [0, 0, 0, 0, 0], // thưởng của trạm 1..4 (index 1..4 dùng)
      relics: [false, false, false, false, false],
      badges: { planes: false, intersections: false, structures: false, sections: false },
      runStart: Date.now(),
      stationStart: Date.now(),
    };

    function currentScore() {
      return FLOOR_SCORE + game.bonuses.reduce((a, b) => a + b, 0);
    }
    function computeSpeedBonus(elapsedSec, attempts = 1) {
      let bonus = 150 - elapsedSec * 3 - (attempts - 1) * 8;
      return Math.max(20, Math.round(bonus));
    }
    function getRankInfo(score) {
      if (score >= 700) return { name: 'Keeper of Geometry', stars: 5 };
      if (score >= 550) return { name: 'Đại khảo cổ gia', stars: 4 };
      if (score >= 420) return { name: 'Người giải mã', stars: 3 };
      return { name: '🏺 Nhà khảo cổ tập sự', stars: 2 };
    }

    const RELIC_ICONS = [
      `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="5" fill="#e8c27a"/></svg>`,
      `<svg viewBox="0 0 40 40"><line x1="6" y1="34" x2="34" y2="6" stroke="#e8c27a" stroke-width="3"/></svg>`,
      `<svg viewBox="0 0 40 40"><polygon points="20,6 34,30 6,30" fill="none" stroke="#e8c27a" stroke-width="3"/></svg>`,
      `<svg viewBox="0 0 40 40"><polygon points="20,4 36,30 4,30" fill="none" stroke="#e8c27a" stroke-width="2.5"/><line x1="20" y1="4" x2="20" y2="30" stroke="#e8c27a" stroke-width="1.5"/></svg>`,
      `<svg viewBox="0 0 40 40"><rect x="8" y="8" width="24" height="24" fill="none" stroke="#e8c27a" stroke-width="2.5" transform="rotate(15 20 20)"/></svg>`,
    ];
    // Icon riêng cho khung trống (nền tối, viền xanh) — dùng nét sáng để tương phản
    const FINAL_SLOT_ICON = `<svg viewBox="0 0 40 40"><rect x="8" y="8" width="24" height="24" fill="none" stroke="#7de8ff" stroke-width="3" transform="rotate(15 20 20)"/></svg>`;
    // Icon riêng cho mảnh ghép (nền sáng vàng-cam) — dùng nét đậm tối để tương phản
    const FINAL_PIECE_ICON = `<svg viewBox="0 0 40 40"><rect x="8" y="8" width="24" height="24" fill="none" stroke="#3a2410" stroke-width="4" transform="rotate(15 20 20)"/></svg>`;

    function renderSidebar() {
      const frame = document.getElementById('relic-frame');
      frame.innerHTML = '';
      for (let i = 0; i < 5; i++) {
        const slot = document.createElement('div');
        slot.className = 'relic-slot' + (game.relics[i] ? ' filled' : '');
        slot.innerHTML = game.relics[i] ? RELIC_ICONS[i] : '';
        frame.appendChild(slot);
      }
      const score = currentScore();
      document.getElementById('score-value').textContent = score;
      const rank = getRankInfo(score);
      document.getElementById('rank-line').textContent = rank.name;
      document.getElementById('stars-line').textContent = '⭐'.repeat(rank.stars);
    }
    renderSidebar();

    /* ---------------------- PHẦN E — KEEPER DIALOGUE ---------------------- */

    function keeperSay(text, buttons = []) {
      const box = document.getElementById('keeper-box');
      box.classList.remove('hidden');
      const t = document.getElementById('keeper-text');
      t.style.opacity = 0;
      setTimeout(() => { t.textContent = text; t.style.transition = 'opacity .5s'; t.style.opacity = 1; }, 150);
      const btnWrap = document.getElementById('keeper-buttons');
      btnWrap.innerHTML = '';
      buttons.forEach(b => {
        const el = document.createElement('button');
        el.className = 'btn' + (b.secondary ? ' secondary' : '');
        el.textContent = b.label;
        el.onclick = b.onClick;
        btnWrap.appendChild(el);
      });
    }
    function keeperHide() { document.getElementById('keeper-box').classList.add('hidden'); }
    function showWrongToast(msg) {
      const el = document.getElementById('wrong-toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(el.__t);
      el.__t = setTimeout(() => el.classList.remove('show'), 2600);
    }
    function flashWhite(duration = 700) {
      const f = document.getElementById('flash-white');
      f.classList.add('on');
      setTimeout(() => { f.style.transition = 'opacity .6s ease'; f.classList.remove('on'); }, 90);
    }

    /* ---------------------- PHẦN F — STATION PANEL HELPER ---------------------- */

    function setStationPanel(html) {
      const p = document.getElementById('station-panel');
      if (!html) { p.classList.add('hidden'); p.innerHTML = ''; return; }
      p.classList.remove('hidden');
      p.innerHTML = html;
    }

    const STATION_SETUP = {
      0: setupStation0, 1: setupStation1, 2: setupStation2, 3: setupStation3,
      4: setupStation4, 5: setupStation5
    };

    function goToStation(n) {
      game.station = n;
      game.stationStart = Date.now();
      document.body.setAttribute('data-station', String(n));
      setLightingForStation(n);
      clearScene3D();
      keeperHide();
      setStationPanel('');
      document.getElementById('intro-screen').classList.add('hidden');
      document.getElementById('ending-overlay').style.display = 'none';
      document.getElementById('relic-drop-zone').style.display = 'none';
      canvas.classList.remove('no-interact');
      renderSidebar();

      const resetBtn = document.getElementById('btn-reset-station');
      resetBtn.style.display = (n >= 1 && n <= 4) ? 'block' : 'none';

      STATION_SETUP[n]();
    }

    // "Làm lại trạm này" — reset lại vị trí điểm/tường/lựa chọn về trạng thái ban
    // đầu của TRẠM HIỆN TẠI. KHÔNG reset game.stationStart — thời gian vẫn tính
    // liên tục như bình thường (đúng nguyên tắc "không giới hạn số lần thử,
    // chỉ ảnh hưởng mức thưởng tốc độ" trong kịch bản), và KHÔNG đụng tới điểm/
    // phù điêu đã đạt được ở các trạm trước.
    function resetCurrentStation() {
      const n = game.station;
      if (n < 1 || n > 4) return;
      clearScene3D();
      keeperHide();
      setStationPanel('');
      canvas.classList.remove('no-interact');
      STATION_SETUP[n]();
    }
    document.getElementById('btn-reset-station').addEventListener('click', resetCurrentStation);

    /* ======================= TRẠM 0 — NHẬP MÔN ======================= */

    function setupStation0() {
      canvas.classList.add('no-interact');
      camera.position.set(0, 2.5, 9);
      orbitControls.enabled = false;

      // Cổng đền xa mờ, trang trí đơn giản
      const gate = new THREE.Mesh(
        new THREE.TorusGeometry(1.6, 0.12, 12, 40, Math.PI),
        new THREE.MeshStandardMaterial({ color: 0x6b4a24, emissive: 0x3a2410, emissiveIntensity: 0.3 })
      );
      gate.position.set(0, 0, -2);
