<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đền thờ Euclid: Hành trình đầu tiên</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <style>
    :root {
      /* Tokens hệ thống Jade & Cream chuẩn */
      --jade-dark: #14432F;
      --jade-deep: #1B5E43;
      --jade-main: #237A57;
      --jade-light: #449B74;
      --cream: #F9F7F1;
      --cream-card: #FFFFFF;
      --paper-line: #E2DDD0;
      --ink: #1F2923;
      --ink-2: #4A554E;
      --ink-3: #76837A;
      --correct: #1B8C5A;
      --correct-bg: #E6F4EE;
      --wrong: #C62828;
      --wrong-bg: #FFEBEE;
      --warning: #EF9F27;
      --warning-bg: #FEF3E0;
      --info: #1565C0;
      --info-bg: #EBF3FF;
      --radius: 12px;

      /* Aliases chuẩn hóa cho UI */
      --navy: var(--jade-dark);
      --teal: var(--jade-main);
      --bg: var(--cream);
      --canvas-bg: #0a1628;

      /* Tông màu cổ kính trong UI dark-card */
      --gold: #FAC775;
      --gold-bright: #FFE3A3;
      --amber: var(--warning);
      --panel-bg: rgba(14, 30, 22, 0.88);
      --panel-border: rgba(68, 155, 116, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background: var(--bg);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      color: var(--ink);
      display: flex;
      flex-direction: column;
    }

    /* ---------- Header chuẩn 3D ---------- */
    header {
      background: linear-gradient(135deg, var(--navy) 0%, var(--teal) 100%);
      color: #fff;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 10;
      box-shadow: 0 2px 10px rgba(10, 22, 40, 0.15);
      flex-shrink: 0;
    }

    .header-badge {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    header h1 {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
      letter-spacing: .01em;
      flex: 1;
    }

    /* ---------- Container chính ---------- */
    #app-body {
      position: relative;
      flex: 1;
      min-height: 550px;
      overflow: hidden;
      display: flex;
    }

    /* ---------- Background bối cảnh theo trạm (Khôi phục link ảnh) ---------- */
    #bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background-size: cover;
      background-position: center;
      transition: filter 1.2s ease, background-image 0.6s ease;
      filter: brightness(0.7) saturate(0.9);
    }

    body[data-station="0"] #bg {
      background-image: url('https://lh3.googleusercontent.com/d/1_Kv5bB17f9Juq1axPkANuCgrKEUwY8wG'), url('Bat_dau_vao_Tram_0.png');
      filter: brightness(0.45) saturate(0.7);
    }

    body[data-station="1"] #bg {
      background-image: url('https://lh3.googleusercontent.com/d/1MLlXZkNmPP4rXs9MAC7aYbHKSJBgMOOR'), url('1_Cong_den_Tram_1.png');
      filter: brightness(0.62) saturate(0.85);
    }

    body[data-station="2"] #bg {
      background-image: url('https://lh3.googleusercontent.com/d/1LblxGJdQxJ51oNkJwIYYO1hKvTUAgbIu'), url('2_Hanh_lang_Tram_2.png');
      filter: brightness(0.72) saturate(0.9);
    }

    body[data-station="3"] #bg {
      background-image: url('https://lh3.googleusercontent.com/d/1a-RqkU3rRw0v4M1FtHe1Eq9KuLI4tou2'), url('3_Buong_trung_tam_Tram_3.png');
      filter: brightness(0.8) saturate(0.95);
    }

    body[data-station="4"] #bg {
      background-image: url('https://lh3.googleusercontent.com/d/19Eb4_QRdwzHw__gSMiGqNGNY3JvvJGFy'), url('4_Kho_bau_Tram_4.png');
      filter: brightness(0.85) saturate(1);
    }

    body[data-station="5"] #bg {
      background-image: url('https://lh3.googleusercontent.com/d/1q1UsPlQU6ojLTa5eJiJV4iFMtZWXAsnJ'), url('5_Dich_cuoi_Tram_5.png');
      filter: brightness(1.05) saturate(1.1);
    }

    #warm-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 40%, rgba(255, 190, 110, 0.12), rgba(0, 0, 0, 0.4) 75%);
      mix-blend-mode: screen;
      transition: opacity 1s ease;
      opacity: 0.25;
    }

    #three-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: block;
    }

    #three-canvas.no-interact {
      pointer-events: none;
    }

    #label-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 6;
    }

    .point-label {
      position: absolute;
      top: 0;
      left: 0;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9), 0 0 8px rgba(0, 0, 0, 0.7);
      white-space: nowrap;
      will-change: transform;
      pointer-events: none;
    }

    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    #ui-layer>* {
      pointer-events: auto;
    }

    /* ---------- Sidebar trái: phù điêu + điểm + rank ---------- */
    #sidebar {
      position: absolute;
      top: 18px;
      left: 18px;
      width: 220px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 14px 16px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 24px rgba(10, 22, 40, 0.35);
      color: #f3e6cf;
    }

    #sidebar h3 {
      margin: 0 0 10px;
      font-size: 15px;
      font-weight: 700;
      color: var(--gold-bright);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #relic-frame {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }

    .relic-slot {
      width: 100%;
      aspect-ratio: 1;
      border: 1px solid rgba(68, 155, 116, 0.4);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10, 22, 16, 0.5);
      transition: all .3s ease;
    }

    .relic-slot.filled {
      background: rgba(68, 155, 116, 0.25);
      border-color: var(--jade-light);
      box-shadow: 0 0 12px rgba(68, 155, 116, 0.5) inset;
    }

    .relic-slot svg {
      width: 70%;
      height: 70%;
      opacity: 0.9;
    }

    #score-line {
      font-size: 13.5px;
      margin: 4px 0;
    }

    #score-value {
      color: var(--gold-bright);
      font-weight: 700;
    }

    #rank-line {
      font-size: 12.5px;
      color: #cbd5e1;
    }

    #stars-line {
      font-size: 14px;
      letter-spacing: 2px;
      color: var(--amber);
    }

    /* ---------- Keeper dialogue box ---------- */
    #keeper-box {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: min(680px, 90vw);
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 16px 20px;
      text-align: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }

    #keeper-name {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--gold-bright);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    #keeper-text {
      font-size: 14.5px;
      line-height: 1.6;
      color: #f3e6cf;
      min-height: 24px;
    }

    #keeper-buttons {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    /* ---------- Nút bấm ---------- */
    button.btn {
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
      background: linear-gradient(135deg, var(--jade-deep) 0%, var(--jade-main) 100%);
      border: 1px solid var(--jade-light);
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all .2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button.btn:hover:not(:disabled) {
      background: linear-gradient(135deg, var(--jade-main) 0%, var(--jade-light) 100%);
      box-shadow: 0 0 12px rgba(68, 155, 116, 0.4);
    }

    button.btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button.btn.secondary {
      background: rgba(20, 35, 27, 0.6);
      border-color: rgba(68, 155, 116, 0.4);
      color: #e2e8f0;
    }

    button.btn.secondary:hover:not(:disabled) {
      background: rgba(35, 122, 87, 0.3);
      color: #fff;
    }

    /* ---------- Panel trạm (góc phải) ---------- */
    #station-panel {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 320px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 16px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 24px rgba(10, 22, 40, 0.35);
      max-height: 80vh;
      overflow-y: auto;
      color: #f3e6cf;
    }

    #station-panel h4 {
      margin: 0 0 10px;
      font-size: 15px;
      font-weight: 700;
      color: var(--gold-bright);
    }

    #station-panel p.hint {
      font-size: 13.5px;
      color: #cbd5e1;
      line-height: 1.55;
      margin: 8px 0 12px;
    }

    .rule-list {
      font-size: 13px;
      color: #cbd5e1;
      margin: 8px 0;
      padding-left: 18px;
      line-height: 1.5;
    }

    .rule-list li {
      margin-bottom: 5px;
    }

    .plane-choice-btn {
      display: block;
      width: 100%;
      text-align: left;
      margin-bottom: 8px;
      background: rgba(20, 35, 27, 0.6);
      border: 1px solid rgba(68, 155, 116, 0.4);
      color: #f3e6cf;
      padding: 8px 12px;
      border-radius: 7px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13.5px;
      transition: all .2s;
    }

    .plane-choice-btn.selected {
      border-color: var(--gold-bright);
      background: rgba(35, 122, 87, 0.4);
      color: #fff;
    }

    .plane-choice-btn:hover {
      background: rgba(35, 122, 87, 0.25);
    }

    #station4-input-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 8px 0;
    }

    #m-percent-input {
      width: 70px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid var(--panel-border);
      background: rgba(10, 20, 15, 0.6);
      color: #fff;
      font-size: 14px;
      text-align: center;
    }

    #feedback-line {
      font-size: 13.5px;
      font-weight: 600;
      margin: 8px 0 4px;
      min-height: 20px;
    }

    #history-log {
      font-size: 12px;
      color: #cbd5e1;
      max-height: 110px;
      overflow-y: auto;
      margin-top: 6px;
      border-top: 1px dashed rgba(68, 155, 116, 0.3);
      padding-top: 6px;
    }

    #history-log div {
      margin-bottom: 2px;
    }

    .checkitem-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      text-align: left;
      margin-bottom: 8px;
      background: rgba(20, 35, 27, 0.5);
      border: 1px solid rgba(68, 155, 116, 0.4);
      color: #f3e6cf;
      padding: 8px 12px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 13px;
    }

    .checkitem-btn.done {
      background: rgba(27, 140, 90, 0.25);
      border-color: var(--correct);
      color: #d1fae5;
    }

    .checkitem-btn .tick {
      width: 16px;
      text-align: center;
    }

    /* ---------- Màn intro Trạm 0 ---------- */
    #intro-screen {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 30px;
      z-index: 7;
    }

    #intro-lines {
      max-width: 680px;
      font-size: 17px;
      line-height: 1.8;
      color: #f3e6cf;
    }

    #intro-lines .line {
      opacity: 0;
      transition: opacity 1.1s ease;
      margin-bottom: 12px;
    }

    #intro-lines .line.show {
      opacity: 1;
    }

    #intro-actions {
      margin-top: 24px;
      display: flex;
      gap: 14px;
    }

    #intro-actions button.btn {
      font-size: 14px;
      padding: 10px 20px;
    }

    #floor-score-badge {
      margin-top: 20px;
      font-size: 14px;
      color: var(--gold-bright);
    }

    /* ---------- Trạm 5 overlay tổng kết ---------- */
    #ending-overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(10, 22, 16, 0.65);
      flex-direction: column;
      text-align: center;
      z-index: 8;
    }

    #ending-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 24px 32px;
      width: min(480px, 90vw);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      color: #f3e6cf;
    }

    #ending-card h2 {
      margin: 0 0 8px;
      font-size: 18px;
      color: var(--gold-bright);
    }

    .ending-stat {
      font-size: 14px;
      margin: 6px 0;
      color: #e2e8f0;
    }

    .ending-stat b {
      color: var(--gold-bright);
      font-size: 18px;
    }

    #leaderboard-list {
      margin-top: 14px;
      max-height: 160px;
      overflow-y: auto;
      font-size: 12.5px;
      text-align: left;
    }

    #leaderboard-list div {
      display: flex;
      justify-content: space-between;
      padding: 4px 8px;
      border-radius: 5px;
    }

    #leaderboard-list div.me {
      background: rgba(35, 122, 87, 0.35);
      font-weight: 600;
    }

    #name-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    #name-row input {
      flex: 1;
      padding: 7px 10px;
      border-radius: 6px;
      border: 1px solid var(--panel-border);
      background: rgba(10, 20, 15, 0.6);
      color: #fff;
      font-size: 13px;
    }

    /* Mảnh phù điêu cuối */
    #relic-drop-zone {
      position: absolute;
      inset: 0;
      display: none;
      z-index: 7;
    }

    #drop-zone-hint {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      text-align: center;
      background: rgba(14, 30, 22, 0.85);
      border: 1px solid var(--panel-border);
      padding: 8px 18px;
      border-radius: 20px;
      white-space: nowrap;
    }

    #final-slot {
      position: absolute;
      width: 90px;
      height: 90px;
      border-radius: 12px;
      border: 3px dashed #449B74;
      box-shadow: 0 0 20px rgba(68, 155, 116, 0.55), inset 0 0 16px rgba(68, 155, 116, 0.25);
      background: rgba(10, 22, 16, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: slotPulse 1.8s ease-in-out infinite;
    }

    @keyframes slotPulse {

      0%,
      100% {
        box-shadow: 0 0 20px rgba(68, 155, 116, 0.55), inset 0 0 16px rgba(68, 155, 116, 0.25);
      }

      50% {
        box-shadow: 0 0 40px rgba(68, 155, 116, 0.95), inset 0 0 28px rgba(68, 155, 116, 0.5);
      }
    }

    #final-slot svg,
    #final-piece svg {
      width: 65%;
      height: 65%;
    }

    #final-piece {
      position: absolute;
      width: 90px;
      height: 90px;
      cursor: grab;
      touch-action: none;
      background: radial-gradient(circle, rgba(255, 240, 200, 0.95), rgba(255, 200, 110, 0.85));
      border: 3px solid #fff8e0;
      border-radius: 12px;
      box-shadow: 0 0 24px rgba(255, 220, 140, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: piecePulse 1.2s ease-in-out infinite;
    }

    @keyframes piecePulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.06);
      }
    }

    #final-piece.snapped {
      cursor: default;
      animation: none;
      background: radial-gradient(circle, rgba(200, 255, 235, 0.95), rgba(68, 155, 116, 0.85));
      border: 3px dashed #449B74;
      transform: scale(1);
    }

    #final-slot.near {
      border-color: #fff;
      transform: scale(1.04);
    }

    .flash-white {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      transition: opacity .35s ease;
    }

    .flash-white.on {
      opacity: 0.9;
      transition: opacity .05s ease;
    }

    #wrong-toast {
      position: absolute;
      top: 65px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(198, 40, 40, 0.9);
      color: #fff;
      border: 1px solid rgba(255, 200, 200, 0.4);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transition: opacity .3s ease;
      pointer-events: none;
      z-index: 9;
    }

    #wrong-toast.show {
      opacity: 1;
    }

    .hidden {
      display: none !important;
    }

    /* ---------- Responsive Media Queries (768px) ---------- */
    @media (max-width: 768px) {
      header h1 {
        font-size: 14px;
      }

      .header-badge {
        font-size: 10px;
        padding: 3px 8px;
      }

      #sidebar {
        top: 10px;
        left: 10px;
        width: 170px;
        padding: 10px;
      }

      #sidebar h3 {
        font-size: 13px;
      }

      #station-panel {
        top: auto;
        bottom: 85px;
        right: 10px;
        left: 10px;
        width: auto;
        max-height: 40vh;
        padding: 12px;
      }

      #keeper-box {
        bottom: 10px;
        padding: 12px 14px;
      }

      #keeper-text {
        font-size: 13px;
      }

      #intro-lines {
        font-size: 14.5px;
      }
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(68, 155, 116, 0.4);
      border-radius: 4px;
    }
  </style>
</head>

<body data-station="0">

  <header>
    <div class="header-badge">🧊 Hình học không gian</div>
  </header>

  <div id="app-body">
    <div id="bg"></div>
    <div id="warm-overlay"></div>
    <canvas id="three-canvas"></canvas>
    <div id="label-layer"></div>

    <div id="ui-layer">
      <div id="sidebar">
        <h3><i class="ti ti-cube"></i> Hành trình</h3>
        <div id="relic-frame"></div>
        <div id="score-line">Điểm: <span id="score-value">250</span></div>
        <div id="rank-line">Nhà khảo cổ tập sự</div>
        <div id="stars-line">⭐</div>
        <button class="btn secondary" id="btn-reset-station"
          style="width:100%; margin-top:10px; font-size:11px; padding:6px 8px;">
          <i class="ti ti-refresh"></i> Làm lại trạm
        </button>
      </div>

      <div id="station-panel" class="hidden"></div>
      <div id="wrong-toast"></div>

      <div id="keeper-box" class="hidden">
        <div id="keeper-name">Người Gác Đền</div>
        <div id="keeper-text"></div>
        <div id="keeper-buttons"></div>
      </div>

      <div id="intro-screen">
        <div id="intro-lines"></div>
        <div id="intro-actions" style="display:none;">
          <button class="btn secondary" id="btn-skip-intro">Bỏ qua</button>
          <button class="btn" id="btn-enter">Bước vào Đền thờ</button>
        </div>
        <div id="floor-score-badge"></div>
      </div>

      <div id="relic-drop-zone">
