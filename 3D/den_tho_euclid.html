  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    /* =========================================================================
       ĐỀN THỜ EUCLID — HÀNH TRÌNH ĐẦU TIÊN
       Standalone Three.js Simulation — Chuẩn hóa hệ thống Design 3D
       ========================================================================= */

    /* ---------------------- HỖ TRỢ LMS RESIZE & SAFE STORAGE ---------------------- */
    function LMS() {
      try { if (window.parent && window.parent !== window && window.parent.LMS) return window.parent.LMS(); } catch (e) { }
      return null;
    }
    function reportHeight() {
      const lms = LMS();
      if (lms && typeof lms.resize === 'function') {
        const h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
        lms.resize(h);
      }
    }
    window.addEventListener('load', reportHeight);
    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(reportHeight).observe(document.documentElement);
    } else {
      setInterval(reportHeight, 1000);
    }

    async function saveScoreToStorage(entry) {
      try {
        let list = [];
        if (window.storage && typeof window.storage.get === 'function') {
          const listRes = await window.storage.get('euclid_leaderboard', true).catch(() => null);
          if (listRes && listRes.value) {
            try { list = JSON.parse(listRes.value); } catch (e) { list = []; }
          }
        } else {
          try {
            const stored = localStorage.getItem('euclid_leaderboard');
            if (stored) list = JSON.parse(stored);
          } catch (e) { }
        }
        list.push(entry);
        list.sort((a, b) => b.score - a.score);
        list = list.slice(0, 30);
        if (window.storage && typeof window.storage.set === 'function') {
          await window.storage.set('euclid_leaderboard', JSON.stringify(list), true);
        } else {
          try { localStorage.setItem('euclid_leaderboard', JSON.stringify(list)); } catch (e) { }
        }
        return list;
      } catch (e) {
        return [];
      }
    }

    async function loadScoreFromStorage() {
      try {
        let list = [];
        if (window.storage && typeof window.storage.get === 'function') {
          const res = await window.storage.get('euclid_leaderboard', true).catch(() => null);
          if (res && res.value) {
            try { list = JSON.parse(res.value); } catch (e) { list = []; }
          }
        } else {
          try {
            const stored = localStorage.getItem('euclid_leaderboard');
            if (stored) list = JSON.parse(stored);
          } catch (e) { }
        }
        return list;
      } catch (e) {
        return [];
      }
    }

    /* ---------------------- KIỂM TRA THƯ VIỆN ĐÃ LOAD THÀNH CÔNG ---------------------- */
    if (typeof THREE === 'undefined' || typeof THREE.OrbitControls === 'undefined') {
      document.body.innerHTML = `<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#0a1628;color:#f3e6cf;font-family:sans-serif;text-align:center;padding:30px;">
    <div>
      <h2 style="color:#ffe3a3;">Không tải được thư viện Three.js</h2>
      <p>Vui lòng kiểm tra kết nối Internet (game cần tải Three.js từ CDN) rồi tải lại trang (F5).</p>
    </div></div>`;
      throw new Error('THREE hoặc THREE.OrbitControls chưa được load — dừng khởi tạo game.');
    }

    /* ---------------------- PHẦN A — HÀM TOÁN HỌC (06_geometry_math.md) ---------------------- */

    function definePlaneFromPoints(A, B, C) {
      const AB = new THREE.Vector3().subVectors(B, A);
      const AC = new THREE.Vector3().subVectors(C, A);
      const normal = new THREE.Vector3().crossVectors(AB, AC);
      if (normal.lengthSq() < 1e-8) return null;
      normal.normalize();
      return { normal, pointOnPlane: A.clone() };
    }

    function projectPointOntoPlane(M, plane) {
      const toPoint = new THREE.Vector3().subVectors(M, plane.pointOnPlane);
      const signedDist = toPoint.dot(plane.normal);
      const H = M.clone().sub(plane.normal.clone().multiplyScalar(signedDist));
      return { H, distance: Math.abs(signedDist), signedDist };
    }

    function classifyTwoPlanes(plane1, plane2) {
      const cross = new THREE.Vector3().crossVectors(plane1.normal, plane2.normal);
      return cross.lengthSq() < 1e-6 ? 'parallel' : 'intersects';
    }

    function intersectionOfTwoPlanes(plane1, plane2) {
      const dir = new THREE.Vector3().crossVectors(plane1.normal, plane2.normal);
      if (dir.lengthSq() < 1e-6) return null;
      dir.normalize();
      const n1 = plane1.normal, n2 = plane2.normal;
      const d1 = n1.dot(plane1.pointOnPlane);
      const d2 = n2.dot(plane2.pointOnPlane);
      const n1n2 = n1.dot(n2);
      const denom = 1 - n1n2 * n1n2; // Định thức chuẩn Cramer = 1 - k^2
      if (Math.abs(denom) < 1e-8) return null;
      const c1 = (d1 - d2 * n1n2) / denom;
      const c2 = (d2 - d1 * n1n2) / denom;
      const point = new THREE.Vector3().addScaledVector(n1, c1).addScaledVector(n2, c2);
      return { point, dir };
    }

    function lineIntersectPlane(lineStart, lineEnd, plane) {
      const lineDir = new THREE.Vector3().subVectors(lineEnd, lineStart);
      const denom = lineDir.dot(plane.normal);
      if (Math.abs(denom) < 1e-8) return null;
      const t = new THREE.Vector3().subVectors(plane.pointOnPlane, lineStart).dot(plane.normal) / denom;
      const point = lineStart.clone().add(lineDir.clone().multiplyScalar(t));
      return { point, t };
    }

    function projectPointOntoLine(M, linePoint, lineDir) {
      const d = lineDir.clone().normalize();
      const t = new THREE.Vector3().subVectors(M, linePoint).dot(d);
      const H = linePoint.clone().add(d.clone().multiplyScalar(t));
      return { H, distance: M.distanceTo(H), t };
    }

    function polygonArea(vertices) {
      if (vertices.length < 3) return 0;
      let total = 0;
      const v0 = vertices[0];
      for (let i = 1; i < vertices.length - 1; i++) {
        const v1 = new THREE.Vector3().subVectors(vertices[i], v0);
        const v2 = new THREE.Vector3().subVectors(vertices[i + 1], v0);
        total += v1.clone().cross(v2).length() / 2;
      }
      return total;
    }

    function segmentIntersection(p1, p2, p3, p4) {
      const plane = definePlaneFromPoints(p1, p2, p3) || definePlaneFromPoints(p1, p2, p4);
      if (!plane) return null;
      const u = new THREE.Vector3().subVectors(p2, p1).normalize();
      const v = new THREE.Vector3().crossVectors(plane.normal, u).normalize();
      const to2D = (P) => {
        const rel = new THREE.Vector3().subVectors(P, p1);
        return { x: rel.dot(u), y: rel.dot(v) };
      };
      const a = to2D(p1), b = to2D(p2), c = to2D(p3), d = to2D(p4);
      const denom = (b.x - a.x) * (d.y - c.y) - (b.y - a.y) * (d.x - c.x);
      if (Math.abs(denom) < 1e-9) return null;
      const t = ((c.x - a.x) * (d.y - c.y) - (c.y - a.y) * (d.x - c.x)) / denom;
      const s = ((c.x - a.x) * (b.y - a.y) - (c.y - a.y) * (b.x - a.x)) / denom;
      if (t < -1e-6 || t > 1 + 1e-6 || s < -1e-6 || s > 1 + 1e-6) return null;
      const point = new THREE.Vector3().lerpVectors(p1, p2, t);
      return { point, t, s };
    }

    /* ---------------------- PHẦN B — THREE.JS SCENE SETUP ---------------------- */

    const canvas = document.getElementById('three-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    function resizeCanvasToWrap() {
      const wrap = document.getElementById('app-body');
      const w = wrap.clientWidth;
      const h = wrap.clientHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2.2, 7.5);

    const orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
    orbitControls.enableDamping = true;
    orbitControls.dampingFactor = 0.08;
    orbitControls.minDistance = 3;
    orbitControls.maxDistance = 16;

    const ambient = new THREE.AmbientLight(0x8a6a3f, 0.55);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffdca8, 0.9);
    dirLight.position.set(3, 6, 4);
    scene.add(dirLight);
    const warmPoint = new THREE.PointLight(0xffb763, 0.6, 20);
    warmPoint.position.set(0, 3, 2);
    scene.add(warmPoint);

    window.addEventListener('resize', resizeCanvasToWrap);
    resizeCanvasToWrap();

    function animate() {
      requestAnimationFrame(animate);
      orbitControls.update();
      if (window.__frameHook) window.__frameHook();
      renderer.render(scene, camera);
    }
    animate();

    function setLightingForStation(n) {
      const warmth = [0.35, 0.5, 0.65, 0.8, 0.95, 1.25][n] ?? 0.5;
      ambient.intensity = 0.3 + warmth * 0.35;
      dirLight.intensity = 0.5 + warmth * 0.7;
      warmPoint.intensity = 0.3 + warmth * 0.8;
      const hue = 0.09 - warmth * 0.02;
      dirLight.color.setHSL(hue, 0.55, 0.7);
    }

    function clearScene3D() {
      const keep = new Set([ambient, dirLight, warmPoint]);
      [...scene.children].forEach(obj => {
        if (keep.has(obj)) return;
        scene.remove(obj);
        obj.traverse?.(o => {
          if (o.geometry) o.geometry.dispose();
          if (o.material) {
            (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose && m.dispose());
          }
        });
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          (Array.isArray(obj.material) ? obj.material : [obj.material]).forEach(m => m.dispose && m.dispose());
        }
      });
      window.__frameHook = null;
      window.__onDragUpdate = null;
      allDraggableHitMeshes = [];
      clearAllLabels();
    }

    /* ---------------------- PHẦN C — KÉO ĐIỂM TỰ DO (DraggablePoint) ---------------------- */

    let allDraggableHitMeshes = [];
    const raycaster = new THREE.Raycaster();
    const mouseNDC = new THREE.Vector2();
    let dragState = { active: false, point: null, dragPlane: null };

    function updateMouseNDC(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      const cx = event.clientX ?? (event.touches && event.touches[0].clientX);
      const cy = event.clientY ?? (event.touches && event.touches[0].clientY);
      mouseNDC.x = ((cx - rect.left) / rect.width) * 2 - 1;
      mouseNDC.y = -((cy - rect.top) / rect.height) * 2 + 1;
    }

    class DraggablePoint {
      constructor(position, color, label, radius = 0.11) {
        this.label = label; this.color = color;
        const geometry = new THREE.SphereGeometry(radius, 24, 24);
        const material = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.4 });
        this.mesh = new THREE.Mesh(geometry, material);
        this.mesh.position.copy(position);
        this.mesh.userData.draggable = this;
        scene.add(this.mesh);

        const hitGeo = new THREE.SphereGeometry(radius * 3.5, 12, 12);
        const hitMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false });
        this.hitMesh = new THREE.Mesh(hitGeo, hitMat);
        this.hitMesh.position.copy(position);
        this.hitMesh.userData.draggable = this;
        scene.add(this.hitMesh);

        allDraggableHitMeshes.push(this.mesh, this.hitMesh);

        const ringGeo = new THREE.RingGeometry(radius * 1.6, radius * 2, 32);
        const ringMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0, side: THREE.DoubleSide });
        this.ring = new THREE.Mesh(ringGeo, ringMat);
        this.ring.position.copy(position);
        scene.add(this.ring);
      }
      get position() { return this.mesh.position; }
      setDragging(active) {
        if (this.locked) return;
        this.ring.material.opacity = active ? 0.85 : 0;
        this.mesh.material.emissiveIntensity = active ? 0.75 : 0.4;
      }
      setLocked(locked) {
        this.locked = locked;
        if (locked) {
          this.ring.material.opacity = 0;
          this.mesh.material.emissiveIntensity = 0.5;
        }
      }
      syncRing() {
        this.ring.position.copy(this.mesh.position);
        this.ring.lookAt(camera.position);
        this.hitMesh.position.copy(this.mesh.position);
      }
      dispose() {
        scene.remove(this.mesh); scene.remove(this.hitMesh); scene.remove(this.ring);
      }
    }

    function makeFixedMarker(pos, color, radius = 0.1) {
      const geo = new THREE.SphereGeometry(radius, 20, 20);
      const mat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.5 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(pos);
      scene.add(mesh);
      return mesh;
    }

    /* ---------------------- NHÃN ĐIỂM HTML (GPU Accelerated Transform) ---------------------- */
    let activeLabels = [];
    function createLabel3D(text, color = '#ffe3a3') {
      const el = document.createElement('div');
      el.className = 'point-label';
      el.textContent = text;
      el.style.color = color;
      document.getElementById('label-layer').appendChild(el);
      const entry = {
        el,
        update(worldPos) {
          const labelPos = worldPos.clone().add(new THREE.Vector3(0, 0.22, 0));
          const screenPos = labelPos.project(camera);
          if (screenPos.z > 1 || screenPos.z < -1) { el.style.display = 'none'; return; }
          el.style.display = 'block';
          const rect = renderer.domElement.getBoundingClientRect();
          const x = (screenPos.x * 0.5 + 0.5) * rect.width;
          const y = (-screenPos.y * 0.5 + 0.5) * rect.height;
          el.style.transform = `translate(${x}px, ${y}px) translate(-50%, -150%)`;
        }
      };
      activeLabels.push(entry);
      return entry;
    }
    function clearAllLabels() {
      activeLabels.forEach(l => l.el.remove());
      activeLabels = [];
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (canvas.classList.contains('no-interact')) return;
      updateMouseNDC(e);
      raycaster.setFromCamera(mouseNDC, camera);
      const hits = raycaster.intersectObjects(allDraggableHitMeshes);
      if (hits.length > 0) {
        const pt = hits[0].object.userData.draggable;
        if (pt.locked) return;
        dragState.active = true; dragState.point = pt;
        const camDir = new THREE.Vector3(); camera.getWorldDirection(camDir);
        dragState.dragPlane = new THREE.Plane().setFromNormalAndCoplanarPoint(camDir, pt.position);
        pt.setDragging(true);
        orbitControls.enabled = false;
      }
    });
    canvas.addEventListener('pointermove', (e) => {
      updateMouseNDC(e);
      if (!dragState.active || !dragState.point) {
        raycaster.setFromCamera(mouseNDC, camera);
        const hits = raycaster.intersectObjects(allDraggableHitMeshes);
        const hoverable = hits.length > 0 && !hits[0].object.userData.draggable.locked;
        canvas.style.cursor = hoverable ? 'grab' : 'default';
        return;
      }
      raycaster.setFromCamera(mouseNDC, camera);
      const intersection = new THREE.Vector3();
      if (raycaster.ray.intersectPlane(dragState.dragPlane, intersection)) {
        dragState.point.mesh.position.copy(intersection);
        if (window.__onDragUpdate) window.__onDragUpdate(dragState.point);
      }
    });
    function endDrag() {
      if (dragState.active && dragState.point) dragState.point.setDragging(false);
      dragState.active = false; dragState.point = null; dragState.dragPlane = null;
      orbitControls.enabled = true;
    }
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointerleave', endDrag);

    /* ---------------------- PHẦN D — GAME STATE & SCORE ---------------------- */

    const FLOOR_SCORE = 250;
    const game = {
      station: 0,
      bonuses: [0, 0, 0, 0, 0],
      relics: [false, false, false, false, false],
      badges: { planes: false, intersections: false, structures: false, sections: false },
      runStart: Date.now(),
      stationStart: Date.now(),
    };

    function currentScore() {
      return FLOOR_SCORE + game.bonuses.reduce((a, b) => a + b, 0);
    }
    function computeSpeedBonus(elapsedSec, attempts = 1) {
      let bonus = 150 - elapsedSec * 3 - (attempts - 1) * 8;
      return Math.max(20, Math.round(bonus));
    }
    function getRankInfo(score) {
      if (score >= 700) return { name: 'Keeper of Geometry', stars: 5 };
      if (score >= 550) return { name: 'Đại khảo cổ gia', stars: 4 };
      if (score >= 420) return { name: 'Người giải mã', stars: 3 };
      return { name: '🏺 Nhà khảo cổ tập sự', stars: 2 };
    }

    const RELIC_ICONS = [
      `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="5" fill="#FAC775"/></svg>`,
      `<svg viewBox="0 0 40 40"><line x1="6" y1="34" x2="34" y2="6" stroke="#FAC775" stroke-width="3"/></svg>`,
      `<svg viewBox="0 0 40 40"><polygon points="20,6 34,30 6,30" fill="none" stroke="#FAC775" stroke-width="3"/></svg>`,
      `<svg viewBox="0 0 40 40"><polygon points="20,4 36,30 4,30" fill="none" stroke="#FAC775" stroke-width="2.5"/><line x1="20" y1="4" x2="20" y2="30" stroke="#FAC775" stroke-width="1.5"/></svg>`,
      `<svg viewBox="0 0 40 40"><rect x="8" y="8" width="24" height="24" fill="none" stroke="#FAC775" stroke-width="2.5" transform="rotate(15 20 20)"/></svg>`,
    ];
    const FINAL_SLOT_ICON = `<svg viewBox="0 0 40 40"><rect x="8" y="8" width="24" height="24" fill="none" stroke="#449B74" stroke-width="3" transform="rotate(15 20 20)"/></svg>`;
    const FINAL_PIECE_ICON = `<svg viewBox="0 0 40 40"><rect x="8" y="8" width="24" height="24" fill="none" stroke="#1F2923" stroke-width="4" transform="rotate(15 20 20)"/></svg>`;

    function renderSidebar() {
      const frame = document.getElementById('relic-frame');
      frame.innerHTML = '';
      for (let i = 0; i < 5; i++) {
        const slot = document.createElement('div');
        slot.className = 'relic-slot' + (game.relics[i] ? ' filled' : '');
        slot.innerHTML = game.relics[i] ? RELIC_ICONS[i] : '';
        frame.appendChild(slot);
      }
      const score = currentScore();
      document.getElementById('score-value').textContent = score;
      const rank = getRankInfo(score);
      document.getElementById('rank-line').textContent = rank.name;
      document.getElementById('stars-line').textContent = '⭐'.repeat(rank.stars);
    }
    renderSidebar();

    /* ---------------------- PHẦN E — KEEPER DIALOGUE ---------------------- */

    function keeperSay(text, buttons = []) {
      const box = document.getElementById('keeper-box');
      box.classList.remove('hidden');
      const t = document.getElementById('keeper-text');
      t.style.opacity = 0;
      setTimeout(() => { t.textContent = text; t.style.transition = 'opacity .5s'; t.style.opacity = 1; }, 150);
      const btnWrap = document.getElementById('keeper-buttons');
      btnWrap.innerHTML = '';
      buttons.forEach(b => {
        const el = document.createElement('button');
        el.className = 'btn' + (b.secondary ? ' secondary' : '');
        el.textContent = b.label;
        el.onclick = b.onClick;
        btnWrap.appendChild(el);
      });
    }
    function keeperHide() { document.getElementById('keeper-box').classList.add('hidden'); }
    function showWrongToast(msg) {
      const el = document.getElementById('wrong-toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(el.__t);
      el.__t = setTimeout(() => el.classList.remove('show'), 2600);
    }
    function flashWhite(duration = 700) {
      const f = document.getElementById('flash-white');
      f.classList.add('on');
      setTimeout(() => { f.style.transition = 'opacity .6s ease'; f.classList.remove('on'); }, 90);
    }

    /* ---------------------- PHẦN F — STATION PANEL HELPER ---------------------- */

    function setStationPanel(html) {
      const p = document.getElementById('station-panel');
      if (!html) { p.classList.add('hidden'); p.innerHTML = ''; return; }
      p.classList.remove('hidden');
      p.innerHTML = html;
    }

    const STATION_SETUP = {
      0: setupStation0, 1: setupStation1, 2: setupStation2, 3: setupStation3,
      4: setupStation4, 5: setupStation5
    };

    function goToStation(n) {
      game.station = n;
      game.stationStart = Date.now();
      document.body.setAttribute('data-station', String(n));
      setLightingForStation(n);
      clearScene3D();
      keeperHide();
      setStationPanel('');
      document.getElementById('intro-screen').classList.add('hidden');
      document.getElementById('ending-overlay').style.display = 'none';
      document.getElementById('relic-drop-zone').style.display = 'none';
      canvas.classList.remove('no-interact');
      renderSidebar();

      const resetBtn = document.getElementById('btn-reset-station');
      resetBtn.style.display = (n >= 1 && n <= 4) ? 'inline-flex' : 'none';

      STATION_SETUP[n]();
      reportHeight();
    }

    function resetCurrentStation() {
      const n = game.station;
      if (n < 1 || n > 4) return;
      clearScene3D();
      keeperHide();
      setStationPanel('');
      canvas.classList.remove('no-interact');
      STATION_SETUP[n]();
    }
    document.getElementById('btn-reset-station').addEventListener('click', resetCurrentStation);

    /* ======================= TRẠM 0 — NHẬP MÔN ======================= */

    function setupStation0() {
      canvas.classList.add('no-interact');
      camera.position.set(0, 2.5, 9);
      orbitControls.enabled = false;

      const gate = new THREE.Mesh(
        new THREE.TorusGeometry(1.6, 0.12, 12, 40, Math.PI),
        new THREE.MeshStandardMaterial({ color: 0x449B74, emissive: 0x1B5E43, emissiveIntensity: 0.3 })
      );
      gate.position.set(0, 0, -2);
      gate.rotation.z = Math.PI;
      scene.add(gate);

      const intro = document.getElementById('intro-screen');
      intro.classList.remove('hidden');
      const linesWrap = document.getElementById('intro-lines');
      linesWrap.innerHTML = '';
      const lines = [
        "Tương truyền, nơi đây từng cất giữ Tinh thể Tri thức — ánh sáng của mọi quy luật không gian.",
        "Người xưa đã phong ấn ngôi đền này, chỉ mở ra cho ai thực sự thấu hiểu điểm, đường, mặt phẳng, và hình khối.",
        "Ta là Người Gác Đền. Ta sẽ không cho ngươi đáp án — chỉ dẫn đường.",
        "Ngươi đã sẵn sàng bước vào chưa?"
      ];
      lines.forEach((txt, i) => {
        const d = document.createElement('div');
        d.className = 'line show';
        d.style.opacity = '1';
        d.textContent = txt;
        linesWrap.appendChild(d);
      });
      document.getElementById('floor-score-badge').textContent = 'Điểm khởi đầu (mốc sàn): 250';
      const actions = document.getElementById('intro-actions');
      actions.style.display = 'flex';

      const btnEnter = document.getElementById('btn-enter');
      const btnSkip = document.getElementById('btn-skip-intro');
      if (btnEnter) {
        btnEnter.onclick = function (e) {
          if (e) e.stopPropagation();
          goToStation(1);
        };
      }
      if (btnSkip) {
        btnSkip.onclick = function (e) {
          if (e) e.stopPropagation();
          goToStation(1);
        };
      }
    }

    /* ======================= TRẠM 1 — CỔNG ĐỀN ======================= */

    function setupStation1() {
      camera.position.set(0, 1.6, 6.5);
      orbitControls.target.set(0, 1.2, 0);

      const gateFrame = new THREE.Mesh(
        new THREE.BoxGeometry(3.2, 3.4, 0.3),
        new THREE.MeshStandardMaterial({ color: 0x14432F, roughness: 0.9 })
      );
      gateFrame.position.set(0, 1.4, -1.2);
      scene.add(gateFrame);
      const gateHole = new THREE.Mesh(
        new THREE.BoxGeometry(2.4, 2.8, 0.32),
        new THREE.MeshStandardMaterial({ color: 0x0a1628 })
      );
      gateHole.position.set(0, 1.35, -1.19);
      scene.add(gateHole);

      let A = new THREE.Vector3(-1.5, 2.1, 0.5);
      let B = new THREE.Vector3(-1.6, 1.1, 0.6);
      let C = new THREE.Vector3(-0.6, 1.6, 0.35);
      const D = new THREE.Vector3(0, 1.35, -1.0);

      const pA = new DraggablePoint(A, 0x9be1ff, 'A');
      const pB = new DraggablePoint(B, 0x9be1ff, 'B');
      const pC = new DraggablePoint(C, 0x9be1ff, 'C');
      makeFixedMarker(D, 0xFAC775, 0.1);

      const labelA = createLabel3D('A', '#9be1ff');
      const labelB = createLabel3D('B', '#9be1ff');
      const labelC = createLabel3D('C', '#9be1ff');
      const labelD = createLabel3D('D', '#FAC775');
      window.__frameHook = () => {
        pA.syncRing(); pB.syncRing(); pC.syncRing();
        labelA.update(pA.position); labelB.update(pB.position); labelC.update(pC.position);
        labelD.update(D);
      };

      let planeMesh = null;
      let unlocked = false;
      let stage = 'wait-plane';

      function rebuild() {
        const plane = definePlaneFromPoints(pA.position, pB.position, pC.position);
        if (planeMesh) { scene.remove(planeMesh); planeMesh.geometry.dispose(); planeMesh.material.dispose(); planeMesh = null; }
        if (!plane) {
          stage = 'wait-plane';
          keeperSay('Phiến đá... không thể tạo hình. Ba điểm này dường như nằm trên một đường thẳng.');
          updatePanel();
          return;
        }
        const geo = new THREE.PlaneGeometry(6, 6);
        const mat = new THREE.MeshStandardMaterial({
          color: 0x3b82f6, roughness: 0.85, transparent: true, opacity: 0.22, side: THREE.DoubleSide
        });
        planeMesh = new THREE.Mesh(geo, mat);
        planeMesh.position.copy(plane.pointOnPlane);
        planeMesh.lookAt(plane.pointOnPlane.clone().add(plane.normal));
        scene.add(planeMesh);

        const proj = projectPointOntoPlane(D, plane);
        if (proj.distance < 0.18) {
          if (!unlocked) {
            unlocked = true;
            onGateUnlocked();
          }
          stage = 'unlocked';
        } else {
          stage = 'plane-ok';
          if (!unlocked) keeperSay('Phiến đá đã thành hình. Nhưng cổng chỉ mở khi nó chạm đúng vào Ấn Phong.');
        }
        updatePanel();
      }

      function onGateUnlocked() {
        pA.setLocked(true);
        pB.setLocked(true);
        pC.setLocked(true);
        keeperSay('Cổng rung chuyển... ánh sáng khắc sâu bừng lên. Ngươi giờ có thể nhìn thấy những mặt phẳng ẩn giấu.', [
          { label: 'Tiếp tục tới Trạm 2', onClick: () => finishStation1() }
        ]);
        gateHole.material.color.set(0x449B74);
        gateHole.material.emissive = new THREE.Color(0x237A57);
        gateHole.material.emissiveIntensity = 0.6;
        dirLight.intensity += 0.3;
        let t = 0;
        const shakeId = setInterval(() => {
          t += 1; gateFrame.position.x = Math.sin(t) * 0.02;
          if (t > 20) { clearInterval(shakeId); gateFrame.position.x = 0; }
        }, 30);
      }

      function finishStation1() {
        const elapsed = (Date.now() - game.stationStart) / 1000;
        game.bonuses[1] = computeSpeedBonus(elapsed, 1);
        game.relics[0] = true;
        game.badges.planes = true;
        renderSidebar();
        goToStation(2);
      }

      window.__onDragUpdate = () => rebuild();

      function updatePanel() {
        setStationPanel(`
      <h4>Trạm 1 · Cổng đền</h4>
      <p class="hint">Kéo tự do 3 điểm sáng A, B, C để dựng phiến đá (mặt phẳng), rồi chỉnh sao cho phiến đá chạm đúng Ấn Phong (điểm vàng D).</p>
      <ul class="rule-list">
        <li>Ba điểm không thẳng hàng → xác định 1 mặt phẳng duy nhất.</li>
        <li>Mặt phẳng đi qua D → cổng mở.</li>
      </ul>
      <div style="font-size:13.5px; font-weight:600; margin-top:10px; color:${stage === 'unlocked' ? '#d1fae5' : '#FAC775'}">
        Trạng thái: ${stage === 'wait-plane' ? 'Chưa dựng được phiến đá' : stage === 'plane-ok' ? 'Phiến đá đã thành hình — chưa chạm Ấn Phong' : 'Cổng đã mở ✓'}
      </div>
    `);
      }

      keeperSay('Trước mặt ngươi là cánh cổng của Đền thờ Euclid. Hãy dựng nên phiến đá phong ấn — một mặt phẳng đi qua ba điểm sáng.');
      rebuild();
    }

    /* ======================= TRẠM 2 — HÀNH LANG GIAO NHAU ======================= */

    function setupStation2() {
      camera.position.set(0, 2.0, 6.5);
      orbitControls.target.set(0, 1.3, -2);

      const baseAx = -1.6, baseBx = 1.6;
      const wallDepthStart = -0.6, wallDepthEnd = -5.2;
      const midZ = (wallDepthStart + wallDepthEnd) / 2;
      const R_ARM = 2.6;
      const THETA_MIN = 0.03, THETA_MAX = 1.4;

      const altar = new THREE.Vector3(0, 1.5, -4.6);
      const altarMesh = new THREE.Mesh(
        new THREE.OctahedronGeometry(0.22),
        new THREE.MeshStandardMaterial({ color: 0x3b82f6, emissive: 0x3b82f6, emissiveIntensity: 0.4 })
      );
      altarMesh.position.copy(altar);
      scene.add(altarMesh);

      function handlePos(baseX, inward, theta) {
        return new THREE.Vector3(baseX + inward * R_ARM * Math.sin(theta), R_ARM * Math.cos(theta), midZ);
      }

      let thetaA = 0.12, thetaB = 0.12;

      const baseBottomA = new THREE.Vector3(baseAx, 0, wallDepthStart);
      const baseFarA = new THREE.Vector3(baseAx, 0, wallDepthEnd);
      const baseBottomB = new THREE.Vector3(baseBx, 0, wallDepthStart);
      const baseFarB = new THREE.Vector3(baseBx, 0, wallDepthEnd);
      makeFixedMarker(baseBottomA, 0x449B74, 0.07);
      makeFixedMarker(baseFarA, 0x449B74, 0.07);
      makeFixedMarker(baseBottomB, 0x449B74, 0.07);
      makeFixedMarker(baseFarB, 0x449B74, 0.07);
      const hingeLineA = new THREE.Line(new THREE.BufferGeometry().setFromPoints([baseBottomA, baseFarA]), new THREE.LineBasicMaterial({ color: 0x237A57 }));
      const hingeLineB = new THREE.Line(new THREE.BufferGeometry().setFromPoints([baseBottomB, baseFarB]), new THREE.LineBasicMaterial({ color: 0x237A57 }));
      scene.add(hingeLineA); scene.add(hingeLineB);

      const handleA = new DraggablePoint(handlePos(baseAx, 1, thetaA), 0xFAC775, 'Tay cầm A', 0.13);
      const handleB = new DraggablePoint(handlePos(baseBx, -1, thetaB), 0xFAC775, 'Tay cầm B', 0.13);

      let wallMeshA = null, wallMeshB = null, glowLine = null, converged = false;

      function buildWallMesh(baseBottom, baseFar, handlePosition, color) {
        const plane = definePlaneFromPoints(baseBottom, baseFar, handlePosition);
        const geo = new THREE.PlaneGeometry(7, 7, 1, 1);
        const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.9, side: THREE.DoubleSide, transparent: true, opacity: 0.22 });
        const mesh = new THREE.Mesh(geo, mat);
        if (plane) {
          mesh.position.copy(baseBottom).lerp(baseFar, 0.5);
          mesh.lookAt(mesh.position.clone().add(plane.normal));
        }
        return { mesh, plane };
      }

      function levelFor(dist) {
        if (dist < 0.4) return { label: 'Hội tụ!', color: '#d1fae5' };
        if (dist < 1.0) return { label: 'Rất gần', color: '#a7f3d0' };
        if (dist < 2.2) return { label: 'Gần', color: '#fef08a' };
        if (dist < 3.8) return { label: 'Còn xa', color: '#fed7aa' };
        return { label: 'Rất xa', color: '#fca5a5' };
      }

      let lastLevel = null;

      function rebuild() {
        if (wallMeshA) scene.remove(wallMeshA);
        if (wallMeshB) scene.remove(wallMeshB);
        if (glowLine) { scene.remove(glowLine); glowLine = null; }

        const rA = buildWallMesh(baseBottomA, baseFarA, handleA.position, 0x3b82f6);
        const rB = buildWallMesh(baseBottomB, baseFarB, handleB.position, 0xa78bfa);
        wallMeshA = rA.mesh; wallMeshB = rB.mesh;
        scene.add(wallMeshA); scene.add(wallMeshB);

        let status = 'parallel';
        if (rA.plane && rB.plane) {
          const rel = classifyTwoPlanes(rA.plane, rB.plane);
          if (rel === 'intersects') {
            const inter = intersectionOfTwoPlanes(rA.plane, rB.plane);
            if (inter) {
              const geo = new THREE.BufferGeometry().setFromPoints([
                inter.point.clone().sub(inter.dir.clone().multiplyScalar(7)),
                inter.point.clone().add(inter.dir.clone().multiplyScalar(7))
              ]);
              const mat = new THREE.LineBasicMaterial({ color: 0xFAC775, linewidth: 2 });
              glowLine = new THREE.Line(geo, mat);
              scene.add(glowLine);

              const degA = Math.round(thetaA * 180 / Math.PI);
              const degB = Math.round(thetaB * 180 / Math.PI);
              const isAngleAOk = (degA >= 45 && degA <= 47);
              const isAngleBOk = (degB >= 45 && degB <= 47);

              const distToAltar = projectPointOntoLine(altar, inter.point, inter.dir).distance;
              lastLevel = levelFor(distToAltar);
              if (distToAltar < 0.4 && isAngleAOk && isAngleBOk) {
                status = 'converged';
                if (!converged) { converged = true; onConverged(); }
              } else {
                status = 'intersect-off';
                if (distToAltar < 0.4 && (!isAngleAOk || !isAngleBOk)) {
                  lastLevel = { label: 'Cần chỉnh CẢ HAI bức tường về 46° - 47°', color: '#fef08a' };
                }
              }
            }
          } else {
            lastLevel = null;
          }
        }
        updatePanel(status);
      }

      function onConverged() {
        handleA.setLocked(true);
        handleB.setLocked(true);
        altarMesh.material.emissiveIntensity = 1.2;
        keeperSay('Biểu tượng con mắt bừng sáng. Hai luồng sáng đã hội tụ đúng nơi cần đến.', [
          { label: 'Tiếp tục tới Trạm 3', onClick: finishStation2 }
        ]);
      }
      function finishStation2() {
        const elapsed = (Date.now() - game.stationStart) / 1000;
        game.bonuses[2] = computeSpeedBonus(elapsed, 1);
        game.relics[1] = true;
        game.badges.intersections = true;
        renderSidebar();
        goToStation(3);
      }

      function snapToHinge(pt, baseX, inward) {
        const raw = pt.mesh.position;
        const dx = inward * (raw.x - baseX);
        const dy = Math.max(0.2, raw.y);
        let theta = Math.atan2(dx, dy);
        theta = Math.max(THETA_MIN, Math.min(THETA_MAX, theta));
        pt.mesh.position.copy(handlePos(baseX, inward, theta));
        pt.hitMesh.position.copy(pt.mesh.position);
        return theta;
      }

      window.__onDragUpdate = (pt) => {
        if (pt === handleA) thetaA = snapToHinge(handleA, baseAx, 1);
        else if (pt === handleB) thetaB = snapToHinge(handleB, baseBx, -1);
        syncSliders();
        rebuild();
      };

      function setThetaFromSlider(which, deg) {
        const theta = Math.max(THETA_MIN, Math.min(THETA_MAX, deg * Math.PI / 180));
        if (which === 'A') { thetaA = theta; handleA.mesh.position.copy(handlePos(baseAx, 1, theta)); handleA.hitMesh.position.copy(handleA.mesh.position); }
        else { thetaB = theta; handleB.mesh.position.copy(handlePos(baseBx, -1, theta)); handleB.hitMesh.position.copy(handleB.mesh.position); }
        rebuild();
      }

      function syncSliders() {
        const sa = document.getElementById('slider-wallA'), sb = document.getElementById('slider-wallB');
        const va = document.getElementById('val-wallA'), vb = document.getElementById('val-wallB');
        if (sa) sa.value = (thetaA * 180 / Math.PI).toFixed(0);
        if (sb) sb.value = (thetaB * 180 / Math.PI).toFixed(0);
        if (va) va.textContent = (thetaA * 180 / Math.PI).toFixed(0) + '°';
        if (vb) vb.textContent = (thetaB * 180 / Math.PI).toFixed(0) + '°';
      }

      function updatePanel(status) {
        let msg;
        if (status === 'parallel') msg = 'Hai bức tường vẫn chưa chạm nhau...';
        else if (status === 'intersect-off') msg = 'Khe sáng đã hiện... nhưng nó chưa chạm tới điều ngươi tìm kiếm.';
        else msg = 'Khe sáng đã chạm đúng bệ thờ ✓';
        setStationPanel(`
      <h4>Trạm 2 · Hành lang giao nhau</h4>
      <p class="hint">Kéo tay cầm (vàng) của Tường A/B — mỗi tay cầm chỉ xoay quanh chân tường cố định. Có thể dùng thanh trượt bên dưới để chỉnh chính xác hơn.</p>
      <div style="display:flex; align-items:center; gap:8px; margin:8px 0;">
        <span style="width:72px; font-size:13.5px; font-weight:600;">Tường A</span>
        <input type="range" id="slider-wallA" min="0" max="80" step="0.5" value="${(thetaA * 180 / Math.PI).toFixed(0)}" style="flex:1; accent-color: var(--teal);">
        <span id="val-wallA" style="width:38px; font-size:13.5px; font-weight:600;">${(thetaA * 180 / Math.PI).toFixed(0)}°</span>
      </div>
      <div style="display:flex; align-items:center; gap:8px; margin:8px 0 12px;">
        <span style="width:72px; font-size:13.5px; font-weight:600;">Tường B</span>
        <input type="range" id="slider-wallB" min="0" max="80" step="0.5" value="${(thetaB * 180 / Math.PI).toFixed(0)}" style="flex:1; accent-color: var(--teal);">
        <span id="val-wallB" style="width:38px; font-size:13.5px; font-weight:600;">${(thetaB * 180 / Math.PI).toFixed(0)}°</span>
      </div>
      <div style="font-size:13.5px; font-weight:600; margin-top:10px; color:${lastLevel ? lastLevel.color : '#FAC775'}">
        ${msg}${lastLevel ? ' — ' + lastLevel.label : ''}
      </div>
    `);
        const sa = document.getElementById('slider-wallA');
        const sb = document.getElementById('slider-wallB');
        if (sa) sa.addEventListener('input', (e) => setThetaFromSlider('A', parseFloat(e.target.value)));
        if (sb) sb.addEventListener('input', (e) => setThetaFromSlider('B', parseFloat(e.target.value)));
      }

      keeperSay('Hai bức tường này có thể giao nhau ở một đường thẳng duy nhất. Hãy xoay chúng cho tới khi khe sáng ấy hiện ra.');
      rebuild();
    }

    /* ======================= TRẠM 3 — BUỒNG TRUNG TÂM ======================= */

    function setupStation3() {
      camera.position.set(5.5, 4.0, 7.0);
      orbitControls.target.set(0, 1, 0);

      const S = new THREE.Vector3(0, 3.2, 0);
      const A = new THREE.Vector3(-1.6, 0, -1.6);
      const B = new THREE.Vector3(1.6, 0, -1.6);
      const C = new THREE.Vector3(1.8, 0, 1.7);
      const D = new THREE.Vector3(-1.7, 0, 1.6);

      function mid(P, Q) { return P.clone().lerp(Q, 0.5); }
      const M = mid(A, B), N = mid(A, C), P = mid(B, C), Q = mid(C, D);

      const pyraGroup = new THREE.Group();
      const faceMat = new THREE.MeshStandardMaterial({ color: 0x237A57, transparent: true, opacity: 0.18, side: THREE.DoubleSide, roughness: 0.9 });
      function faceMesh(p1, p2, p3) {
        const geo = new THREE.BufferGeometry();
        geo.setFromPoints([p1, p2, p3]);
        geo.setIndex([0, 1, 2]);
        geo.computeVertexNormals();
        return new THREE.Mesh(geo, faceMat);
      }
      [[S, A, B], [S, B, C], [S, C, D], [S, D, A], [A, B, C], [A, C, D]].forEach(f => pyraGroup.add(faceMesh(...f)));
      scene.add(pyraGroup);

      function edgeLine(p1, p2, color = 0xe6edf3) {
        const geo = new THREE.BufferGeometry().setFromPoints([p1, p2]);
        return new THREE.Line(geo, new THREE.LineBasicMaterial({ color }));
      }
      [[S, A], [S, B], [S, C], [S, D], [A, B], [B, C], [C, D], [D, A]].forEach(e => scene.add(edgeLine(...e)));

      const markerColor = 0x9be1ff;
      ['M', 'N', 'P', 'Q'].forEach((name, i) => makeFixedMarker([M, N, P, Q][i], markerColor, 0.085));
      makeFixedMarker(S, 0xFAC775, 0.09);

      const labelDefs = [
        { name: 'S', pos: S, color: '#FAC775' },
        { name: 'A', pos: A, color: '#cbd5e1' },
        { name: 'B', pos: B, color: '#cbd5e1' },
        { name: 'C', pos: C, color: '#cbd5e1' },
        { name: 'D', pos: D, color: '#cbd5e1' },
        { name: 'M', pos: M, color: '#9be1ff' },
        { name: 'N', pos: N, color: '#9be1ff' },
        { name: 'P', pos: P, color: '#9be1ff' },
        { name: 'Q', pos: Q, color: '#9be1ff' },
      ].map(d => ({ ...d, entry: createLabel3D(d.name, d.color) }));
      window.__frameHook = () => {
        labelDefs.forEach(d => d.entry.update(d.pos));
      };

      const apexHit = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 8), new THREE.MeshBasicMaterial({ visible: false }));
      apexHit.position.copy(S); apexHit.userData = { kind: 'apex' };
      scene.add(apexHit);

      if (window.__activeCanvasClickHandler) {
        canvas.removeEventListener('click', window.__activeCanvasClickHandler);
        window.__activeCanvasClickHandler = null;
      }

      const clickables = [];
      clickables.push({ mesh: apexHit, kind: 'apex' });

      [[S, A, B], [S, B, C], [S, C, D], [S, D, A]].forEach(f => {
        const fm = faceMesh(...f);
        fm.material = new THREE.MeshBasicMaterial({ visible: false });
        fm.userData = { kind: 'face' };
        scene.add(fm);
        clickables.push({ mesh: fm, kind: 'face' });
      });
      function makeEdgeHit(p1, p2) {
        const dir = new THREE.Vector3().subVectors(p2, p1);
        const len = dir.length();
        const geo = new THREE.CylinderGeometry(0.12, 0.12, len, 6);
        const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ visible: false }));
        mesh.position.copy(p1).add(p2).multiplyScalar(0.5);
        mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
        mesh.userData = { kind: 'edge' };
        scene.add(mesh);
        return mesh;
      }
      [[A, B], [B, C], [C, D], [D, A]].forEach(e => {
        clickables.push({ mesh: makeEdgeHit(...e), kind: 'edge' });
      });

      const identifyDone = { apex: false, face: false, edge: false };
      let identifyComplete = false;

      function onCanvasClick(e) {
        if (identifyComplete) return;
        updateMouseNDC(e);
        raycaster.setFromCamera(mouseNDC, camera);
        const hits = raycaster.intersectObjects(clickables.map(c => c.mesh));
        if (hits.length === 0) return;
        const kind = hits[0].object.userData.kind;
        if (!identifyDone[kind]) {
          identifyDone[kind] = true;
          showWrongToast('');
          updatePanel();
          if (identifyDone.apex && identifyDone.face && identifyDone.edge) {
            identifyComplete = true;
            setTimeout(startPhase2, 300);
          }
        }
      }
      canvas.addEventListener('click', onCanvasClick);
      window.__activeCanvasClickHandler = onCanvasClick;

      const planeOptions = [
        { key: 'SBN', label: '(SBN)', pts: [S, B, N] },
        { key: 'SCM', label: '(SCM)', pts: [S, C, M] },
        { key: 'SBP', label: '(SBP)', pts: [S, B, P] },
        { key: 'SDQ', label: '(SDQ)', pts: [S, D, Q] },
      ];
      for (let i = planeOptions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [planeOptions[i], planeOptions[j]] = [planeOptions[j], planeOptions[i]];
      }
      let selectedKeys = [];
      let phase = 'identify';
      let intersectDone = false;

      function startPhase2() {
        phase = 'choose-planes';
        keeperSay('Nhưng khối đá này còn giữ một bí mật sâu hơn — hai mặt ẩn giao nhau ở đâu đó bên trong nó.');
        updatePanel();
      }

      function togglePlane(key) {
        if (selectedKeys.includes(key)) selectedKeys = selectedKeys.filter(k => k !== key);
        else if (selectedKeys.length < 2) selectedKeys.push(key);
        updatePanel();
      }

      function tryPlanes() {
        if (selectedKeys.length !== 2) return;
        const setSel = new Set(selectedKeys);
        const isCorrect = setSel.has('SBN') && setSel.has('SCM');
        if (isCorrect) {
          const G = segmentIntersection(B, N, C, M);
          if (G) {
            const lineGeo = new THREE.BufferGeometry().setFromPoints([S, G.point]);
            const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0xFAC775, linewidth: 3 }));
            scene.add(line);
            makeFixedMarker(G.point, 0xFAC775, 0.09);
            const gLabel = createLabel3D('G', '#FAC775');
            labelDefs.push({ name: 'G', pos: G.point, entry: gLabel });
            intersectDone = true;
            keeperSay('Giao tuyến bí mật đã hiện ra — khối đá xoay chậm, một mảnh phù điêu lộ ra từ bên trong.', [
              { label: 'Tiếp tục tới Trạm 4', onClick: finishStation3 }
            ]);
          }
        } else {
          showWrongToast('Hai mặt này... không giữ bí mật gì đặc biệt.');
        }
        updatePanel();
      }

      function finishStation3() {
        const elapsed = (Date.now() - game.stationStart) / 1000;
        game.bonuses[3] = computeSpeedBonus(elapsed, 1);
        game.relics[2] = true;
        game.badges.structures = true;
        renderSidebar();
        goToStation(4);
      }

      function updatePanel() {
        if (phase === 'identify') {
          setStationPanel(`
        <h4>Trạm 3 · Buồng trung tâm</h4>
        <p class="hint">Click đúng 3 mục trên khối đá để xác nhận vẫn nhớ thuật ngữ:</p>
        <button class="checkitem-btn ${identifyDone.apex ? 'done' : ''}"><span class="tick">${identifyDone.apex ? '✓' : ''}</span> Đỉnh của hình chóp</button>
        <button class="checkitem-btn ${identifyDone.face ? 'done' : ''}"><span class="tick">${identifyDone.face ? '✓' : ''}</span> Một mặt bên</button>
        <button class="checkitem-btn ${identifyDone.edge ? 'done' : ''}"><span class="tick">${identifyDone.edge ? '✓' : ''}</span> Một cạnh đáy</button>
        <p class="hint" style="margin-top:8px;">Click trực tiếp vào khối đá 3D ứng với từng mục.</p>
      `);
        } else {
          setStationPanel(`
        <h4>Trạm 3 · Bí mật ẩn giấu</h4>
        <p class="hint">Chọn ĐÚNG 2 trong 4 mặt phẳng khả dĩ để tìm ra giao tuyến bí mật:</p>
        ${planeOptions.map(o => `<button class="plane-choice-btn ${selectedKeys.includes(o.key) ? 'selected' : ''}" data-key="${o.key}" ${intersectDone ? 'disabled' : ''}>${o.label}</button>`).join('')}
        <button class="btn" id="btn-try-planes" style="width:100%; margin-top:8px;" ${selectedKeys.length !== 2 || intersectDone ? 'disabled' : ''}>Thử</button>
      `);
          setTimeout(() => {
            document.querySelectorAll('.plane-choice-btn').forEach(b => {
              b.onclick = () => togglePlane(b.dataset.key);
            });
            const tb = document.getElementById('btn-try-planes');
            if (tb) tb.onclick = tryPlanes;
          }, 0);
        }
      }

      keeperSay('Đây là trái tim của ngôi đền — một khối đá được các bậc tiền nhân tạo tác theo đúng quy luật hình học. Hãy đọc vị nó.');
      updatePanel();
    }

    /* ======================= TRẠM 4 — KHO TRI THỨC ======================= */

    function setupStation4() {
      camera.position.set(4.5, 3, 6);
      orbitControls.target.set(0, 1.5, 0);
      orbitControls.enabled = true;

      const S = new THREE.Vector3(0, 3, 0);
      const A = new THREE.Vector3(-1.5, 0, -1.5);
      const B = new THREE.Vector3(1.5, 0, -1.5);
      const C = new THREE.Vector3(1.5, 0, 1.5);
      const D = new THREE.Vector3(-1.5, 0, 1.5);
      const N = S.clone().lerp(B, 0.5);
      const P = S.clone().lerp(C, 0.5);
      const BASE_AREA = 9;

      function pointM(percent) { return S.clone().lerp(A, percent / 100); }

      const doorPivot = new THREE.Group();
      doorPivot.position.set(-1.1, 0, 0);
      const doorMat = new THREE.MeshStandardMaterial({ color: 0x14432F, roughness: 0.85 });
      const doorMesh = new THREE.Mesh(new THREE.BoxGeometry(2.2, 3.2, 0.25), doorMat);
      doorMesh.position.set(1.1, 1.7, 0);
      const runeMat = new THREE.LineBasicMaterial({ color: 0xFAC775, transparent: true, opacity: 0.8 });
      const runeWire = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.OctahedronGeometry(0.55)), runeMat);
      runeWire.position.set(1.1, 1.7, 0.15);
      doorPivot.add(doorMesh, runeWire);
      scene.add(doorPivot);
      const doorLight = new THREE.PointLight(0xffb763, 0.7, 8);
      doorLight.position.set(0, 1.7, 1.5);
      scene.add(doorLight);

      let phase = 'quiz';
      let doorAngle = 0;
      let runePulse = 0;
      let onFrameLabels = null;
      window.__frameHook = () => {
        runePulse += 0.03;
        runeWire.material.opacity = 0.55 + Math.sin(runePulse) * 0.2;
        if (phase === 'opening') {
          doorAngle += 0.045;
          doorPivot.rotation.y = -Math.min(doorAngle, Math.PI * 0.6);
          if (doorAngle >= Math.PI * 0.6) {
            phase = 'main';
            scene.remove(doorPivot);
            scene.remove(doorLight);
            buildPyramidScene();
          }
        }
        if (typeof onFrameLabels === 'function') onFrameLabels();
      };

      const QUIZ = {
        question: 'Trước khi mở kho: Cho hình chóp tứ giác S.ABCD, đáy ABCD là hình vuông. N, P lần lượt là trung điểm SB, SC (cố định). M là điểm trên cạnh SA. Muốn dựng xong thiết diện, mặt phẳng (MNP) cần tìm thêm giao điểm của nó với cạnh nào của hình chóp?',
        options: [
          { key: 'SD', label: 'Cạnh SD', correct: true },
          { key: 'AB', label: 'Cạnh AB', correct: false },
          { key: 'BC', label: 'Cạnh BC', correct: false },
        ],
      };

      function renderQuizPanel() {
        setStationPanel(`
      <h4>Trạm 4 · Kho tri thức (đang đóng)</h4>
      <p class="hint">Cánh cửa đá còn phong ấn. Trả lời đúng câu hỏi sau để cửa xoay mở, lộ ra khối hình bên trong:</p>
      <p class="hint" style="color:#FAC775;">${QUIZ.question}</p>
      ${QUIZ.options.map(o => `<button class="plane-choice-btn" data-key="${o.key}">${o.label}</button>`).join('')}
    `);
        document.querySelectorAll('.plane-choice-btn').forEach(btn => {
          btn.onclick = () => {
            const opt = QUIZ.options.find(o => o.key === btn.dataset.key);
            if (opt.correct) {
              phase = 'opening';
              keeperSay('Chính xác. Cánh cửa rung lên, từ từ xoay mở...');
              setStationPanel('<h4>Trạm 4 · Kho tri thức</h4><p class="hint">Cửa đang mở...</p>');
            } else {
              showWrongToast('Phù văn không phản ứng... hãy thử lại.');
            }
          };
        });
      }
      renderQuizPanel();
      keeperSay('Kho tri thức chỉ mở ra cho ai trả lời đúng câu hỏi phong ấn trên cửa.');

      function buildPyramidScene() {
        const pyraGroup = new THREE.Group();
        const faceMat = new THREE.MeshStandardMaterial({ color: 0x237A57, transparent: true, opacity: 0.18, side: THREE.DoubleSide, roughness: 0.9 });
        function faceMesh3(p1, p2, p3) {
          const geo = new THREE.BufferGeometry(); geo.setFromPoints([p1, p2, p3]); geo.setIndex([0, 1, 2]); geo.computeVertexNormals();
          return new THREE.Mesh(geo, faceMat);
        }
        [[S, A, B], [S, B, C], [S, C, D], [S, D, A], [A, B, C], [A, C, D]].forEach(f => pyraGroup.add(faceMesh3(...f)));
        scene.add(pyraGroup);
        function edgeLine3(p1, p2, color = 0xe6edf3) {
          const geo = new THREE.BufferGeometry().setFromPoints([p1, p2]);
          return new THREE.Line(geo, new THREE.LineBasicMaterial({ color }));
        }
        [[S, A], [S, B], [S, C], [S, D], [A, B], [B, C], [C, D], [D, A]].forEach(e => scene.add(edgeLine3(...e)));

        makeFixedMarker(S, 0xFAC775, 0.09);
        [A, B, C, D].forEach(v => makeFixedMarker(v, 0xcbd5e1, 0.075));
        makeFixedMarker(N, 0x9be1ff, 0.08);
        makeFixedMarker(P, 0x9be1ff, 0.08);
        flashWhite();

        const staticLabels = [
          { name: 'S', pos: S, color: '#FAC775' }, { name: 'A', pos: A, color: '#cbd5e1' },
          { name: 'B', pos: B, color: '#cbd5e1' }, { name: 'C', pos: C, color: '#cbd5e1' },
          { name: 'D', pos: D, color: '#cbd5e1' }, { name: 'N', pos: N, color: '#9be1ff' },
          { name: 'P', pos: P, color: '#9be1ff' },
        ].map(d => ({ ...d, entry: createLabel3D(d.name, d.color) }));

        let sectionGroup = null;
        const mLabel = createLabel3D('M', '#9be1ff');
        const qLabel = createLabel3D('Q', '#9be1ff');
        let currentPercent = 55;
        let currentArea = 0;

        function areaAt(percent) {
          const M = pointM(percent);
          const planeMNP = definePlaneFromPoints(M, N, P);
          if (!planeMNP) return null;
          const qResult = lineIntersectPlane(S, D, planeMNP);
          if (!qResult) return null;
          return { area: polygonArea([M, N, P, qResult.point]), Q: qResult.point, M, t: qResult.t };
        }

        const targetArea = 0.4 * BASE_AREA; // 3.6
        const TOLERANCE = 0.02;

        function rebuildSection(percent) {
          if (sectionGroup) { scene.remove(sectionGroup); sectionGroup = null; }
          const data = areaAt(percent);
          if (!data) { currentArea = null; return; }
          currentArea = data.area;
          sectionGroup = new THREE.Group();
          const secGeo = new THREE.BufferGeometry();
          const sectionPts = [data.M, N, P, data.Q];
          secGeo.setFromPoints(sectionPts);
          secGeo.setIndex([0, 1, 2, 0, 2, 3]);
          secGeo.computeVertexNormals();
          const secMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, emissive: 0xf59e0b, emissiveIntensity: 0.3, transparent: true, opacity: 0.75, side: THREE.DoubleSide });
          sectionGroup.add(new THREE.Mesh(secGeo, secMat));
          const borderGeo = new THREE.BufferGeometry().setFromPoints([...sectionPts, sectionPts[0]]);
          sectionGroup.add(new THREE.Line(borderGeo, new THREE.LineBasicMaterial({ color: 0xFAC775, linewidth: 3 })));
          [data.M, data.Q].forEach(pt => {
            const m = new THREE.Mesh(new THREE.SphereGeometry(0.085, 16, 16), new THREE.MeshStandardMaterial({ color: 0x9be1ff, emissive: 0x9be1ff, emissiveIntensity: 0.5 }));
            m.position.copy(pt);
            sectionGroup.add(m);
          });
          scene.add(sectionGroup);
          onFrameLabels = () => {
            staticLabels.forEach(d => d.entry.update(d.pos));
            mLabel.update(data.M);
            qLabel.update(data.Q);
          };
        }
        rebuildSection(currentPercent);

        let attempts = 0, solved = false;
        const historyEntries = [];

        function onConfirm() {
          if (solved) return;
          const inputEl = document.getElementById('m-percent-input');
          let v = parseFloat(inputEl.value);
          if (isNaN(v) || v < 0 || v > 98) { showWrongToast('Nhập số từ 0 đến 98.'); return; }
          attempts++;
          currentPercent = v;
          rebuildSection(v);
          const diff = Math.abs(currentArea - targetArea);
          const isCorrect = diff < TOLERANCE;
          historyEntries.unshift(`Lần ${attempts}: M ở ${v}% MA → S(MNPQ) = ${currentArea.toFixed(2)} (mục tiêu ${targetArea.toFixed(2)}, lệch ${diff.toFixed(2)})`);
          if (isCorrect) {
            solved = true;
            flashWhite();
            const elapsed = (Date.now() - game.stationStart) / 1000;
            game.bonuses[4] = computeSpeedBonus(elapsed, attempts);
            game.relics[3] = true;
            game.badges.sections = true;
            renderSidebar();
            keeperSay('Kho tri thức mở ra. Ánh sáng vàng rực tràn ngập.', [
              { label: 'Tiếp tục tới Trạm 5', onClick: () => goToStation(5) }
            ]);
          }
          updateMainPanel();
        }

        function updateMainPanel() {
          setStationPanel(`
        <h4>Trạm 4 · Kho tri thức</h4>
        <p class="hint">
          Hình chóp tứ giác S.ABCD, đáy ABCD là hình vuông cạnh 3 (diện tích đáy = 9).
          N, P lần lượt là trung điểm SB, SC (cố định). M là điểm trên cạnh SA — mặt
          phẳng (MNP) cắt cạnh SD tại Q, tạo thiết diện MNPQ.
        </p>
        <p class="hint" style="color:#FAC775;">
          <b>Yêu cầu:</b> tìm vị trí M (nhập % của MA so với SA) sao cho diện tích
          thiết diện MNPQ đúng bằng <b>40% diện tích đáy</b>.
        </p>
        <div id="station4-input-row">
          <span>% MA =</span>
          <input id="m-percent-input" type="number" min="0" max="98" step="1" value="${currentPercent}" ${solved ? 'disabled' : ''}>
          <button class="btn" id="btn-try-m" ${solved ? 'disabled' : ''}>${solved ? 'Đã mở khoá!' : 'Xác nhận'}</button>
        </div>
        <div id="feedback-line" style="color:${solved ? '#d1fae5' : '#FAC775'}">
          Diện tích hiện tại (M ở ${currentPercent}%): <b>${currentArea !== null ? currentArea.toFixed(2) : '—'}</b>
          ${solved ? ' — Chính xác! ✓' : ''}
        </div>
        <div id="history-log">${historyEntries.map(h => `<div>${h}</div>`).join('')}</div>
      `);
          const btn = document.getElementById('btn-try-m');
          if (btn) btn.onclick = onConfirm;
          const inp = document.getElementById('m-percent-input');
          if (inp) {
            inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') onConfirm(); });
            inp.addEventListener('input', (e) => {
              const v = parseFloat(e.target.value);
              if (!isNaN(v) && v >= 0 && v <= 98) {
                currentPercent = v;
                rebuildSection(v);
                const feedbackEl = document.getElementById('feedback-line');
                if (feedbackEl) {
                  feedbackEl.innerHTML = `Diện tích hiện tại (M ở ${v}%): <b>${currentArea.toFixed(2)}</b>${solved ? ' — Chính xác! ✓' : ''}`;
                }
              }
            });
          }
        }
        updateMainPanel();
        keeperSay('Kho tri thức đã lộ ra hình khối bên trong — hãy tính toán để đặt M vào đúng vị trí.');
      }
    }

    /* ======================= TRẠM 5 — KẾT THÚC ======================= */

    function setupStation5() {
      canvas.classList.add('no-interact');
      orbitControls.enabled = false;
      camera.position.set(0, 1.6, 6);

      const crystal = new THREE.Mesh(
        new THREE.OctahedronGeometry(0.5),
        new THREE.MeshStandardMaterial({ color: 0xFAC775, emissive: 0xFAC775, emissiveIntensity: 0.8 })
      );
      crystal.position.set(0, 2.2, 0);
      scene.add(crystal);
      window.__frameHook = () => { crystal.rotation.y += 0.01; };

      keeperSay('Ngươi đã đi qua bốn thử thách. Chỉ còn một mảnh ghép cuối cùng để đánh thức Tinh thể Tri thức.');

      setStationPanel(`
    <h4>Trạm 5 · Ghép mảnh cuối</h4>
    <p class="hint">Tìm 1 mảnh sáng đang nhấp nháy giữa màn hình — kéo nó vào khung viền xanh nhấp nháy.</p>
    <p class="hint">Nếu không thấy hoặc không kéo được, dùng nút dưới đây:</p>
    <button class="btn" id="btn-fallback-assemble" style="width:100%; font-size:14px; padding:10px 14px; margin-top:6px;">🧩 Đặt mảnh ghép cuối</button>
  `);
      document.getElementById('btn-fallback-assemble').onclick = () => {
        if (piece.classList.contains('snapped')) return;
        snapPieceToSlot();
        onAllRelicsAssembled();
      };

      const dropZone = document.getElementById('relic-drop-zone');
      dropZone.style.display = 'block';
      const slot = document.getElementById('final-slot');
      const piece = document.getElementById('final-piece');

      piece.classList.remove('snapped');
      slot.classList.remove('near');
      piece.style.boxShadow = '';
      piece.style.width = '';
      piece.style.height = '';

      const wrap = document.getElementById('app-body');
      const sw = wrap.clientWidth, sh = wrap.clientHeight;
      slot.style.left = (sw * 0.50 - 45) + 'px';
      slot.style.top = (sh * 0.50 - 45) + 'px';
      slot.innerHTML = FINAL_SLOT_ICON;
      piece.style.left = (sw * 0.74) + 'px';
      piece.style.top = (sh * 0.58) + 'px';
      piece.innerHTML = FINAL_PIECE_ICON;

      let dragging = false, offX = 0, offY = 0, selected = false;

      function distToSlotCenter() {
        const pr = piece.getBoundingClientRect(), sr = slot.getBoundingClientRect();
        const dx = (pr.left + pr.width / 2) - (sr.left + sr.width / 2);
        const dy = (pr.top + pr.height / 2) - (sr.top + sr.height / 2);
        return Math.hypot(dx, dy);
      }

      function snapPieceToSlot() {
        const sr = slot.getBoundingClientRect();
        const wrapR = wrap.getBoundingClientRect();
        piece.style.left = (sr.left - wrapR.left) + 'px';
        piece.style.top = (sr.top - wrapR.top) + 'px';
        piece.style.width = sr.width + 'px';
        piece.style.height = sr.height + 'px';
        piece.classList.add('snapped');
        slot.classList.remove('near');
      }

      function trySnap() {
        if (distToSlotCenter() < 90) {
          snapPieceToSlot();
          onAllRelicsAssembled();
          return true;
        }
        return false;
      }

      function startDrag(e) {
        if (piece.classList.contains('snapped')) return;
        dragging = true;
        const rect = piece.getBoundingClientRect();
        const cx = e.clientX ?? e.touches[0].clientX, cy = e.clientY ?? e.touches[0].clientY;
        offX = cx - rect.left; offY = cy - rect.top;
      }
      function moveDrag(e) {
        if (!dragging) return;
        const cx = e.clientX ?? e.touches[0].clientX, cy = e.clientY ?? e.touches[0].clientY;
        const wrapR = wrap.getBoundingClientRect();
        piece.style.left = (cx - wrapR.left - offX) + 'px';
        piece.style.top = (cy - wrapR.top - offY) + 'px';
        slot.classList.toggle('near', distToSlotCenter() < 90);
      }
      function endDragPiece() {
        if (!dragging) return;
        dragging = false;
        if (!trySnap()) {
          slot.classList.remove('near');
          showWrongToast('Chưa đúng vị trí — kéo mảnh sáng vào giữa khung viền xanh.');
        }
      }
      function toggleSelect() {
        if (piece.classList.contains('snapped')) return;
        selected = !selected;
        piece.style.boxShadow = selected
          ? '0 0 34px rgba(68,155,116,0.95), 0 0 10px rgba(255,255,255,0.9)'
          : '0 0 24px rgba(255,220,140,0.9)';
      }
      function placeBySelect() {
        if (!selected || piece.classList.contains('snapped')) return;
        snapPieceToSlot();
        onAllRelicsAssembled();
      }

      if (window.__station5Cleanup) window.__station5Cleanup();
      piece.addEventListener('pointerdown', startDrag);
      window.addEventListener('pointermove', moveDrag);
      window.addEventListener('pointerup', endDragPiece);
      piece.addEventListener('click', toggleSelect);
      slot.addEventListener('click', placeBySelect);
      window.__station5Cleanup = () => {
        piece.removeEventListener('pointerdown', startDrag);
        window.removeEventListener('pointermove', moveDrag);
        window.removeEventListener('pointerup', endDragPiece);
        piece.removeEventListener('click', toggleSelect);
        slot.removeEventListener('click', placeBySelect);
      };

      function onAllRelicsAssembled() {
        game.relics[4] = true;
        renderSidebar();
        flashWhite(750);
        setTimeout(showEnding, 500);
      }

      function showEnding() {
        dropZone.style.display = 'none';
        const score = currentScore();
        const rank = getRankInfo(score);
        const totalTime = Math.round((Date.now() - game.runStart) / 1000);
        document.getElementById('final-score').textContent = score;
        document.getElementById('final-rank-line').textContent = 'Rank: ' + rank.name + ' ' + '⭐'.repeat(rank.stars);
        document.getElementById('final-time-line').textContent = 'Thời gian hoàn thành: ' + Math.floor(totalTime / 60) + ' phút ' + (totalTime % 60) + ' giây';
        const farewells = {
          'Keeper of Geometry': 'Ngươi đã thực sự thấu hiểu quy luật của không gian. Tinh thể Tri thức nay thuộc về ngươi.',
          'Đại khảo cổ gia': 'Ngươi đã đi rất xa trên con đường thấu hiểu không gian. Đền thờ ghi nhận điều đó.',
          'Người giải mã': 'Ngươi đã giải mã được những bí mật quan trọng nhất. Hãy tiếp tục hành trình.',
          '🏺 Nhà khảo cổ tập sự': 'Bước chân đầu tiên luôn là bước quan trọng nhất. Đền thờ sẽ còn chờ ngươi trở lại.'
        };
        document.querySelector('#ending-keeper').textContent = farewells[rank.name] || '';
        document.getElementById('ending-overlay').style.display = 'flex';
        loadLeaderboard();
      }

      document.getElementById('btn-save-score').onclick = async () => {
        const nameEl = document.getElementById('player-name');
        const name = (nameEl.value || 'Nhà khảo cổ ẩn danh').trim().slice(0, 24);
        const score = currentScore();
        const rank = getRankInfo(score);
        try {
          const list = await saveScoreToStorage({ name, score, rank: rank.name, time: Date.now() });
          renderLeaderboard(list, { name, score });
        } catch (e) {
          showWrongToast('Không lưu được điểm (lỗi lưu trữ) — nhưng điểm của ngươi vẫn hiển thị ở trên.');
        }
      };

      async function loadLeaderboard() {
        try {
          const list = await loadScoreFromStorage();
          renderLeaderboard(list, null);
        } catch (e) {
          document.getElementById('leaderboard-list').innerHTML = '<div>Chưa có dữ liệu bảng xếp hạng.</div>';
        }
      }
      function renderLeaderboard(list, me) {
        const el = document.getElementById('leaderboard-list');
        if (!list || !list.length) { el.innerHTML = '<div>Chưa có ai trên bảng xếp hạng — hãy là người đầu tiên!</div>'; return; }
        el.innerHTML = list.map((e, i) => `<div class="${me && e.name === me.name && e.score === me.score ? 'me' : ''}"><span>#${i + 1} ${e.name}</span><span>${e.score}</span></div>`).join('');
      }

      document.getElementById('btn-replay').onclick = () => {
        game.station = 0;
        game.bonuses = [0, 0, 0, 0, 0];
        game.relics = [false, false, false, false, false];
        game.badges = { planes: false, intersections: false, structures: false, sections: false };
        game.runStart = Date.now();
        document.getElementById('player-name').value = '';
        const piece = document.getElementById('final-piece');
        const slot = document.getElementById('final-slot');
        if (piece) { piece.classList.remove('snapped'); piece.style.boxShadow = ''; }
        if (slot) slot.classList.remove('near');
        goToStation(0);
      };
    }

    /* ---------------------- KHỞI ĐỘNG ---------------------- */
    goToStation(0);

  </script>
</body>

</html>
