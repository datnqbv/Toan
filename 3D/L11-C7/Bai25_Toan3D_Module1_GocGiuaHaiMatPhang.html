  <main class="app-shell">

  <script>
  (()=>{'use strict';
    const LMS=()=>window.AiducationLMS||{ready(){},progress(){},event(){},state(){},complete(){},resize(){}};
    const canvas=document.getElementById('three-canvas'),wrap=document.getElementById('canvas-wrap'),stepBody=document.getElementById('step-body');
    const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setClearColor(0x0a1628);renderer.outputEncoding=THREE.sRGBEncoding;
    const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(46,1,.1,100),controls=new THREE.OrbitControls(camera,canvas);controls.enableDamping=true;controls.dampingFactor=.08;controls.minDistance=5;controls.maxDistance=18;
    scene.add(new THREE.HemisphereLight(0xddeeff,0x172235,1.15));const keyLight=new THREE.DirectionalLight(0xffffff,1.05);keyLight.position.set(5,8,7);scene.add(keyLight);
    const COLORS={p:0x3b82f6,q:0xa78bfa,m:0xf59e0b,n:0xef4444,result:0xFAC775,point:0xFAC775,axis:0xe6edf3,grid:0x35506e,earth:0x2D8B6F,meridian:0x34d399,accent:0xfb923c};
    let currentStep=1,unlocked=1,theta=60,oY=0,skewM=0,skewN=0,root=null,earthMode=false,dragMode=null,dragStartX=0,dragStartTheta=60,strikes=0,q1Done=false,q1Success=false,q2Done=false,q2Wrong=false,earthQ1=false,earthQ2=false,completed=false;
    let labels=[],objects={},wrongChoice=null,correctChoice=null;
    const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z),rad=d=>d*Math.PI/180,fmt=n=>n.toFixed(2).replace('.',',')+'°';
    function dispose(obj){if(!obj)return;obj.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.dispose())}});if(obj.parent)obj.parent.remove(obj)}
    function clearScene(){dispose(root);root=new THREE.Group();scene.add(root);labels.forEach(x=>x.el.remove());labels=[];objects={}}
    function addLabel(text,pos,cls=''){const el=document.createElement('div');el.className='label '+cls;el.textContent=text;document.getElementById('label-layer').appendChild(el);const item={el,pos};labels.push(item);return item}
    function line(a,b,color,width=1,group=root){const g=new THREE.BufferGeometry().setFromPoints([a,b]),m=new THREE.LineBasicMaterial({color,linewidth:width,transparent:true,opacity:.96});const l=new THREE.Line(g,m);group.add(l);return l}
    function polyline(points,color,group=root){const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(points),new THREE.LineBasicMaterial({color,transparent:true,opacity:.98}));group.add(l);return l}
    function dot(pos,color=COLORS.point,r=.09,group=root){const m=new THREE.Mesh(new THREE.SphereGeometry(r,18,12),new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.25}));m.position.copy(pos);group.add(m);return m}
    function makePage(color,name){const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute([0,-2.4,0,3.6,-2.4,0,3.6,2.4,0,0,-2.4,0,3.6,2.4,0,0,2.4,0],3));geo.computeVertexNormals();const mesh=new THREE.Mesh(geo,new THREE.MeshPhongMaterial({color,transparent:true,opacity:.26,side:THREE.DoubleSide,depthWrite:false,shininess:35}));mesh.userData={kind:'page',name};return mesh}
    function setLine(lineObj,a,b){lineObj.geometry.setFromPoints([a,b]);lineObj.geometry.attributes.position.needsUpdate=true}
    function makeArc(a,b,r=.85){const ang=Math.acos(Math.max(-1,Math.min(1,a.clone().normalize().dot(b.clone().normalize())))),cross=a.clone().cross(b),sign=cross.y<0?-1:1,pts=[];for(let i=0;i<=36;i++){const t=ang*i/36*sign;pts.push(a.clone().normalize().applyAxisAngle(V(0,1,0),t).multiplyScalar(r))}return polyline(pts,COLORS.result)}
    function buildFoldScene(){clearScene();earthMode=false;const p=makePage(COLORS.p,'P');root.add(p);const qPivot=new THREE.Group(),q=makePage(COLORS.q,'Q');qPivot.add(q);root.add(qPivot);objects.q=q;objects.qPivot=qPivot;line(V(0,-2.7,0),V(0,2.7,0),COLORS.axis);objects.o=dot(V(0,oY,0),COLORS.point,.11);objects.m=line(V(0,oY,0),V(2.0,oY,0),COLORS.m);objects.n=line(V(0,oY,0),V(2, oY,0),COLORS.n);objects.arcGroup=new THREE.Group();root.add(objects.arcGroup);addLabel('(P)',V(2.7,-1.85,.02));objects.qLabel=addLabel('(Q)',V(2.6,-1.75,0));addLabel('Δ',V(0,2.8,0));objects.oLabel=addLabel(currentStep===2?"O′":'O',V(0,oY+.15,0));objects.mLabel=addLabel(currentStep===3?"m″":'m',V(2.05,oY+.05,0));objects.nLabel=addLabel(currentStep===3?"n″":'n',V(2.05,oY+.05,0));updateFoldGeometry()}
    function updateFoldGeometry(){if(!objects.qPivot)return;objects.qPivot.rotation.y=-rad(theta);const baseM=currentStep===3?V(Math.cos(rad(skewM)),Math.sin(rad(skewM)),0):V(1,0,0),baseN=currentStep===3?V(Math.cos(rad(skewN))*Math.cos(rad(theta)),Math.sin(rad(skewN)),-Math.cos(rad(skewN))*Math.sin(rad(theta))):V(Math.cos(rad(theta)),0,-Math.sin(rad(theta)));const O=V(0,oY,0),endM=O.clone().addScaledVector(baseM,2),endN=O.clone().addScaledVector(baseN,2);setLine(objects.m,O,endM);setLine(objects.n,O,endN);objects.o.position.copy(O);objects.oLabel.pos.copy(O).add(V(0,.15,0));objects.mLabel.pos.copy(endM);objects.nLabel.pos.copy(endN);objects.qLabel.pos.set(2.6*Math.cos(rad(theta)),-1.75,-2.6*Math.sin(rad(theta)));dispose(objects.arc);const oldRoot=root;objects.arc=makeArc(baseM,baseN,.8);objects.arc.position.copy(O);objects.angle=Math.acos(Math.max(-1,Math.min(1,baseM.dot(baseN))))*180/Math.PI;document.getElementById('angle-readout').textContent=currentStep===3?`góc đo = ${fmt(objects.angle)}`:`θ = ${fmt(theta)}`;const out=document.querySelector('[data-out="theta"]');if(out)out.textContent=fmt(theta);const oOut=document.querySelector('[data-out="oy"]');if(oOut)oOut.textContent=oY.toFixed(1);const mOut=document.querySelector('[data-out="sm"]');if(mOut)mOut.textContent=skewM+'°';const nOut=document.querySelector('[data-out="sn"]');if(nOut)nOut.textContent=skewN+'°';const measured=document.getElementById('measured-angle');if(measured)measured.textContent=fmt(objects.angle)}
    function meridian(r,deg,color){const pts=[],a=rad(deg);for(let i=0;i<=96;i++){const t=-Math.PI/2+Math.PI*i/96;pts.push(V(r*Math.cos(t)*Math.cos(a),r*Math.sin(t),r*Math.cos(t)*Math.sin(a)))}return polyline(pts,color)}
    function circleXZ(r,color){const pts=[];for(let i=0;i<=96;i++){const t=Math.PI*2*i/96;pts.push(V(r*Math.cos(t),0,r*Math.sin(t)))}return polyline(pts,color)}
    function meridianPlane(deg,color){const g=new THREE.CircleGeometry(4.02,64),m=new THREE.MeshBasicMaterial({color,transparent:true,opacity:.1,side:THREE.DoubleSide,depthWrite:false}),mesh=new THREE.Mesh(g,m);mesh.rotation.y=-rad(deg);root.add(mesh);return mesh}
    function buildEarthScene(){clearScene();earthMode=true;const globe=new THREE.Mesh(new THREE.SphereGeometry(4,64,40),new THREE.MeshPhongMaterial({color:COLORS.earth,transparent:true,opacity:.35,side:THREE.DoubleSide,depthWrite:false,shininess:28}));root.add(globe);circleXZ(4,COLORS.result);meridian(4,0,COLORS.meridian);meridian(4,111.92,COLORS.accent);meridianPlane(0,COLORS.meridian);meridianPlane(111.92,COLORS.accent);line(V(0,-4.8,0),V(0,4.8,0),COLORS.axis);const d0=V(1,0,0),d1=V(Math.cos(rad(111.92)),0,Math.sin(rad(111.92)));line(V(),d0.clone().multiplyScalar(2.1),COLORS.meridian);line(V(),d1.clone().multiplyScalar(2.1),COLORS.accent);makeArc(d0,d1,1.25);dot(V(),COLORS.result,.12);const p=d1.clone().multiplyScalar(4.05);dot(p,COLORS.accent,.13);addLabel('Bắc',V(0,4.55,0));addLabel('Nam',V(0,-4.35,0));addLabel('O',V(0,.18,0));addLabel('P · Trường Sa Lớn',p.clone().multiplyScalar(1.04));addLabel('111°55′12″ ≈ 111,92°',d0.clone().add(d1).normalize().multiplyScalar(1.6),'result');document.getElementById('angle-readout').textContent='λ = 111,92° Đông'}
    function setCamera(top=false){if(earthMode){camera.position.set(top?0:8,top?11:6,top?.01:8);controls.target.set(0,0,0)}else{camera.position.set(top?0:7.2,top?10:4.4,top?.01:8);controls.target.set(0,0,0)}camera.up.set(0,1,0);controls.update()}
    function notebook(text){return`<div class="notebook"><b><i class="ti ti-notebook"></i> Sổ tay kiến thức</b><br>${text}</div>`}
    function navButtons(nextLabel='Tiếp tục'){return`<div class="btn-row">${currentStep>1?'<button class="btn btn-secondary" onclick="lesson.prevStep()">← Quay lại</button>':''}<button class="btn btn-primary" onclick="lesson.completeStep()">${nextLabel} →</button></div>`}
    function renderStep(){document.getElementById('header-progress').textContent=`BƯỚC ${currentStep}/4`;document.querySelectorAll('.step-tab').forEach(b=>{const n=+b.dataset.step;b.classList.toggle('active',n===currentStep);b.classList.toggle('done',n<unlocked);b.disabled=n>unlocked});if(currentStep===1){stepBody.innerHTML=`<p class="eyebrow">Bước 1 · Hình thành định nghĩa</p><h2 class="step-title">Gấp giấy 3D</h2><div class="athena"><b>✦ Athena</b>Đây là hai mặt phẳng (P), (Q) cắt nhau theo giao tuyến Δ. Hãy kéo mặt (Q) hoặc thanh trượt để mở/đóng góc.</div><div class="control"><label>Góc mở θ <output data-out="theta">${fmt(theta)}</output></label><input aria-label="Góc mở theta" type="range" min="0" max="180" step="1" value="${theta}" oninput="lesson.setTheta(this.value)"></div><div class="card"><h3>Quan sát hai tia m và n</h3><p class="body-small">Cả hai cùng vuông góc với Δ tại O. Số đo góc giữa chúng luôn bằng góc mở giữa hai mặt.</p><div class="formula">∠(m,n) = θ = <span id="measured-angle">${fmt(theta)}</span></div></div>${notebook('Góc giữa hai mặt phẳng cắt nhau được dựng từ hai đường cùng vuông góc giao tuyến tại cùng một điểm. Nếu (P), (Q) song song hoặc trùng nhau thì góc giữa chúng bằng 0°.')} ${navButtons('Tôi đã quan sát')}`;document.getElementById('scene-chip').textContent='Gấp giấy 3D · kéo mặt (Q)'}
      if(currentStep===2){stepBody.innerHTML=`<p class="eyebrow">Bước 2 · Tính bất biến</p><h2 class="step-title">Kéo điểm O dọc theo Δ</h2><div class="athena"><b>✦ Athena</b>Nếu chọn điểm O′ khác trên Δ để dựng m′, n′ thì góc có đổi không? Hãy kéo điểm vàng trên giao tuyến.</div><div class="control"><label>Vị trí O′ trên Δ <output data-out="oy">${oY.toFixed(1)}</output></label><input aria-label="Vị trí điểm O" type="range" min="-1.8" max="1.8" step="0.1" value="${oY}" oninput="lesson.setOY(this.value)"></div><div class="feedback info">Góc đang đo: <b class="formula" style="padding:3px 7px">${fmt(theta)}</b> — chỉ vị trí thay đổi, hướng của hai tia không đổi.</div>${notebook('Góc giữa hai mặt phẳng không phụ thuộc vị trí điểm O trên Δ, miễn hai đường vẫn cùng vuông góc Δ tại điểm đó.')} ${navButtons('Tôi đã kiểm chứng')}`;document.getElementById('scene-chip').textContent="Kéo O′ dọc giao tuyến Δ"}
      if(currentStep===3)renderStep3();
      if(currentStep===4)renderStep4();
      updateFoldGeometry();reportHeight();emitState('xem bước '+currentStep)}
    function renderStep3(){const opts=window._opts||(window._opts=[{id:'A',text:'Cùng nằm trong một mặt phẳng',ok:false},{id:'B',text:'Cùng vuông góc với Δ và cùng xuất phát từ một điểm trên Δ',ok:true},{id:'C',text:'Chỉ cần vuông góc Δ, điểm xuất phát không quan trọng',ok:false}].sort(()=>Math.random()-.5));stepBody.innerHTML=`<p class="eyebrow">Bước 3 · Nhận diện sai lầm</p><h2 class="step-title">Góc phẳng nhị diện</h2><div class="athena"><b>✦ Athena</b>Nghiêng m″ và n″ khỏi hướng vuông góc Δ. Góc đo được có còn là góc nhị diện thật ${fmt(theta)} không?</div><div class="control"><label>Độ xiên m″ <output data-out="sm">${skewM}°</output></label><input type="range" min="0" max="30" step="1" value="${skewM}" oninput="lesson.setSkew('m',this.value)"></div><div class="control"><label>Độ xiên n″ <output data-out="sn">${skewN}°</output></label><input type="range" min="0" max="30" step="1" value="${skewN}" oninput="lesson.setSkew('n',this.value)"></div><div class="formula">Góc đo = <span id="measured-angle">${fmt(Number.isFinite(objects.angle)?objects.angle:theta)}</span> · góc thật = ${fmt(theta)}</div><div class="card" id="quiz-card"><h3>Điều kiện dựng đúng là gì?</h3>${opts.map((o,i)=>`<button class="choice ${q1Done&&o.ok?'correct':wrongChoice===i?'wrong':''}" ${q1Done?'disabled':''} onclick="lesson.answerCondition(${i})">${String.fromCharCode(65+i)}) ${o.text}</button>`).join('')}<div id="quiz-feedback">${q1Done?(q1Success?'<div class="feedback good">Chính xác: hai tia phải cùng vuông góc Δ và có chung gốc trên Δ.</div>':'<div class="feedback bad">Đã hết 3 lượt. Đáp án đúng được đánh dấu xanh: hai tia bắt buộc chung một điểm trên Δ.</div>'):strikes===2?'<div class="feedback warn">Gợi ý: kéo hai độ xiên về 0°. Ngoài vuông góc, hai tia còn cần chung điều gì?</div>':''}</div></div><div class="card"><h3>Nếu m tại O, n tại O′ khác O?</h3><button class="choice ${q2Wrong&&!q2Done?'wrong':''}" ${q2Done?'disabled':''} onclick="lesson.answerCommon(false)">Vẫn là góc nhị diện vì cả hai đều vuông góc Δ</button><button class="choice ${q2Done?'correct':''}" ${q2Done?'disabled':''} onclick="lesson.answerCommon(true)">Không phải góc nhị diện trực tiếp vì hai tia không chung điểm</button>${q2Done?'<div class="feedback good">Đúng. Hai đường chéo nhau phải quy về hai đường cắt nhau theo Bài 22; góc phẳng nhị diện yêu cầu chung gốc trên Δ.</div>':q2Wrong?'<div class="feedback bad">Chưa đúng. Hai tia chưa có một điểm xuất phát chung nên chưa tạo thành góc phẳng nhị diện trực tiếp.</div>':''}</div>${notebook('Góc nhị diện: 0°–180°. Góc giữa hai mặt phẳng: 0°–90°. Nếu góc phẳng nhị diện α > 90° thì góc giữa hai mặt phẳng bằng 180° − α.')}<div class="btn-row"><button class="btn btn-secondary" onclick="lesson.prevStep()">← Quay lại</button><button class="btn btn-primary" ${!(q1Done&&q2Done)?'disabled':''} onclick="lesson.completeStep()">Ứng dụng Trái Đất →</button></div>`;document.getElementById('scene-chip').textContent='Bẫy độ xiên · đưa về 0° để đúng'}
    function renderStep4(){stepBody.innerHTML=`<p class="eyebrow">Bước 4 · Ứng dụng</p><h2 class="step-title">Kinh độ Trường Sa Lớn</h2><div class="athena"><b>✦ Athena</b>Hai mặt phẳng kinh tuyến cùng đi qua Greenwich và Đảo Trường Sa Lớn. Hãy xoay địa cầu và nhìn hai tia tại tâm O.</div><div class="card"><h3>Giao tuyến của hai mặt phẳng kinh tuyến là gì?</h3><button class="choice ${earthQ1==='wrong'?'wrong':''}" ${earthQ1==='right'?'disabled':''} onclick="lesson.answerEarth(1,false)">Đường xích đạo</button><button class="choice ${earthQ1==='right'?'correct':''}" ${earthQ1==='right'?'disabled':''} onclick="lesson.answerEarth(1,true)">Trục Bắc–Nam của Trái Đất</button>${earthQ1==='wrong'?'<div class="feedback bad">Chưa đúng. Gợi ý: mọi kinh tuyến đều đi qua hai điểm cố định nào?</div>':earthQ1==='right'?'<div class="feedback good">Chính xác. Mọi mặt phẳng kinh tuyến đều chứa trục Bắc–Nam.</div>':''}</div><div class="card"><h3>Góc nhị diện này biểu diễn đại lượng nào?</h3><button class="choice ${earthQ2==='right'?'correct':''}" ${earthQ2==='right'?'disabled':''} onclick="lesson.answerEarth(2,true)">Kinh độ</button><button class="choice ${earthQ2==='wrong'?'wrong':''}" ${earthQ2==='right'?'disabled':''} onclick="lesson.answerEarth(2,false)">Vĩ độ</button>${earthQ2==='wrong'?'<div class="feedback bad">Chưa đúng. Hãy so sánh mặt kinh tuyến qua P với mặt kinh tuyến gốc.</div>':earthQ2==='right'?'<div class="feedback good">Đúng. 111°55′12″E ≈ 111,92° chính là góc nhị diện với mặt kinh tuyến gốc.</div>':''}</div><div class="card"><h3>Liên hệ mở rộng</h3><p class="body-small">Vĩ độ 8°38′41″N có phải góc nhị diện giống kinh độ không?</p><details><summary>Gợi mở</summary><p class="body-small">Không. Vĩ độ là góc giữa đường thẳng và mặt phẳng, liên hệ kiến thức Bài 24.</p></details></div>${notebook('<b>Tổng hợp:</b><ol class="summary-list"><li>Hai đường cùng ⟂ Δ tại một điểm.</li><li>Góc không phụ thuộc vị trí O.</li><li>Nhị diện 0°–180°; góc hai mặt phẳng 0°–90°.</li><li>Kinh độ là một góc nhị diện.</li></ol>')}<div class="btn-row"><button class="btn btn-secondary" onclick="lesson.prevStep()">← Quay lại</button><button class="btn btn-primary" ${!(earthQ1==='right'&&earthQ2==='right')?'disabled':''} onclick="lesson.finish()">Hoàn thành Module</button></div>`;document.getElementById('scene-chip').textContent='Đảo Trường Sa Lớn · 111°55′12″E'}
    function goStep(n){if(n<1||n>unlocked)return;currentStep=n;if(n===4){buildEarthScene();setCamera(false)}else{buildFoldScene();setCamera(false)}renderStep()}
    function completeStep(){unlocked=Math.max(unlocked,Math.min(4,currentStep+1));LMS().progress({done:currentStep,total:4});LMS().event('completed-section',{id:['fold-definition','invariance','dihedral-traps','earth-application'][currentStep-1]});if(currentStep<4)goStep(currentStep+1)}
    function emitState(action){LMS().state({currentStep,unlocked,theta,oY,skewM,skewN,strikes,q1Done,q1Success,q2Done,q2Wrong,earthQ1,earthQ2,lastAction:action})}
    function finish(){if(completed)return;completed=true;LMS().progress({done:4,total:4});const items=[{id:'condition',correct:q1Success},{id:'common-origin',correct:q2Done},{id:'earth-axis',correct:earthQ1==='right'},{id:'earth-longitude',correct:earthQ2==='right'}],score=items.filter(x=>x.correct).length;LMS().complete({summary:'Đã hoàn thành Module 1: dựng góc giữa hai mặt phẳng, kiểm chứng tính bất biến, sửa sai điều kiện và vận dụng kinh độ.',score,max:4,items});stepBody.insertAdjacentHTML('beforeend','<div class="feedback good"><b>Hoàn thành!</b> Bạn đã nối được trực giác gấp giấy với định nghĩa và ứng dụng kinh độ.</div>');reportHeight()}
    window.lesson={setTheta(v){theta=+v;updateFoldGeometry();emitState('đổi góc mở')},setOY(v){oY=+v;updateFoldGeometry();emitState('kéo O')},setSkew(which,v){if(which==='m')skewM=+v;else skewN=+v;updateFoldGeometry();emitState('đổi độ xiên')},completeStep,prevStep(){goStep(currentStep-1)},answerCondition(i){if(q1Done)return;const opt=window._opts[i];wrongChoice=null;if(opt.ok){q1Done=true;q1Success=true;correctChoice=i;LMS().event('answered',{id:'condition',correct:true,strikes});renderStep3()}else{strikes++;wrongChoice=i;LMS().event('answered',{id:'condition',correct:false,strike:strikes});if(strikes>=3)q1Done=true;renderStep3();if(strikes===1){const card=document.getElementById('quiz-card');card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');setTimeout(()=>card.classList.remove('shake'),320)}}updateFoldGeometry()},answerCommon(ok){q2Wrong=!ok;if(ok)q2Done=true;LMS().event('answered',{id:'common-origin',correct:ok});renderStep3();updateFoldGeometry()},answerEarth(q,ok){if(q===1)earthQ1=ok?'right':'wrong';else earthQ2=ok?'right':'wrong';LMS().event('answered',{id:'earth-'+q,correct:ok});renderStep4()},finish};
    document.querySelectorAll('.step-tab').forEach(b=>b.onclick=()=>goStep(+b.dataset.step));document.getElementById('btn-reset').onclick=()=>setCamera(false);document.getElementById('btn-top').onclick=()=>setCamera(true);
    const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();function pointerRay(e){const r=canvas.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);raycaster.setFromCamera(pointer,camera)}
    canvas.addEventListener('pointerdown',e=>{if(earthMode)return;pointerRay(e);if(currentStep===2&&raycaster.intersectObject(objects.o,false).length){dragMode='o';controls.enabled=false;canvas.setPointerCapture(e.pointerId);return}if(currentStep===1&&raycaster.intersectObject(objects.q,false).length){dragMode='q';dragStartX=e.clientX;dragStartTheta=theta;controls.enabled=false;canvas.setPointerCapture(e.pointerId)}});
    canvas.addEventListener('pointermove',e=>{if(!dragMode)return;if(dragMode==='q'){theta=Math.max(0,Math.min(180,dragStartTheta+(e.clientX-dragStartX)*.45));const slider=stepBody.querySelector('input[aria-label="Góc mở theta"]');if(slider)slider.value=theta;updateFoldGeometry()}else{pointerRay(e);const a=V(0,-1.8,0),b=V(0,1.8,0),onRay=V(),onSeg=V();raycaster.ray.distanceSqToSegment(a,b,onRay,onSeg);oY=onSeg.y;const slider=stepBody.querySelector('input[aria-label="Vị trí điểm O"]');if(slider)slider.value=oY;updateFoldGeometry()}});
    function endDrag(){if(dragMode)emitState('kéo trực tiếp 3D');dragMode=null;controls.enabled=true}canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);
    function resize(){const w=wrap.clientWidth,h=wrap.clientHeight;camera.aspect=w/Math.max(1,h);camera.updateProjectionMatrix();renderer.setSize(w,h,false)}new ResizeObserver(resize).observe(wrap);window.addEventListener('resize',resize);
    function updateLabels(){labels.forEach(l=>{const p=l.pos.clone().project(camera),show=p.z>-1&&p.z<1;l.el.style.display=show?'block':'none';if(show)l.el.style.transform=`translate(${(p.x*.5+.5)*wrap.clientWidth}px,${(-p.y*.5+.5)*wrap.clientHeight}px) translate(-50%,-115%)`})}
    function animate(){requestAnimationFrame(animate);controls.update();updateLabels();renderer.render(scene,camera)}
    function reportHeight(){LMS().resize({height:document.documentElement.scrollHeight})}new ResizeObserver(()=>{clearTimeout(window._rh);window._rh=setTimeout(reportHeight,100)}).observe(document.body);
    buildFoldScene();setCamera(false);renderStep();resize();animate();LMS().ready({id:'bai25-module1-goc-hai-mat-phang'});emitState('mở module');
    if(window.AiducationLMS)window.AiducationLMS.onResume=s=>{if(!s)return;theta=Number.isFinite(s.theta)?s.theta:theta;oY=Number.isFinite(s.oY)?s.oY:oY;skewM=s.skewM||0;skewN=s.skewN||0;unlocked=Math.max(1,Math.min(4,s.unlocked||1));strikes=s.strikes||0;q1Done=!!s.q1Done;q1Success=!!s.q1Success;q2Done=!!s.q2Done;q2Wrong=!!s.q2Wrong;earthQ1=s.earthQ1||false;earthQ2=s.earthQ2||false;goStep(Math.min(unlocked,s.currentStep||1))};
  })();
  </script>
