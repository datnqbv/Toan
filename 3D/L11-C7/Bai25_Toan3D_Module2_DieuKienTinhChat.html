  <main class="app-body">

    <aside class="sidebar"><nav class="tabs"><button class="tab active" data-step="1">Bước 1</button><button class="tab" data-step="2">Bước 2</button><button class="tab" data-step="3">Bước 3</button><button class="tab" data-step="4">Bước 4</button></nav><div class="content" id="content"></div></aside>

  <script>
  (()=>{'use strict';
    const LMS=()=>window.AiducationLMS||{ready(){},progress(){},event(){},state(){},complete(){},resize(){}};
    const canvas=document.getElementById('three-canvas'),wrap=document.getElementById('canvas-wrap'),content=document.getElementById('content'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setClearColor(0x0a1628);renderer.outputEncoding=THREE.sRGBEncoding;
    const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(46,1,.1,100),controls=new THREE.OrbitControls(camera,canvas);controls.enableDamping=true;controls.minDistance=5;controls.maxDistance=18;scene.add(new THREE.HemisphereLight(0xe8f3ff,0x172235,1.2));const light=new THREE.DirectionalLight(0xffffff,1);light.position.set(5,8,6);scene.add(light);
    const C={floor:0x64748b,glass:0x3b82f6,glass2:0xa78bfa,vertical:0x34d399,horizontal:0xfb923c,diagonal:0xef4444,result:0xFAC775,edge:0xe6edf3};
    let step=1,unlocked=1,root=null,labels=[],pickables=[],selected=null,s1Strikes=0,s1Done=false,s1Success=false,s2Observed=false,s2Measured=false,s2Strikes=0,s2Done=false,s2Success=false,s3Done=false,s4Measured=false,s4Strikes=0,s4Done=false,s4Success=false,comparisonShown=false,finished=false,wrongKey=null;
    const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z),fmt=n=>n.toFixed(2).replace('.',',')+'°';
    function dispose(o){if(!o)return;o.traverse(x=>{if(x.geometry)x.geometry.dispose();if(x.material)(Array.isArray(x.material)?x.material:[x.material]).forEach(m=>m.dispose())});if(o.parent)o.parent.remove(o)}
    function clear(){dispose(root);root=new THREE.Group();scene.add(root);labels.forEach(x=>x.el.remove());labels=[];pickables=[];selected=null}
    function label(text,pos,cls=''){const el=document.createElement('div');el.className='label '+cls;el.textContent=text;document.getElementById('label-layer').appendChild(el);labels.push({el,pos});return el}
    function line(a,b,color,key,r=.055){const dir=b.clone().sub(a),mesh=new THREE.Mesh(new THREE.CylinderGeometry(r,r,dir.length(),12),new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.12}));mesh.position.copy(a).add(b).multiplyScalar(.5);mesh.quaternion.setFromUnitVectors(V(0,1,0),dir.clone().normalize());mesh.userData={key,baseColor:color};root.add(mesh);if(key)pickables.push(mesh);return mesh}
    function plane(w,h,color,opacity=.2){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshPhongMaterial({color,transparent:true,opacity,side:THREE.DoubleSide,depthWrite:false,shininess:50}));root.add(m);return m}
    function floor(){const f=new THREE.Mesh(new THREE.PlaneGeometry(8,7,8,7),new THREE.MeshPhongMaterial({color:C.floor,transparent:true,opacity:.32,side:THREE.DoubleSide,depthWrite:false}));f.rotation.x=-Math.PI/2;root.add(f);const grid=new THREE.GridHelper(8,8,0x94a3b8,0x35506e);root.add(grid);label('(P) · sàn',V(3.2,.05,2.5));return f}
    function wallFrame(tilt=0,second=false){const group=new THREE.Group();group.rotation.x=tilt*Math.PI/180;root.add(group);const glass=new THREE.Mesh(new THREE.PlaneGeometry(4.4,4),new THREE.MeshPhongMaterial({color:second?C.glass2:C.glass,transparent:true,opacity:.22,side:THREE.DoubleSide,depthWrite:false}));glass.position.y=2;group.add(glass);const add=(a,b,color,key)=>{const old=root;root=group;const x=line(a,b,color,key);root=old;return x};const vertical=add(V(-1.75,0,.02),V(-1.75,4,.02),C.vertical,'vertical'),horizontal=add(V(-2.2,4,.02),V(2.2,4,.02),C.horizontal,'horizontal'),diagonal=add(V(-1.9,.1,.025),V(1.9,3.9,.025),C.diagonal,'diagonal');add(V(-2.2,0,.02),V(2.2,0,.02),C.edge,'intersection',.04);label(second?'(Q₂)':'(Q₁)',V(1.35,3.25,.08));label(second?'Δ₂':'Δ₁',V(2.45,.08,0));return{group,vertical,horizontal,diagonal}}
    function buildScene(){clear();floor();if(step===1){wallFrame();document.getElementById('scene-chip').textContent='Vách kính đúng · chọn thanh khung';document.getElementById('measure').textContent='∠ = ?'}if(step===2){wallFrame(5);document.getElementById('scene-chip').textContent="Vách lỗi (Q₁′) · nghiêng 5°";document.getElementById('measure').textContent=s2Measured?'85,00°':'∠ = ?'}if(step===3){wallFrame();const glass=plane(4.4,4,C.glass2,.2);glass.position.set(0,2,0);glass.rotation.y=Math.PI/2;line(V(0,0,-2.2),V(0,0,2.2),C.edge);line(V(0,0,0),V(0,4,0),C.result,'corner',.075);label('(Q₂)',V(.08,3.2,1.4));label('a = Q₁ ∩ Q₂',V(0,4.25,0),'result');document.getElementById('scene-chip').textContent='Hai vách cùng vuông góc sàn';document.getElementById('measure').textContent=s3Done?'90,00°':'∠ = ?'}if(step===4){wallFrame();document.getElementById('scene-chip').textContent='Đường chéo trong vách (Q₁)';document.getElementById('measure').textContent=s4Measured?'45,00°':'∠ = ?'}setCamera(false)}
    function setCamera(front){camera.position.set(front?0:7,front?2.2:5.2,front?9:8);controls.target.set(0,1.7,0);controls.update()}
    function mark(key,state){pickables.forEach(x=>{if(x.userData.key===key){x.material.color.setHex(state==='good'?0x2D8B6F:state==='bad'?0xC15F3C:x.userData.baseColor);x.material.emissive.setHex(x.material.color.getHex());x.material.emissiveIntensity=.35}})}
    const note=t=>`<div class="notebook"><b><i class="ti ti-notebook"></i> Sổ tay kiến thức</b><br>${t}</div>`,nav=label=>`<div class="btn-row">${step>1?'<button class="btn secondary" onclick="m2.prev()">← Quay lại</button>':''}<button class="btn primary" onclick="m2.next()">${label} →</button></div>`;
    function render(){document.getElementById('progress').textContent=`BƯỚC ${step}/4`;document.querySelectorAll('.tab').forEach(b=>{const n=+b.dataset.step;b.disabled=n>unlocked;b.classList.toggle('active',n===step);b.classList.toggle('done',n<unlocked)});if(step===1)render1();if(step===2)render2();if(step===3)render3();if(step===4)render4();report();state('xem bước '+step)}
    function render1(){const status=s1Done?(s1Success?'<div class="feedback good">Chính xác. Vách (Q₁) chứa thanh đứng vuông góc sàn (P), nên (Q₁) ⟂ (P).</div>':'<div class="feedback bad">Hết lượt. Thanh đứng được đánh dấu xanh: chỉ cần một đường trong (Q₁) vuông góc (P).</div>'):s1Strikes===2?'<div class="feedback warn">Gợi ý: đường chìa khóa phải vuông góc sàn. Thanh nào có hướng thẳng đứng?</div>':'';content.innerHTML=`<p class="eyebrow">Bước 1 · Điều kiện đủ</p><h2 class="title">Tìm “đường chìa khóa”</h2><div class="athena"><b>✦ Athena</b>Thợ đã xác nhận một thanh trong khung vuông góc sàn. Hãy chạm đúng thanh trên hình hoặc chọn bên dưới.</div><div class="card" id="key-card"><h3>Thanh nào là đường chìa khóa?</h3>${[['vertical','Thanh đứng'],['horizontal','Thanh ngang'],['diagonal','Đường chéo khung']].map(([k,t])=>`<button class="choice ${s1Done&&k==='vertical'?'correct':wrongKey===k?'wrong':''}" ${s1Done?'disabled':''} onclick="m2.pick('${k}')">${t}</button>`).join('')}${status}</div>${note('<b>Định nghĩa:</b> (P) ⟂ (Q) khi góc giữa chúng bằng 90°.<br><b>Điều kiện đủ:</b> nếu một mặt phẳng chứa một đường thẳng vuông góc với mặt phẳng kia thì hai mặt phẳng vuông góc.')}<div class="btn-row"><button class="btn primary" ${!s1Done?'disabled':''} onclick="m2.next()">Sang bẫy quan sát →</button></div>`}
    function render2(){content.innerHTML=`<p class="eyebrow">Bước 2 · Không tin bằng mắt</p><h2 class="title">Bẫy “trông vuông góc”</h2><div class="athena"><b>✦ Athena</b>Vách này trông gần như thẳng đứng. Bạn có nghĩ nó vuông góc sàn không?</div>${!s2Observed?'<div class="btn-row"><button class="btn secondary" onclick="m2.observe(true)">Có, trông vuông góc</button><button class="btn secondary" onclick="m2.observe(false)">Chưa thể kết luận</button></div>':`<div class="card"><h3>Kiểm tra bằng đường cụ thể</h3><p class="small">Chạm trực tiếp thanh dọc màu xanh trên mô hình hoặc dùng nút đo.</p><button class="btn primary" onclick="m2.measureTilt()">${s2Measured?'Đã đo: 85,00°':'Đo thanh dọc'}</button>${s2Measured?'<div class="feedback bad">Vách nghiêng 5° nên thanh chỉ tạo góc 85°, không phải 90°. Vách KHÔNG vuông góc sàn.</div>':''}</div>`}${s2Measured?`<div class="card" id="proof-card"><h3>Cách khẳng định đúng là gì?</h3>${['Nhìn hình thấy vuông thì kết luận','Chỉ rõ một đường trong một mặt và chứng minh nó vuông góc mặt kia','Dùng thước đo trên hình biểu diễn'].map((t,i)=>`<button class="choice ${s2Done&&i===1?'correct':wrongKey===`s2-${i}`?'wrong':''}" ${s2Done?'disabled':''} onclick="m2.answer2(${i})">${String.fromCharCode(65+i)}) ${t}</button>`).join('')}${s2Done?(s2Success?'<div class="feedback good">Đúng. Phải chỉ rõ đường thẳng cụ thể và chứng minh bằng dữ kiện thật.</div>':'<div class="feedback bad">Hết lượt. Đáp án đúng đã được đánh dấu.</div>'):s2Strikes===2?'<div class="feedback warn">Gợi ý: hình phối cảnh có thể đánh lừa mắt; cần một đường thẳng có quan hệ vuông góc thật.</div>':''}</div>`:''}${note('Không kết luận hai mặt phẳng vuông góc chỉ vì hình vẽ “trông vuông”. Phải chỉ rõ đường và đo hoặc chứng minh.')}<div class="btn-row"><button class="btn secondary" onclick="m2.prev()">← Quay lại</button><button class="btn primary" ${!s2Done?'disabled':''} onclick="m2.next()">Xem tính chất giao tuyến →</button></div>`}
    function render3(){content.innerHTML=`<p class="eyebrow">Bước 3 · Tính chất giao tuyến</p><h2 class="title">Hai vách cùng vuông góc sàn</h2><div class="athena"><b>✦ Athena</b>(Q₁), (Q₂) cắt nhau và cùng vuông góc với sàn (P). Đường giao ở góc phòng có vuông góc sàn không?</div><div class="card"><h3>Đo giao tuyến a</h3><p class="small">Chạm đường giao màu vàng trên mô hình hoặc dùng nút đo.</p><button class="btn primary" onclick="m2.measureCorner()">${s3Done?'Đã đo: 90,00°':'Đo góc với sàn'}</button>${s3Done?'<div class="feedback good">Đúng 90°. Giao tuyến a vuông góc với (P).</div>':''}</div>${note('Nếu hai mặt phẳng cắt nhau và cùng vuông góc với mặt phẳng thứ ba thì giao tuyến của chúng vuông góc với mặt phẳng thứ ba.')}<div class="btn-row"><button class="btn secondary" onclick="m2.prev()">← Quay lại</button><button class="btn primary" ${!s3Done?'disabled':''} onclick="m2.next()">Kiểm tra đường chéo →</button></div>`}
    function render4(){content.innerHTML=`<p class="eyebrow">Bước 4 · Sửa sai</p><h2 class="title">Không phải mọi đường đều vuông góc</h2><div class="athena"><b>✦ Athena</b>(Q₁) ⟂ (P), nhưng đường chéo khung không vuông góc giao tuyến Δ₁. Hãy chạm đường chéo trên hình hoặc dùng nút đo.</div><div class="card"><button class="btn primary" onclick="m2.measureDiagonal()">${s4Measured?'Đã đo: 45,00°':'Đo đường chéo'}</button>${s4Measured?'<div class="feedback bad">Đường chéo chỉ tạo góc 45° với sàn — không vuông góc sàn.</div>':''}</div>${s4Measured?`<div class="card" id="all-card"><h3>Mọi đường trong (Q₁) có chắc vuông góc (P)?</h3><button class="choice ${s4Strikes>0&&!s4Success?'wrong':''}" ${s4Done?'disabled':''} onclick="m2.answer4(true)">Có, vì (Q₁) ⟂ (P)</button><button class="choice ${s4Done?'correct':''}" ${s4Done?'disabled':''} onclick="m2.answer4(false)">Không, chỉ đường vuông góc giao tuyến mới chắc chắn vuông góc (P)</button>${s4Done?(s4Success?'<div class="feedback good">Chính xác. Nằm trong mặt vuông góc chưa phải điều kiện đủ cho từng đường.</div>':'<div class="feedback bad">Hết lượt. Đáp án đúng đã được đánh dấu.</div>'):s4Strikes===2?'<div class="feedback warn">Gợi ý: đường chéo có vuông góc với chân vách Δ₁ không?</div>':''}</div>`:''}<div class="card"><h3>Câu hỏi đối chiếu · không chấm điểm</h3><p class="small">Hai mặt phẳng song song thì mọi đường trong mặt này có song song với mặt kia không? Còn hai mặt vuông góc thì mọi đường trong mặt này có vuông góc mặt kia không?</p><button class="btn secondary" onclick="m2.revealComparison()">${comparisonShown?'Đã mở đối chiếu':'Suy nghĩ rồi xem đối chiếu'}</button>${comparisonShown?'<div class="feedback info">Hai mặt song song: mọi đường trong mặt này song song với mặt kia. Hai mặt vuông góc: không phải mọi đường trong mặt này vuông góc mặt kia.</div>':''}</div>${note('<b>Tổng hợp:</b><ol><li>Một mặt chứa đường ⟂ mặt kia ⇒ hai mặt ⟂ nhau.</li><li>Không kết luận bằng mắt.</li><li>Hai mặt cắt nhau cùng ⟂ mặt thứ ba ⇒ giao tuyến ⟂ mặt thứ ba.</li><li>Chỉ đường ⟂ giao tuyến mới chắc chắn ⟂ mặt kia.</li></ol>')}<div class="btn-row"><button class="btn secondary" onclick="m2.prev()">← Quay lại</button><button class="btn primary" ${!s4Done?'disabled':''} onclick="m2.finish()">Hoàn thành Module</button></div>`}
    function go(n){if(n<1||n>unlocked)return;step=n;wrongKey=null;buildScene();render()}
    function next(){unlocked=Math.max(unlocked,Math.min(4,step+1));LMS().progress({done:step,total:4});LMS().event('completed-section',{id:['key-line','visual-trap','intersection-property','not-every-line'][step-1]});if(step<4)go(step+1)}
    function state(action){LMS().state({step,unlocked,s1Strikes,s1Done,s1Success,s2Observed,s2Measured,s2Strikes,s2Done,s2Success,s3Done,s4Measured,s4Strikes,s4Done,s4Success,comparisonShown,finished,lastAction:action})}
    function shake(id){const el=document.getElementById(id);if(!el)return;el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),320)}
    function pick(k){if(step!==1||s1Done)return;wrongKey=null;if(k==='vertical'){s1Done=true;s1Success=true;mark(k,'good')}else{s1Strikes++;wrongKey=k;mark(k,'bad');if(s1Strikes>=3){s1Done=true;mark('vertical','good')}}render1();if(s1Strikes===1&&!s1Done)shake('key-card');LMS().event('answered',{id:'key-line',choice:k,correct:k==='vertical',strike:s1Strikes});state('chọn '+k)}
    window.m2={pick,next,prev(){go(step-1)},observe(){s2Observed=true;render2();state('quan sát vách nghiêng')},measureTilt(){s2Measured=true;mark('vertical','bad');document.getElementById('measure').textContent='85,00°';render2();LMS().event('measured',{id:'tilted-vertical',value:85});state('đo 85 độ')},answer2(i){wrongKey=null;if(i===1){s2Done=true;s2Success=true}else{s2Strikes++;wrongKey=`s2-${i}`;if(s2Strikes>=3)s2Done=true}render2();if(s2Strikes===1&&!s2Done)shake('proof-card');LMS().event('answered',{id:'proof-method',correct:i===1,strike:s2Strikes});state('trả lời phương pháp chứng minh')},measureCorner(){s3Done=true;mark('corner','good');document.getElementById('measure').textContent='90,00°';render3();LMS().event('measured',{id:'corner-floor',value:90});state('đo giao tuyến 90 độ')},measureDiagonal(){s4Measured=true;mark('diagonal','bad');document.getElementById('measure').textContent='45,00°';render4();LMS().event('measured',{id:'diagonal-floor',value:45});state('đo đường chéo 45 độ')},answer4(yes){if(!yes){s4Done=true;s4Success=true}else{s4Strikes++;if(s4Strikes>=3)s4Done=true}render4();if(s4Strikes===1&&!s4Done)shake('all-card');LMS().event('answered',{id:'every-line',correct:!yes,strike:s4Strikes});state('trả lời bẫy mọi đường')},revealComparison(){comparisonShown=true;render4();LMS().event('revealed',{id:'parallel-vs-perpendicular'});state('mở câu hỏi đối chiếu')},finish(){if(finished)return;finished=true;const items=[s1Success,s2Success,s3Done,s4Success],score=items.filter(Boolean).length;LMS().progress({done:4,total:4});LMS().complete({summary:'Đã hoàn thành điều kiện và hai tính chất của hai mặt phẳng vuông góc.',score,max:4,items:items.map((correct,i)=>({id:['key-line','visual-proof','intersection','every-line'][i],correct}))});content.insertAdjacentHTML('beforeend','<div class="feedback good"><b>Hoàn thành!</b> Bạn đã biết cách chứng minh thay vì tin vào hình vẽ.</div>');report()}};
    window.m2.finish=function(){
      if(finished||!s4Done)return;
      finished=true;
      const buttons=[...content.querySelectorAll('button')];
      const finishButton=buttons.find(button=>button.textContent.trim()==='Hoàn thành Module');
      if(finishButton){finishButton.disabled=true;finishButton.textContent='✓ Đã hoàn thành'}
      const message=document.createElement('div');
      message.className='feedback good';
      message.innerHTML='<b>Hoàn thành!</b> Bạn đã biết cách chứng minh thay vì tin vào hình vẽ.';
      const actions=content.querySelector('.btn-row:last-child');
      if(actions)actions.before(message);else content.appendChild(message);
      const items=[s1Success,s2Success,s3Done,s4Success];
      const score=items.filter(Boolean).length;
      try{LMS().progress({done:4,total:4})}catch(error){console.warn('Không thể cập nhật tiến độ LMS:',error)}
      try{LMS().complete({summary:'Đã hoàn thành điều kiện và hai tính chất của hai mặt phẳng vuông góc.',score,max:4,items:items.map((correct,i)=>({id:['key-line','visual-proof','intersection','every-line'][i],correct}))})}catch(error){console.warn('Không thể gửi trạng thái hoàn thành LMS:',error)}
      try{state('hoàn thành module')}catch(error){console.warn('Không thể lưu trạng thái LMS:',error)}
      report();
      message.scrollIntoView({behavior:'smooth',block:'nearest'});
    };
    document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(+b.dataset.step));document.getElementById('reset').onclick=()=>setCamera(false);document.getElementById('top-view').onclick=()=>setCamera(true);
    const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let pointerDown=null;canvas.addEventListener('pointerdown',e=>pointerDown={x:e.clientX,y:e.clientY});canvas.addEventListener('pointerup',e=>{if(!pointerDown||Math.hypot(e.clientX-pointerDown.x,e.clientY-pointerDown.y)>6)return;const r=canvas.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(pickables,false)[0];if(!hit)return;const key=hit.object.userData.key;if(step===1)pick(key);else if(step===2&&key==='vertical')window.m2.measureTilt();else if(step===3&&key==='corner')window.m2.measureCorner();else if(step===4&&key==='diagonal')window.m2.measureDiagonal()});
    function resize(){const w=wrap.clientWidth,h=wrap.clientHeight;camera.aspect=w/Math.max(1,h);camera.updateProjectionMatrix();renderer.setSize(w,h,false)}new ResizeObserver(resize).observe(wrap);window.addEventListener('resize',resize);
    function updateLabels(){labels.forEach(l=>{const p=l.pos.clone().project(camera),ok=p.z>-1&&p.z<1;l.el.style.display=ok?'block':'none';if(ok)l.el.style.transform=`translate(${(p.x*.5+.5)*wrap.clientWidth}px,${(-p.y*.5+.5)*wrap.clientHeight}px) translate(-50%,-115%)`})}
    function animate(){requestAnimationFrame(animate);controls.update();updateLabels();renderer.render(scene,camera)}function report(){LMS().resize({height:document.documentElement.scrollHeight})}new ResizeObserver(()=>{clearTimeout(window._rr);window._rr=setTimeout(report,100)}).observe(document.body);
    buildScene();render();resize();animate();LMS().ready({id:'bai25-module2-dieu-kien-tinh-chat'});state('mở module');
    if(window.AiducationLMS)window.AiducationLMS.onResume=s=>{if(!s)return;unlocked=Math.max(1,Math.min(4,s.unlocked||1));s1Strikes=s.s1Strikes||0;s1Done=!!s.s1Done;s1Success=!!s.s1Success;s2Observed=!!s.s2Observed;s2Measured=!!s.s2Measured;s2Strikes=s.s2Strikes||0;s2Done=!!s.s2Done;s2Success=!!s.s2Success;s3Done=!!s.s3Done;s4Measured=!!s.s4Measured;s4Strikes=s.s4Strikes||0;s4Done=!!s.s4Done;s4Success=!!s.s4Success;comparisonShown=!!s.comparisonShown;go(Math.min(unlocked,s.step||1))};
  })();
  </script>
</body>
