    "structure":[{"id":"lab-dihedral","title":"Đo góc nhị diện"},{"id":"lab-edge","title":"Tính cạnh chóp cụt"},{"id":"earth","title":"Trái Đất và kinh tuyến"},{"id":"tour","title":"Lướt qua tính chất"}],
    "athenaGuidance":"Đây là Lab khám phá tự do. Học sinh chọn hai mặt kề để đo góc nhị diện, tính cạnh chóp cụt qua bốn bước, kéo kinh độ trên địa cầu và đi qua tour năm khối. Câu hỏi tour: 1) Mặt bên là hình gì? Có vuông góc đáy không? — Lựa chọn: A) Hình chữ nhật, có; B) Hình bình hành, không. 2) Các mặt bên có cùng kích thước không? — Lựa chọn: A) Có; B) Không. 3) Trong 6 mặt, ít nhất bao nhiêu mặt là hình chữ nhật? — Lựa chọn: A) 2; B) 4; C) 6. 4) Cả 6 mặt và 4 đường chéo có tính chất gì? — Lựa chọn: A) Sáu mặt chữ nhật, bốn đường chéo bằng nhau và đồng quy; B) Chỉ hai đáy chữ nhật. 5) Tất cả 6 mặt là hình gì? — Lựa chọn: A) Hình vuông; B) Hình thoi. Athena chỉ gợi ý, không nói thẳng đáp án trước khi học sinh thao tác."

  <style>

nk-2)}.feedback.good{background:var(--correct-bg);color:var(--jade-text)}.feedback.warn{background:var(--warning-bg);color:var(--accent-text)}.calc-step{padding:6px 8px;border-left:3px solid var(--jade-deep);background:var(--cream);margin:5px 0;font-family:'JetBrains Mono','Courier New',monospace;font-variant-numeric:tabular-nums;font-size:13px}.face-pill,.item-row{display:flex;gap:7px;align-items:center;padding:6px 8px;border-radius:7px;background:var(--cream);margin:4px 0;font-size:12.5px}.dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}.del{margin-left:auto;border:0;background:none;color:var(--wrong)}

<body>
  <header>
    <div class="brand"><i class="ti ti-cube"></i> Phòng Lab Hình học không gian</div>
    <div class="workspace-tabs">
      <button class="workspace-tab active" data-workspace="solids">Kho đa diện</button>
      <button class="workspace-tab" data-workspace="earth">🌍 Trái Đất & Kinh tuyến</button>
      <button class="workspace-tab" data-workspace="tour">Tour 5 khối</button>
    </div>
  </header>
  <main id="app">
    <nav id="icon-rail" aria-label="Nhóm khối"></nav>
    <section id="canvas-wrap">
      <canvas id="three-canvas"></canvas><div id="label-layer"></div>
      <aside id="catalog-overlay">
        <div class="cat-header"><span>Danh sách khối</span><button class="cat-close" onclick="closeCatalog()">✕</button></div>
        <div class="cat-search-wrap"><input id="cat-search" placeholder="Tìm khối…" oninput="buildCatalog(this.value)"></div>
        <div class="cat-list" id="cat-list"></div>
      </aside>
      <div id="mode-bar">
        <button class="mode-btn active" id="mbtn-view" onclick="setMode('view')"><i class="ti ti-hand-stop"></i><span class="txt">Xem</span></button>
        <button class="mode-btn" id="mbtn-point" onclick="setMode('point')"><i class="ti ti-point"></i><span class="txt">Thêm điểm</span></button>
        <button class="mode-btn" id="mbtn-connect" onclick="setMode('connect')"><i class="ti ti-line"></i><span class="txt">Nối</span></button>
        <button class="mode-btn" id="mbtn-delete" onclick="setMode('delete')"><i class="ti ti-trash"></i><span class="txt">Xoá</span></button>
        <button class="mode-btn" id="mbtn-height" onclick="setMode('height')"><i class="ti ti-ruler-2"></i><span class="txt">Hạ đường cao</span></button>
        <button class="mode-btn" id="mbtn-section" onclick="setMode('section')"><i class="ti ti-cut"></i><span class="txt">Thiết diện</span></button>
        <button class="mode-btn" id="mbtn-dihedral" onclick="setMode('dihedral')"><i class="ti ti-angle"></i><span class="txt">Đo góc nhị diện</span></button>
      </div>
      <div id="mode-hint">Xoay / zoom tự do. Mở danh mục bên trái để đổi khối.</div>
      <div id="earth-panel">
        <div class="s-title">Kinh tuyến qua P</div>
        <div class="earth-value" id="earth-value">45,00° Đông</div>
        <input id="longitude-slider" type="range" min="-180" max="180" step="0.01" value="45" style="width:100%;accent-color:var(--teal)">
        <div class="btn-row" style="margin-top:8px"><button class="btn btn-primary" id="btn-truong-sa">Đảo Trường Sa Lớn · 111,92°</button><button class="btn btn-outline" id="btn-earth-grid">Hiện lưới phụ</button></div>
        <div class="feedback">Xoay địa cầu, rồi nhìn dọc trục Bắc–Nam để thấy góc nhị diện như một góc phẳng trên xích đạo.</div>
      </div>
      <div class="canvas-actions"><button class="canvas-btn" id="btn-reset-camera"><i class="ti ti-refresh"></i> Đặt lại góc nhìn</button></div>
    </section>
    <aside id="sidebar"></aside>
  </main>
  <script>
    function LMS(){return window.AiducationLMS||{ready:function(){},progress:function(){},event:function(){},state:function(){},complete:function(){},resize:function(){}};}
    const COLOR_PLANE_1=0x3b82f6,COLOR_PLANE_2=0xa78bfa,COLOR_PLANE_3=0x34d399,COLOR_PLANE_4=0xfb923c,COLOR_PLANE_BASE=0x64748b,COLOR_EDGE_SOLID=0xe6edf3,COLOR_EDGE_HIDDEN=0x444d56,COLOR_RESULT=0xFAC775;
    const faceColors=[COLOR_PLANE_1,COLOR_PLANE_2,COLOR_PLANE_3,COLOR_PLANE_4,0xe879f9,COLOR_PLANE_BASE];
    const equi=(side,y=0)=>{const r=side/Math.sqrt(3);return [[0,y,-r],[side/2,y,r/2],[-side/2,y,r/2]]};
    const boxFaces=[{name:'ABCD',v:['A','B','C','D']},{name:"A'B'C'D'",v:['A1','B1','C1','D1']},{name:"ABB'A'",v:['A','B','B1','A1']},{name:"BCC'B'",v:['B','C','C1','B1']},{name:"CDD'C'",v:['C','D','D1','C1']},{name:"DAA'D'",v:['D','A','A1','D1']}];
    const boxEdges=[['A','B'],['B','C'],['C','D'],['D','A'],['A1','B1'],['B1','C1'],['C1','D1'],['D1','A1'],['A','A1'],['B','B1'],['C','C1'],['D','D1']];
    const prismTriFaces=[{name:'ABC',v:['A','B','C']},{name:"A'B'C'",v:['A1','B1','C1']},{name:"ABB'A'",v:['A','B','B1','A1']},{name:"BCC'B'",v:['B','C','C1','B1']},{name:"CAA'C'",v:['C','A','A1','C1']}];
    const prismTriEdges=[['A','B'],['B','C'],['C','A'],['A1','B1'],['B1','C1'],['C1','A1'],['A','A1'],['B','B1'],['C','C1']];
    const SOLID_LIBRARY={
      pyramid_rhombus:{info:{name:'Chóp đáy hình thoi (SA⊥đáy)',notation:'S.ABCD',desc:'Preset Hình 7.54 — góc nhị diện [B,SA,D] bằng 120°.'},params:[{id:'h',label:'Chiều cao SA',min:1,max:5,step:.1,val:3},{id:'a',label:'Cạnh hình thoi',min:1,max:4,step:.1,val:2.5}],vertices(p){const c=Math.cos(2*Math.PI/3),s=Math.sin(2*Math.PI/3);return{A:[0,0,0],B:[p.a,0,0],D:[p.a*c,0,p.a*s],C:[p.a+p.a*c,0,p.a*s],S:[0,p.h,0]}},edges:[['S','A'],['S','B'],['S','C'],['S','D'],['A','B'],['B','C'],['C','D'],['D','A']],faces:[{name:'SAB',v:['S','A','B']},{name:'SBC',v:['S','B','C']},{name:'SCD',v:['S','C','D']},{name:'SDA',v:['S','D','A']},{name:'ABCD',v:['A','B','C','D']}],formula:'V = ⅓ · Sđáy · h'},
      frustum_regular:{info:{name:'Chóp cụt tam giác đều',notation:"ABC.A'B'C'",desc:'Preset Hình 7.71 — tính cạnh bên từ h, a và a′.'},params:[{id:'h',label:'Chiều cao h',min:1,max:9,step:.1,val:6},{id:'a',label:'Đáy lớn a',min:2,max:8,step:.1,val:5},{id:'ap',label:'Đáy nhỏ a′',min:.5,max:6,step:.1,val:3}],vertices(p){const b=equi(p.a,0),t=equi(Math.min(p.ap,p.a-.1),p.h);return{A:b[0],B:b[1],C:b[2],A1:t[0],B1:t[1],C1:t[2]}},edges:prismTriEdges,faces:prismTriFaces,formula:'l = √(h² + (a−a′)²/3)',calculator:true},

    function renderSidebar(){const s=document.getElementById('sidebar');if(currentWorkspace==='tour'){renderTourSidebar();return}if(currentWorkspace==='earth'){s.innerHTML=`<div id="earth-mobile-slot"></div><div class="s-section"><h3 class="s-title">Ứng dụng góc nhị diện</h3><p class="note">Hai nửa mặt phẳng kinh tuyến có chung bờ là trục Bắc–Nam. Góc nhị diện giữa chúng chính là độ chênh kinh độ.</p><div class="formula-box">Kinh độ λ ↔ góc phẳng giữa hai tia trên xích đạo tại O</div></div><div class="conclusion">Nhìn từ trên cực Bắc hoặc cực Nam, bài toán 3D trở về một góc phẳng quen thuộc.</div>`;dockEarthPanel();return}const cfg=SOLID_LIBRARY[currentSolidKey],pairs=adjacentPairs();let html=`<div class="s-section"><h3 class="s-title">${cfg.info.name}</h3><div class="note"><b>${cfg.info.notation}</b> — ${cfg.info.desc}</div><div class="formula-box">${cfg.formula}</div></div><div class="s-section"><h3 class="s-title">Kích thước</h3>`;cfg.params.forEach(p=>{html+=`<div class="slider-row"><label>${p.label}<span data-param-label="${p.id}">${currentParams[p.id].toFixed(1)}</span></label><div class="param-control"><input data-param-input="${p.id}" type="range" min="${p.min}" max="${p.max}" step="${p.step}" value="${currentParams[p.id]}" oninput="updateParam('${p.id}',this.value)"><input data-param-input="${p.id}" class="param-number" type="number" inputmode="decimal" min="${p.min}" max="${p.max}" step="${p.step}" value="${currentParams[p.id]}" aria-label="Nhập ${p.label}" oninput="updateParam('${p.id}',this.value)"></div></div>`});html+='</div>';
      if(cfg.calculator){const d=currentParams.a-currentParams.ap,q=d*d/3,total=currentParams.h*currentParams.h+q;html+=`<div class="s-section"><h3 class="s-title">Tính cạnh bên chóp cụt đều</h3><p class="note">Không nhập đáp án cuối; mở lần lượt bốn bước để hiểu công thức.</p>${calcStep>=1?`<div class="calc-step">Bước 1: (a−a′)² = (${currentParams.a.toFixed(1)}−${currentParams.ap.toFixed(1)})² = ${(d*d).toFixed(4)}</div>`:''}${calcStep>=2?`<div class="calc-step">Bước 2: (a−a′)²/3 = ${q.toFixed(4)}</div>`:''}${calcStep>=3?`<div class="calc-step">Bước 3: h² + (a−a′)²/3 = ${total.toFixed(4)}</div>`:''}${calcStep>=4?`<div class="calc-step"><b>Bước 4: √(${total.toFixed(4)}) = ${frustumEdge().toFixed(4)}</b></div>`:''}<button class="btn btn-primary" onclick="advanceCalc()" ${calcStep>=4?'disabled':''}>${calcStep===0?'Bắt đầu tính':calcStep<4?'Hiện bước tiếp':'Đã hoàn thành'}</button></div>`}
      if(currentMode==='dihedral'||constructionGroup||challengeActive){const done=pairs.filter(p=>measuredPairs.has(p.key)).length,max=pairs.reduce((m,p)=>!m||p.angle>m.angle?p:m,null);html+=`<div class="s-section"><h3 class="s-title">Đo góc nhị diện</h3><p class="note">Chọn hai mặt kề nhau. Hệ thống tự dựng hai tia vuông góc cạnh chung tại trung điểm O.</p><div class="btn-row"><button class="btn btn-outline" onclick="toggleConstruction()">${constructionVisible?'Ẩn':'Hiện'} cách dựng</button><button class="btn btn-outline" onclick="startChallenge()">Thử thách góc lớn nhất</button></div>${challengeActive?`<div class="feedback ${done===pairs.length?'good':''}">Đã đo ${done}/${pairs.length} cặp mặt kề.${done===pairs.length&&max?` Cặp lớn nhất: <b>${cfg.faces[max.i].name} và ${cfg.faces[max.j].name}</b>, ${max.angle.toFixed(2).replace('.',',')}°.`:''}</div>`:''}</div>`}
      html+=`<div class="s-section"><h3 class="s-title">Điểm & Đối tượng đã dựng</h3><div class="note">${customPoints.length} điểm · ${segments.length} đoạn · ${heights.length} đường cao · ${sections.length} thiết diện</div>${customPoints.map((p,i)=>`<div class="item-row"><span class="dot"></span><b>${p.name}</b><button class="del" onclick="removeCustomPoint(${i})">✕</button></div>`).join('')}${segments.map((x,i)=>`<div class="item-row">Đoạn <b>${x.name}</b><button class="del" onclick="removeSegment(${i})">✕</button></div>`).join('')}${heights.map((x,i)=>`<div class="item-row">Đường cao <b>${x.name}</b><button class="del" onclick="removeHeight(${i})">✕</button></div>`).join('')}${sections.map((x,i)=>`<div class="item-row">Thiết diện <b>${x.name}</b><button class="del" onclick="removeSection(${i})">✕</button></div>`).join('')}</div>`;s.innerHTML=html}
    function renderTourSidebar(){const t=TOUR[tourStep],cfg=SOLID_LIBRARY[t.key],choice=window._tourChoice;document.getElementById('sidebar').innerHTML=`<div class="s-section"><h3 class="s-title">Lướt qua tính chất · ${tourStep+1}/5</h3><div class="tour-progress">${TOUR.map((_,i)=>`<span class="tour-dot ${i<tourStep?'done':i===tourStep?'active':''}"></span>`).join('')}</div><h3 class="s-title">${cfg.info.name}</h3><div class="formula-box">Điều kiện mới: ${t.condition}</div></div><div class="s-section"><h3 class="s-title">${t.q}</h3>${t.options.map((o,i)=>{const state=tourAnswered&&i===choice?(i===t.answer?'correct':'wrong'):'';return`<button class="choice ${state}" onclick="answerTour(${i})" ${tourAnswered?'disabled':''}>${String.fromCharCode(65+i)}) ${o}</button>`}).join('')}${tourAnswered?`<div class="feedback ${choice===t.answer?'good':'bad'}">${choice===t.answer?'Chính xác! ':'Chưa đúng. '}${t.explain}</div>`:''}</div>${tourAnswered?`<button class="btn btn-primary" onclick="nextTour()">${tourStep===4?'Hoàn thành tour':'Bước tiếp →'}</button>`:''}${tourStep===4&&milestones.tour?`<div class="conclusion" style="margin-top:10px">Lăng trụ đứng ⊃ Lăng trụ đều; Lăng trụ đứng ⊃ Hình hộp đứng ⊃ Hình hộp chữ nhật ⊃ Hình lập phương. Mỗi bước thêm đúng một điều kiện.</div>`:''}`}
    function answerTour(i){tourAnswered=true;window._tourChoice=i;LMS().event('answered',{id:`tour-${tourStep+1}`,chosen:i,correct:i===TOUR[tourStep].answer});renderTourSidebar()}
    function nextTour(){if(tourStep<4){tourStep++;tourAnswered=false;window._tourChoice=null;currentSolidKey=TOUR[tourStep].key;currentParams=defaultsFor(currentSolidKey);clearAux();clearDihedral();solidRenderer.load(currentSolidKey,currentParams);renderTourSidebar();emitState('tour bước '+(tourStep+1))}else{milestones.tour=true;updateProgress();renderTourSidebar()}}
    function buildRail(){document.getElementById('icon-rail').innerHTML=CATALOG.map((g,i)=>`<button class="rail-btn" title="${g.label}" onclick="openCatalog(${i})"><i class="ti ${g.icon}"></i></button>`).join('')}
    function buildCatalog(filter=''){const q=filter.trim().toLowerCase();document.getElementById('cat-list').innerHTML=CATALOG.map(g=>{const keys=g.keys.filter(k=>{const x=SOLID_LIBRARY[k].info;return !q||(x.name+' '+x.notation).toLowerCase().includes(q)});if(!keys.length)return'';return`<div class="cg-header">${g.label}</div>${keys.map(k=>`<button class="shape-btn ${k===currentSolidKey?'active':''}" data-key="${k}" onclick="loadSolid('${k}')">${SOLID_LIBRARY[k].info.name}<span class="shape-tag">${SOLID_LIBRARY[k].info.notation}</span></button>`).join('')}`}).join('')}
    function openCatalog(i){if(currentWorkspace!=='solids')setWorkspace('solids');buildCatalog();document.getElementById('catalog-overlay').classList.add('open');document.querySelectorAll('.rail-btn').forEach((b,j)=>b.classList.toggle('active',i===j))}function closeCatalog(){document.getElementById('catalog-overlay').classList.remove('open');document.querySelectorAll('.rail-btn').forEach(b=>b.classList.remove('active'))}
    let earthGroup=null,earthDynamic=null,earthGrid=null,longitude=45;
    function createMeridianLine(r,deg,color,segments=96){const curve=new THREE.EllipseCurve(0,0,r,r,-Math.PI/2,Math.PI/2,false,0),lambda=deg*Math.PI/180,pts=curve.getPoints(segments).map(p=>new THREE.Vector3(p.x*Math.cos(lambda),p.y,p.x*Math.sin(lambda)));return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color,transparent:true,opacity:.95}))}
    function createLatitudeCircle(r,deg,color,opacity=.7){const phi=deg*Math.PI/180,rr=r*Math.cos(phi),y=r*Math.sin(phi),curve=new THREE.EllipseCurve(0,0,rr,rr,0,2*Math.PI,false,0),pts=curve.getPoints(96).map(p=>new THREE.Vector3(p.x,y,p.y));return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color,transparent:true,opacity}))}
    function buildEarth(){if(earthGroup)disposeObject(earthGroup);earthGroup=new THREE.Group();scene.add(earthGroup);gridHelper.visible=false;const globe=new THREE.Mesh(new THREE.SphereGeometry(5,64,40),new THREE.MeshPhongMaterial({color:0x2e8b57,transparent:true,opacity:.38,shininess:28,specular:0x336644,side:THREE.DoubleSide,depthWrite:false}));earthGroup.add(globe);earthGroup.add(createLatitudeCircle(5,0,0xFAC775,1));earthGroup.add(createMeridianLine(5,0,0x34d399));makeLine(new THREE.Vector3(0,-6,0),new THREE.Vector3(0,6,0),0xe6edf3,false,earthGroup);const centerDot=new THREE.Mesh(new THREE.SphereGeometry(.13,16,12),new THREE.MeshStandardMaterial({color:COLOR_RESULT,emissive:0x5a471d,emissiveIntensity:.45,depthTest:false}));centerDot.renderOrder=5;earthGroup.add(centerDot);addLabel('O',new THREE.Vector3(0,.18,0));addLabel('Bắc',new THREE.Vector3(0,5.5,0));addLabel('Nam',new THREE.Vector3(0,-5.5,0));earthGrid=new THREE.Group();[-60,-30,30,60].forEach(x=>earthGrid.add(createLatitudeCircle(5,x,0x94a3b8,.35)));for(let x=30;x<180;x+=30){earthGrid.add(createMeridianLine(5,x,0x94a3b8));earthGrid.add(createMeridianLine(5,-x,0x94a3b8))}earthGrid.visible=false;earthGroup.add(earthGrid);updateEarth(longitude,false)}
    function updateEarth(val,track=true){longitude=parseFloat(val);if(earthDynamic)disposeObject(earthDynamic);labels.filter(l=>l.kind==='earth-dynamic').forEach(l=>l.el.remove());labels=labels.filter(l=>l.kind!=='earth-dynamic');earthDynamic=new THREE.Group();earthGroup.add(earthDynamic);earthDynamic.add(createMeridianLine(5,longitude,0xfb923c));const rad=longitude*Math.PI/180,d0=new THREE.Vector3(1,0,0),d1=new THREE.Vector3(Math.cos(rad),0,Math.sin(rad));makeLine(new THREE.Vector3(),d0.clone().multiplyScalar(2.2),0x34d399,false,earthDynamic);makeLine(new THREE.Vector3(),d1.clone().multiplyScalar(2.2),0xfb923c,false,earthDynamic);buildArc(new THREE.Vector3(),d0,d1,1.5,COLOR_RESULT,earthDynamic);const pPos=d1.clone().multiplyScalar(5.04),pDot=new THREE.Mesh(new THREE.SphereGeometry(.14,16,12),new THREE.MeshStandardMaterial({color:0xfb923c,emissive:0x6b2f0d,emissiveIntensity:.5}));pDot.position.copy(pPos);earthDynamic.add(pDot);const pLabel=addLabel('P',pPos.clone().add(new THREE.Vector3(0,.16,0)));pLabel.kind='earth-dynamic';document.getElementById('earth-value').textContent=`${Math.abs(longitude).toFixed(2).replace('.',',')}° ${longitude<0?'Tây':'Đông'}`;document.getElementById('longitude-slider').value=longitude;if(track){milestones.earth=true;LMS().event('changed',{id:'longitude',value:longitude});updateProgress();emitState('đổi kinh độ')}}
    function dockEarthPanel(){const panel=document.getElementById('earth-panel'),slot=document.getElementById('earth-mobile-slot'),mobile=window.matchMedia('(max-width:560px)').matches;if(currentWorkspace==='earth'&&mobile&&slot){if(panel.parentElement!==slot)slot.appendChild(panel)}else if(panel.parentElement!==wrap)wrap.appendChild(panel)}
    function setWorkspace(kind){const earthPanel=document.getElementById('earth-panel');if(earthPanel.parentElement!==wrap)wrap.appendChild(earthPanel);currentWorkspace=kind;closeCatalog();document.querySelectorAll('.workspace-tab').forEach(b=>b.classList.toggle('active',b.dataset.workspace===kind));document.getElementById('mode-bar').style.display=kind==='solids'?'flex':'none';document.getElementById('mode-hint').style.display=kind==='solids'?'block':'none';earthPanel.style.display=kind==='earth'?'block':'none';document.getElementById('icon-rail').style.display=kind==='solids'?'flex':'none';clearAux();clearDihedral();if(earthGroup){disposeObject(earthGroup);earthGroup=null;earthDynamic=null}solidRenderer.clear();clearLabels();if(kind==='earth'){buildEarth()}else{gridHelper.visible=true;if(kind==='tour'){currentSolidKey=TOUR[tourStep].key}else currentSolidKey=currentSolidKey||'pyramid_rhombus';currentParams=defaultsFor(currentSolidKey);solidRenderer.load(currentSolidKey,currentParams)}resetCameraView();renderSidebar();dockEarthPanel();emitState('mở '+kind)}
    document.querySelectorAll('.workspace-tab').forEach(b=>b.onclick=()=>setWorkspace(b.dataset.workspace));
    document.getElementById('sidebar').addEventListener('change',e=>{if(e.target.matches('input[type="range"]'))renderSidebar()});
    document.getElementById('longitude-slider').oninput=e=>updateEarth(e.target.value);document.getElementById('btn-truong-sa').onclick=()=>updateEarth(111.92);document.getElementById('btn-earth-grid').onclick=()=>{earthGrid.visible=!earthGrid.visible;document.getElementById('btn-earth-grid').textContent=earthGrid.visible?'Ẩn lưới phụ':'Hiện lưới phụ'};
    function resetCameraView(){if(currentWorkspace==='earth'){camera.position.set(9,7,9);orbitControls.target.set(0,0,0)}else{camera.position.set(7,5.5,8);orbitControls.target.set(0,1.3,0)}camera.fov=48;camera.updateProjectionMatrix();orbitControls.update()}document.getElementById('btn-reset-camera').onclick=resetCameraView;
    function updateProgress(){const done=Object.values(milestones).filter(Boolean).length;LMS().progress({done,total:4});if(done===4&&!completionSent){completionSent=true;LMS().complete({summary:'Đã hoàn thành bốn trải nghiệm chính của Phòng Lab Hình học không gian.',score:0,max:0,items:[]})}}
    function emitState(action){LMS().state({activeTab:currentWorkspace,currentSolid:currentSolidKey,currentMode,longitude,tourStep,lastAction:action})}
    function resize(){dockEarthPanel();const w=wrap.clientWidth,h=wrap.clientHeight;camera.aspect=w/Math.max(1,h);camera.updateProjectionMatrix();renderer.setSize(w,h,false)}if(typeof ResizeObserver!=='undefined')new ResizeObserver(resize).observe(wrap);window.addEventListener('resize',resize);
    function reportHeight(){LMS().resize({height:document.documentElement.scrollHeight})}window.addEventListener('load',reportHeight);if(typeof ResizeObserver!=='undefined')new ResizeObserver(()=>{clearTimeout(window._rz);window._rz=setTimeout(reportHeight,100)}).observe(document.body);else setInterval(reportHeight,800);
    function animate(){requestAnimationFrame(animate);orbitControls.update();solidRenderer.updateEdgeVisibility();updateLabels();renderer.render(scene,camera)}
    buildRail();buildCatalog();currentParams=defaultsFor(currentSolidKey);solidRenderer.load(currentSolidKey,currentParams);renderSidebar();resetCameraView();resize();animate();LMS().ready({id:'lab-b25'});emitState('mở Lab');const initialWorkspace=new URLSearchParams(location.search).get('workspace');if(['earth','tour'].includes(initialWorkspace))setWorkspace(initialWorkspace);
    if(window.AiducationLMS)window.AiducationLMS.onResume=function(state){if(!state)return;if(Number.isFinite(state.longitude))longitude=state.longitude;if(Number.isInteger(state.tourStep))tourStep=Math.max(0,Math.min(4,state.tourStep));setWorkspace(state.activeTab||'solids')};
  </script>
