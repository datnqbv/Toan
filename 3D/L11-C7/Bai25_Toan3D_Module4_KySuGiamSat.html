    function skewPrismScene(){clearScene();grid(12);const bottom=[V(-2,0,-1.5),V(2,0,-1.5),V(2,0,1.5),V(-2,0,1.5)],off=V(1,4.85,0),top=bottom.map(p=>p.clone().add(off));bottom.forEach((p,i)=>{line(p,bottom[(i+1)%4]);line(top[i],top[(i+1)%4]);line(p,top[i],C.orange)});const trueTop=V(-2,4.85,-1.5);line(bottom[0],trueTop,C.result,true);line(trueTop,top[0],C.helper,true);label('Cạnh bên 10 m',bottom[0].clone().lerp(top[0],.55),'wrong');label('h = 9,70 m',V(-2.25,2.5,-1.5),fixed[2]?'result':'');readout.textContent=fixed[2]?'h = 9,70 m':'CẠNH BÊN ≠ h';chip.textContent='Hồ sơ 3 · Lăng trụ xiên 14,04°';setCamera(V(8,6.5,10),V(0,2,0))}
    function beamsScene(){clearScene();grid(12);line(V(-4,0,0),V(4,0,0),C.result);line(V(-1,0,0),V(-1,4,0),C.green);line(V(1,0,0),V(1,3,3),C.orange);label('Giằng g',V(3.5,.25,0),'result');label('Xà 1',V(-1,4.2,0));label('Xà 2',V(1,3.2,3));line(V(-1,2,0),V(1,2,2),C.helper,true);readout.textContent=fixed[3]?'CHÉO NHAU':'CÙNG ⟂ g';chip.textContent='Hồ sơ 4 · Hai xà không đồng phẳng';setCamera(V(8,6,9),V(0,1.8,1))}
    function slopeScene(){clearScene();grid(12);const a=V(-4,0,0),b=V(4,0,0),c=V(4,1.2,0);line(a,b,C.edge);line(b,c,C.result,true);line(a,c,C.blue);label('L = 8 m',V(0,.2,0));label('H = 1,2 m',V(4.35,.65,0));label(fixed[4]?'8,53°':'15°?',V(-2.5,.35,0),fixed[4]?'result':'wrong');readout.textContent=fixed[4]?'α = 8,53°':'ĐỘ DỐC 15%';chip.textContent='Hồ sơ 5 · Độ dốc và vật liệu mái';setCamera(V(7,4.8,10),V(0,.6,0))}
    function buildScene(){if(current===1)roofScene();else if(current===2)diagonalScene();else if(current===3)skewPrismScene();else if(current===4)beamsScene();else slopeScene()}
    function errorQuiz(n){const i=n-1,unlimited=n===4;return `<div class="card" id="quiz"><h3>Xác định lỗi sai ${unlimited?'· không giới hạn lượt':''}</h3>${errorOptions[i].map((text,index)=>`<button class="choice ${identified[i]&&index===correctError[i]?'correct':lastWrong[i]===index?'wrong':''}" ${identified[i]?'disabled':''} onclick="m4.answerError(${index})">${String.fromCharCode(65+index)}. ${text}</button>`).join('')}${identified[i]?`<div class="feedback ${idSuccess[i]?'good':'bad'}">${idSuccess[i]?'Đã xác định đúng lỗi. Hãy đề xuất bản sửa.':'Hết lượt. Lỗi đúng đã được đánh dấu.'}</div>`:strikes[i]>0?`<div class="feedback warn"><b>Gợi ý:</b> ${hints[i]}${unlimited?' Bạn có thể thử lại.':` · Lượt ${strikes[i]}/3`}</div>`:''}</div>`}
    function approval(n,text){return fixed[n-1]?`<div class="approval"><b>✓ Phê duyệt thi công</b><br>${text}</div>`:''}
    function nav(n){return `<div class="btn-row">${n>1?'<button class="btn secondary" onclick="m4.prev()">← Hồ sơ trước</button>':''}${n<5?`<button class="btn primary" ${!fixed[n-1]?'disabled':''} onclick="m4.next()">Hồ sơ tiếp theo →</button>`:`<button class="btn primary" ${!fixed[4]||!materialDone?'disabled':''} onclick="m4.finish()">Hoàn thành kiểm định</button>`}</div>`}
    function render1(){content.innerHTML=`<p class="eyebrow">Hồ sơ 1 · Lỗi dựng góc</p><h2 class="title">Góc nhị diện giữa hai mái</h2><div class="athena"><b>✦ Athena</b>Chào kỹ sư! Hồ sơ đầu tiên cho góc mái 133,14°. Hãy kiểm tra trước khi đội thi công dựng khung.</div><div class="card dossier"><h3>Bản tính đang chờ duyệt</h3><p class="small">Hai tia được vẽ từ hai điểm khác nhau trên nóc, không vuông góc đường nóc; nhiều đường phụ chồng chéo.</p><div class="formula">Góc mái = 133,14°</div></div><div class="card alert"><h3>⚠ Dấu hiệu cảnh báo</h3><p class="small">Đội thi công quan sát mái chỉ mở khoảng 50°, không giống kết quả 133,14°.</p></div>${errorQuiz(1)}${identified[0]?`<div class="card"><h3>Đề xuất bản sửa</h3>${['Dựng hai tia cùng điểm trên nóc và cùng vuông góc đường nóc','Giữ hai tia cũ nhưng xóa bớt đường phụ','Chỉ chuyển 133,14° thành góc bù'].map((t,i)=>`<button class="choice ${fixed[0]&&i===0?'correct':fixWrong[0]===i?'wrong':''}" ${fixed[0]?'disabled':''} onclick="m4.fixCase(1,${i})">${t}</button>`).join('')}${fixed[0]?'<div class="feedback good">Hai tia đúng cho góc nhị diện 50°, khớp phản hồi thực tế.</div>':''}</div>`:''}${approval(1,'Lỗi dựng góc đã được sửa. Nhắc lại Module 1: hai tia phải cùng điểm và cùng vuông góc giao tuyến.')}${nav(1)}`}
    function render2(){content.innerHTML=`<p class="eyebrow">Hồ sơ 2 · Suy diễn thiếu điều kiện</p><h2 class="title">Đường chéo trên mái</h2><div class="athena"><b>✦ Athena</b>Mái đã vuông góc với tường, nhưng bản tính kết luận mọi đường trên mái đều vuông góc sàn.</div><div class="card dossier"><h3>Bản tính đang chờ duyệt</h3><p class="small">“Mái vuông góc với tường nên đường chéo mái đương nhiên vuông góc sàn.”</p><div class="formula">∠(đường chéo, sàn) = 90°</div></div><div class="card alert"><h3>⚠ Dấu hiệu cảnh báo</h3><p class="small">Đường chéo đo thực tế chỉ khoảng 45° so với sàn.</p></div>${errorQuiz(2)}${identified[1]?`<div class="card"><h3>Chọn đường thực sự vuông góc sàn</h3><button class="choice ${fixWrong[1]===0?'wrong':''}" ${fixed[1]?'disabled':''} onclick="m4.fixCase(2,0)">Đường chéo màu đỏ</button><button class="choice ${fixed[1]?'correct':''}" ${fixed[1]?'disabled':''} onclick="m4.fixCase(2,1)">Đường màu xanh vuông góc giao tuyến</button>${fixed[1]?'<div class="feedback good">Đúng. Chỉ đường trong mái vuông góc giao tuyến mới chắc chắn vuông góc mặt kia.</div>':''}</div>`:''}${approval(2,'Hồ sơ được sửa theo tính chất của hai mặt phẳng vuông góc ở Module 2.')}${nav(2)}`}
    function render3(){content.innerHTML=`<p class="eyebrow">Hồ sơ 3 · Sai chiều cao</p><h2 class="title">Thể tích khung nhà xưởng</h2><div class="athena"><b>✦ Athena</b>Khung là lăng trụ xiên: cạnh bên dài 10 m lệch 14,04° so với phương vuông góc đáy.</div><div class="card dossier"><h3>Bản tính đang chờ duyệt</h3><div class="formula">V<sub>sai</sub> = S<sub>đáy</sub> × cạnh bên<br>= 24 × 10 = 240 m³</div></div><div class="card alert"><h3>⚠ Dấu hiệu cảnh báo</h3><p class="small">Thể tích tính ra lớn hơn lượng vật liệu thực tế; tích vô hướng với pháp tuyến đáy chỉ bằng 0,97.</p></div>${errorQuiz(3)}${identified[2]?`<div class="card"><h3>Chọn chiều cao thật</h3>${['10,00 m — độ dài cạnh bên','9,70 m — hình chiếu vuông góc','14,04 m — số đo góc đổi thành mét'].map((t,i)=>`<button class="choice ${fixed[2]&&i===1?'correct':fixWrong[2]===i?'wrong':''}" ${fixed[2]?'disabled':''} onclick="m4.fixCase(3,${i})">${t}</button>`).join('')}${fixed[2]?'<div class="feedback good"><span class="formula">h = 10 × cos 14,04° ≈ 9,70 m<br>V = 24 × 9,70 = 232,8 m³</span></div>':''}</div>`:''}${approval(3,'Đã dùng khoảng cách vuông góc giữa hai đáy, không dùng cạnh bên nghiêng. Nhắc lại Module 3.')}${nav(3)}`}
    function render4(){content.innerHTML=`<p class="eyebrow">Hồ sơ 4 · Lỗi tư duy quan trọng nhất</p><h2 class="title">Hai thanh xà mái</h2><div class="athena"><b>✦ Athena</b>Xà 1 và xà 2 đều vuông góc thanh giằng g. Hãy xoay mô hình và kiểm tra kết luận “hai xà song song”.</div><div class="card dossier"><h3>Bản tính đang chờ duyệt</h3><div class="formula">xà 1 ⟂ g; xà 2 ⟂ g<br>⇒ xà 1 ∥ xà 2 (?)</div></div><div class="card alert"><h3>⚠ Dấu hiệu cảnh báo</h3><p class="small">Hai xà không đồng phẳng, bắt chéo nhau và không khớp mối nối khi lắp thực tế.</p></div>${errorQuiz(4)}${identified[3]?`<div class="card"><h3>Đề xuất bản sửa</h3><p class="small">Vectơ xà 1: (0;1;0), xà 2: (0;1;1), giằng: (1;0;0). Cả hai tích vô hướng với giằng bằng 0 nhưng tích có hướng của hai xà khác 0.</p><button class="btn primary" ${fixed[3]?'disabled':''} onclick="m4.confirmSkew()">Tôi đã xoay và thấy hai xà chéo nhau</button>${fixed[3]?'<div class="feedback good">Đúng. Tính chất “cùng vuông góc thì song song” cần thêm điều kiện đồng phẳng.</div>':''}</div>`:''}${approval(4,'Đã loại bỏ việc áp tính chất hình phẳng khi thiếu điều kiện đồng phẳng.')}${nav(4)}`}
    function render5(){content.innerHTML=`<p class="eyebrow">Hồ sơ 5 · Ứng dụng thực tế</p><h2 class="title">Độ dốc mái và vật liệu</h2><div class="athena"><b>✦ Athena</b>Mái cao 1,2 m trên chiều ngang 8 m. Hồ sơ tính độ dốc 15% rồi ghi góc mái là 15°.</div><div class="card dossier"><h3>Bản tính đang chờ duyệt</h3><div class="formula">H/L × 100% = 1,2/8 × 100% = 15%<br>⇒ góc dốc = 15° (?)</div></div><div class="card alert"><h3>⚠ Dấu hiệu cảnh báo</h3><p class="small">Thước đo góc tại công trường chỉ khoảng 8,5°, chênh 6,47°.</p></div>${errorQuiz(5)}${identified[4]?`<div class="card"><h3>Sửa cách đổi độ dốc sang góc</h3>${['α = 15° vì độ dốc là 15%','α = arctan(0,15) ≈ 8,53°','α = arcsin(15)'].map((t,i)=>`<button class="choice ${fixed[4]&&i===1?'correct':fixWrong[4]===i?'wrong':''}" ${fixed[4]?'disabled':''} onclick="m4.fixCase(5,${i})">${t}</button>`).join('')}</div>`:''}${fixed[4]?`<div class="card"><h3>Vật liệu nào phù hợp với góc 8,53°?</h3><button class="choice ${materialDone?'correct':materialWrong===0?'wrong':''}" ${materialDone?'disabled':''} onclick="m4.answerMaterial(0)">A. Mái tôn · phổ biến 6°–17°</button><button class="choice ${materialWrong===1?'wrong':''}" ${materialDone?'disabled':''} onclick="m4.answerMaterial(1)">B. Mái ngói · phổ biến 17°–31°</button><button class="choice ${materialWrong===2?'wrong':''}" ${materialDone?'disabled':''} onclick="m4.answerMaterial(2)">C. Mái bê tông cốt thép · phổ biến 2,9°–4,6°</button>${materialDone?'<div class="feedback good">Mái tôn phù hợp với khoảng dốc phổ biến này.</div>':''}<div class="feedback info"><b>Lưu ý:</b> các khoảng trên là hướng dẫn kỹ thuật phổ biến, có thể thay đổi theo vật liệu và công trình; không phải một quy chuẩn pháp lý cố định duy nhất.</div></div>`:''}${approval(5,'Đã phân biệt phần trăm độ dốc với số đo góc và chọn vật liệu phù hợp.')}${materialDone?summary():''}${finished?'<div class="feedback good"><b>Hoàn thành Module 4!</b> Bạn đã rà soát và phê duyệt đủ 5 hồ sơ.</div>':''}${nav(5)}`}
    function summary(){return `<div class="card"><h3>Tổng hợp kiểm định Bài 25</h3><div class="table-scroll"><table class="summary-table"><thead><tr><th>Hồ sơ</th><th>Lỗi sai</th><th>Nhắc lại</th></tr></thead><tbody><tr><td>1</td><td>Chọn sai hai tia dựng góc nhị diện</td><td>Module 1</td></tr><tr><td>2</td><td>Cho rằng mọi đường trong mặt vuông góc đều ⟂ mặt kia</td><td>Module 2</td></tr><tr><td>3</td><td>Dùng công thức lăng trụ đứng cho lăng trụ xiên</td><td>Module 3</td></tr><tr><td>4</td><td><b>Áp tính chất hình phẳng vào không gian</b></td><td>Toàn bài</td></tr><tr><td>5</td><td>Nhầm % độ dốc với số đo góc</td><td>Thực tế</td></tr></tbody></table></div><div class="athena"><b>✦ Athena</b>Cảm ơn kỹ sư! Trong không gian, một số “lẽ thường” từ hình học phẳng không còn đúng. Luôn kiểm tra điều kiện trước khi phê duyệt.</div></div>`}
    function render(){document.getElementById('progress').textContent=`HỒ SƠ ${current}/5`;document.querySelectorAll('.tab').forEach(tab=>{const n=+tab.dataset.case;tab.disabled=n>unlocked;tab.classList.toggle('active',n===current);tab.classList.toggle('done',n<unlocked)});if(current===1)render1();else if(current===2)render2();else if(current===3)render3();else if(current===4)render4();else render5();report();save('xem hồ sơ '+current)}
    function shake(){const el=document.getElementById('quiz');if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}}
    function answerError(choice){const i=current-1;if(identified[i])return;lastWrong[i]=null;const correct=choice===correctError[i];if(correct){identified[i]=true;idSuccess[i]=true}else{strikes[i]++;lastWrong[i]=choice;if(current!==4&&strikes[i]>=3)identified[i]=true}render();if(!correct&&!identified[i])shake();safe(()=>LMS().event('answered',{id:['roof-angle','roof-diagonal','skew-prism','skew-beams','roof-slope'][i],phase:'identify-error',choice,correct,strike:strikes[i]}),'event');save('xác định lỗi hồ sơ '+current)}
    function fixCase(n,choice){const targets={1:0,2:1,3:1,5:1},correct=choice===targets[n];fixWrong[n-1]=correct?null:choice;if(correct){fixed[n-1]=true;buildScene();completeCase(n)}render();safe(()=>LMS().event('answered',{id:'case-'+n+'-repair',choice,correct}),'event');save('sửa hồ sơ '+n)}
    function confirmSkew(){fixed[3]=true;buildScene();completeCase(4);render();safe(()=>LMS().event('observed',{id:'skew-beams',result:'not-coplanar'}),'event');save('xác nhận hai xà chéo nhau')}
    function answerMaterial(choice){const correct=choice===0;materialWrong=correct?null:choice;if(correct){materialDone=true;completeCase(5)}render();safe(()=>LMS().event('answered',{id:'roof-material',choice,correct}),'event');save('chọn vật liệu mái')}
    function completeCase(n){unlocked=Math.max(unlocked,Math.min(5,n+1));safe(()=>LMS().progress({done:fixed.filter(Boolean).length-(fixed[4]&&!materialDone?1:0),total:5}),'progress')}
    function go(n){if(n<1||n>unlocked)return;current=n;buildScene();render()}
    function finish(){if(finished||!materialDone)return;finished=true;const button=content.querySelector('.btn-row .primary');if(button){button.disabled=true;button.textContent='✓ Đã hoàn thành'}const message=document.createElement('div');message.className='feedback good';message.innerHTML='<b>Hoàn thành Module 4!</b> Bạn đã rà soát và phê duyệt đủ 5 hồ sơ thiết kế.';if(button)button.parentElement.before(message);const items=identified.map((value,i)=>({id:['roof-angle','roof-diagonal','skew-prism','skew-beams','roof-slope'][i],identified:value,identifiedCorrectly:idSuccess[i],repaired:fixed[i]}));safe(()=>LMS().progress({done:5,total:5}),'progress');safe(()=>LMS().complete({summary:'Đã hoàn thành kiểm định 5 hồ sơ và tổng kết Bài 25.',score:items.filter(x=>x.identifiedCorrectly&&x.repaired).length,max:5,items}),'complete');save('hoàn thành module');report();message.scrollIntoView({behavior:'smooth',block:'nearest'})}
    function save(lastAction){safe(()=>LMS().state({currentCase:current,totalCases:5,unlocked,finished,identified,idSuccess,strikes,lastWrong,fixed,fixWrong,materialDone,materialWrong,lastAction}),'state')}
    window.m4={answerError,fixCase,confirmSkew,answerMaterial,next(){go(current+1)},prev(){go(current-1)},finish};document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>go(+tab.dataset.case));document.getElementById('reset').onclick=buildScene;document.getElementById('view').onclick=()=>setCamera(V(0,4,11),V(0,1.5,0));
    function updateLabels(){const rect=wrap.getBoundingClientRect();labels.forEach(item=>{const p=item.pos.clone().project(camera),visible=p.z>-1&&p.z<1;item.el.style.display=visible?'block':'none';if(visible){item.el.style.left=(p.x*.5+.5)*rect.width+'px';item.el.style.top=(-p.y*.5+.5)*rect.height+'px'}})}
    function resize(){const rect=wrap.getBoundingClientRect();if(rect.width<2||rect.height<2)return;renderer.setSize(rect.width,rect.height,false);camera.aspect=rect.width/rect.height;camera.updateProjectionMatrix()}
    function animate(){requestAnimationFrame(animate);controls.update();updateLabels();renderer.render(scene,camera)}
    function report(){safe(()=>LMS().resize({height:document.documentElement.scrollHeight}),'resize')}
    if(typeof ResizeObserver!=='undefined'){const ro=new ResizeObserver(()=>{clearTimeout(window._m4rz);window._m4rz=setTimeout(()=>{resize();report()},100)});ro.observe(wrap);ro.observe(document.body)}else setInterval(()=>{resize();report()},800);window.addEventListener('resize',resize);window.addEventListener('load',report);
    if(window.AiducationLMS)window.AiducationLMS.onResume=s=>{if(!s)return;current=Math.max(1,Math.min(5,s.currentCase||1));unlocked=Math.max(current,Math.min(5,s.unlocked||1));finished=!!s.finished;identified=Array.isArray(s.identified)?s.identified:identified;idSuccess=Array.isArray(s.idSuccess)?s.idSuccess:idSuccess;strikes=Array.isArray(s.strikes)?s.strikes:strikes;lastWrong=Array.isArray(s.lastWrong)?s.lastWrong:lastWrong;fixed=Array.isArray(s.fixed)?s.fixed:fixed;fixWrong=Array.isArray(s.fixWrong)?s.fixWrong:fixWrong;materialDone=!!s.materialDone;materialWrong=s.materialWrong??null;buildScene();render()};
    buildScene();render();resize();animate();safe(()=>LMS().ready({id:'bai25-module4-construction-audit'}),'ready');safe(()=>LMS().progress({done:0,total:5}),'progress');save('mở module');
  })();
  </script>
