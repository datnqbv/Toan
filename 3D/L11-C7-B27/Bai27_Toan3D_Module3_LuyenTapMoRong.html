  <style>

    @media(max-width:768px){
      body{min-height:100vh;overflow-y:auto}
      .app-shell{display:flex!important;width:100%;height:auto!important;min-height:auto!important;max-height:none!important;flex-direction:column!important;overflow:visible!important}
      .viewport{position:sticky!important;top:0!important;z-index:50!important;flex:none!important;width:100%!important;height:calc((100vh - 58px)*.5)!important;height:calc((100dvh - 58px)*.5)!important;min-height:240px!important;border-bottom:1px solid var(--paper-line);box-shadow:0 4px 14px rgba(0,0,0,.4)}
      .sidebar{width:100%!important;min-width:0;height:auto!important;max-height:none!important;flex:none!important;border-left:0;border-top:1px solid var(--paper-line);overflow:visible!important}

    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<body>
  <header>
    <span class="header-badge">🧊 Hình học không gian</span>
    <h1>Bài 27 · Module 3: Luyện tập mở rộng (SGK 7.28–7.31)</h1>
    <span class="header-progress" id="header-progress">BÀI 1/4</span>
  </header>
  
  <main class="app-shell">
    <!-- VIEWPORT 3D -->
    <section class="viewport" id="canvas-wrap" aria-label="Mô hình luyện tập mở rộng 3D">
      <canvas id="three-canvas"></canvas>
      <div class="label-layer" id="label-layer"></div>
      <div class="canvas-top">
        <span class="scene-chip" id="scene-chip">Chóp tam giác đều S.ABC</span>
        <span class="distance-readout" id="distance-readout">V = 18,74 cm³</span>
      </div>
      <div class="canvas-actions">
        <button class="canvas-btn" onclick="setCamera('iso')" title="Phối cảnh 3D"><i class="ti ti-rotate-3d"></i> 3D</button>
        <button class="canvas-btn" onclick="setCamera('front')" title="Trực diện"><i class="ti ti-border-all"></i> Trực diện</button>
        <button class="canvas-btn" onclick="setCamera('top')" title="Từ trên"><i class="ti ti-layout-grid"></i> Từ trên</button>
      </div>
      <div class="canvas-hint">Kéo chuột để xoay · Cuộn để zoom</div>
    </section>

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <nav class="step-tabs" aria-label="Các bài ôn tập">
        <button class="step-tab active" data-step="1" onclick="lesson.goToStep(1)">Bài 1</button>
        <button class="step-tab" data-step="2" onclick="lesson.goToStep(2)">Bài 2</button>
        <button class="step-tab" data-step="3" onclick="lesson.goToStep(3)">Bài 3</button>
        <button class="step-tab" data-step="4" onclick="lesson.goToStep(4)">Bài 4</button>
      </nav>
      <div class="step-body" id="step-body"></div>
    </aside>
  </main>

  <script>
  (()=>{'use strict';
    const LMS=()=>window.AiducationLMS||{ready(){},event(){},complete(){},resize(){}};
    const canvas=document.getElementById('three-canvas'),wrap=document.getElementById('canvas-wrap'),stepBody=document.getElementById('step-body');
    const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
    renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
    renderer.setClearColor(0x0a1628);
    renderer.outputEncoding=THREE.sRGBEncoding;

    const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(46,1,.1,100),controls=new THREE.OrbitControls(camera,canvas);
    controls.enableDamping=true;controls.dampingFactor=.08;controls.minDistance=3;controls.maxDistance=25;

    scene.add(new THREE.HemisphereLight(0xddeeff,0x172235,1.1));
    const keyLight=new THREE.DirectionalLight(0xffffff,1.0);keyLight.position.set(6,10,8);scene.add(keyLight);
    const backLight=new THREE.DirectionalLight(0x38bdf8,.35);backLight.position.set(-5,-3,-6);scene.add(backLight);

    const C={
      slate:0x64748b,terracotta:0xC15F3C,ochre:0xD97706,dustyBlue:0x4E7F92,sand:0xD8C4A0,
      jade:0x3CA57A,jadeDeep:0x2D8B6F,accent:0xE8A24A,point:0xFAC775,grid:0x1e293b,
      edgeSolid:0xe6edf3,edgeHidden:0x444d56
    };

    const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
    const edgeRaycaster=new THREE.Raycaster(),edgeMid=V(),edgeDir=V(),edgeTest=V();

    let currentStep=1,unlocked=1,root=null,labels=[],occlusionSets=[];
    let edgeB=5.0;            // Step 1: Cạnh bên b biến thiên (5 -> 6)
    let quiz2Done=false,quiz3Done=false,quiz4Done=false;
    let quiz2Choice=null,quiz3Choice=null,quiz4Choice=null;

    function dispose(obj){if(!obj)return;obj.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.dispose())});if(obj.parent)obj.parent.remove(obj)}
    function clearScene(){
      dispose(root);root=new THREE.Group();scene.add(root);
      labels.forEach(x=>x.el.remove());labels=[];occlusionSets=[];
    }
    function addLabel(text,pos,cls=''){
      const el=document.createElement('div');el.className='label '+cls;el.textContent=text;
      document.getElementById('label-layer').appendChild(el);
      const item={el,pos:pos.clone()};labels.push(item);return item;
    }
    function updateLabels(){
      const w=wrap.clientWidth,h=wrap.clientHeight;
      labels.forEach(l=>{
        const p=l.pos.clone().project(camera);
        if(p.z>1||Math.abs(p.x)>1.1||Math.abs(p.y)>1.1){l.el.style.display='none';return}
        l.el.style.display='block';
        l.el.style.left=((p.x*.5+.5)*w)+'px';
        l.el.style.top=((-p.y*.5+.5)*h)+'px';
      });
    }

    // Mỗi cạnh thật có hai bản: liền khi nhìn thấy, đứt khi bị chính khối che.
    function addOccludedEdgeSet(edgePairs,solidMesh){
      const edges=edgePairs.map(([a,b])=>{
        const p1=a.clone(),p2=b.clone();
        const solid=new THREE.Line(
          new THREE.BufferGeometry().setFromPoints([p1,p2]),
          new THREE.LineBasicMaterial({color:C.edgeSolid,transparent:true,opacity:.98})
        );
        const dashed=new THREE.Line(
          new THREE.BufferGeometry().setFromPoints([p1,p2]),
          new THREE.LineDashedMaterial({color:C.edgeHidden,dashSize:.15,gapSize:.10,transparent:true,opacity:.60})
        );
        dashed.computeLineDistances();
        dashed.visible=false;
        solid.renderOrder=3;dashed.renderOrder=2;
        root.add(solid,dashed);
        return{p1,p2,solid,dashed,hidden:false,candidate:null,candidateFrames:0};
      });
      occlusionSets.push({solidMesh,edges});
    }

    function updateEdgeOcclusion(){
      if(!occlusionSets.length)return;
      root.updateMatrixWorld(true);
      occlusionSets.forEach(({solidMesh,edges})=>{
        solidMesh.updateMatrixWorld(true);
        edges.forEach(edge=>{
          edgeMid.addVectors(edge.p1,edge.p2).multiplyScalar(.5);
          edgeDir.subVectors(camera.position,edgeMid).normalize();
          edgeTest.copy(edgeMid).addScaledVector(edgeDir,.018);
          const distance=edgeTest.distanceTo(camera.position);
          edgeRaycaster.set(edgeTest,edgeDir);edgeRaycaster.near=.01;edgeRaycaster.far=Math.max(.01,distance-.035);
          const hidden=edgeRaycaster.intersectObject(solidMesh,false).length>0;
          if(hidden===edge.hidden){edge.candidate=null;edge.candidateFrames=0;return}
          if(edge.candidate===hidden)edge.candidateFrames++;
          else{edge.candidate=hidden;edge.candidateFrames=1}
          // Hai frame liên tiếp tránh nhấp nháy khi cạnh nằm đúng đường silhouette.
          if(edge.candidateFrames>=2){
            edge.hidden=hidden;edge.candidate=null;edge.candidateFrames=0;
            edge.solid.visible=!hidden;edge.dashed.visible=hidden;
          }
        });
      });
    }

    // Grid sàn
    const floorGrid=new THREE.GridHelper(14,14,0x27354a,0x172235);
    floorGrid.position.y=-0.01;
    scene.add(floorGrid);

    // Resize
    const ro=new ResizeObserver(()=>{
      if(!wrap.clientWidth||!wrap.clientHeight)return;
      camera.aspect=wrap.clientWidth/wrap.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(wrap.clientWidth,wrap.clientHeight);
    });
    ro.observe(wrap);

    /* Animation Loop */
    function animate(){
      requestAnimationFrame(animate);
      controls.update();
      updateEdgeOcclusion();
      updateLabels();
      renderer.render(scene,camera);
    }
    animate();

    /* =========================================================================
       STEP 3D BUILDERS
       ========================================================================= */

    /* BÀI 1: Từ chóp tam giác đều đến tứ diện đều */
    function buildStep1Scene(){
      clearScene();
      const a=3.6; // Đáy a=6 (scale 0.6)
      const rOuter=a*Math.sqrt(3)/3; // OA = a*sqrt(3)/3
      const bScale=edgeB*0.6;
      const h=Math.sqrt(Math.max(0.1,bScale*bScale - rOuter*rOuter));

      const pA=V(0,0,rOuter);
      const pB=V(-a/2,0,-rOuter/2);
      const pC=V(a/2,0,-rOuter/2);
      const pO=V(0,0,0);
      const pS=V(0,h,0);

      // Mặt bên chóp
      const pyrGeo=new THREE.BufferGeometry();
      pyrGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array([
        pS.x,pS.y,pS.z, pA.x,pA.y,pA.z, pB.x,pB.y,pB.z,
        pS.x,pS.y,pS.z, pB.x,pB.y,pB.z, pC.x,pC.y,pC.z,
        pS.x,pS.y,pS.z, pC.x,pC.y,pC.z, pA.x,pA.y,pA.z,
        pA.x,pA.y,pA.z, pC.x,pC.y,pC.z, pB.x,pB.y,pB.z
      ]),3));
      pyrGeo.computeVertexNormals();
      const pyrMesh=new THREE.Mesh(pyrGeo,new THREE.MeshStandardMaterial({color:C.terracotta,transparent:true,opacity:.30,side:THREE.DoubleSide,depthWrite:false}));
      root.add(pyrMesh);

      // Cạnh khung tự đổi liền/đứt theo góc nhìn.
      addOccludedEdgeSet([[pA,pB],[pB,pC],[pC,pA],[pS,pA],[pS,pB],[pS,pC]],pyrMesh);

      // Đoạn OA (bán kính đáy) và SO (chiều cao)
      const oaGuide=new THREE.Line(new THREE.BufferGeometry().setFromPoints([pO,pA]),new THREE.LineDashedMaterial({color:C.jade,dashSize:0.12,gapSize:0.08,linewidth:2.5}));
      oaGuide.computeLineDistances();root.add(oaGuide);
      root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([pS,pO]),new THREE.LineBasicMaterial({color:C.jade,linewidth:3})));

      // Điểm
      [pS,pO,pA,pB,pC].forEach(pt=>{
        const dot=new THREE.Mesh(new THREE.SphereGeometry(0.06,12,12),new THREE.MeshBasicMaterial({color:0xffffff}));
        dot.position.copy(pt);root.add(dot);
      });

      addLabel('S (Đỉnh)',pS.clone().add(V(0,0.18,0)));
      addLabel('OA = 2√3 ≈ 3,46',pA.clone().add(pO).multiplyScalar(0.5).add(V(0.2,0,0)),'jade');
      addLabel(edgeB===6?'SO = 2√6 (Tứ diện đều)':'SO = √13 ≈ 3,61',V(0.25,h/2,0),'jade');
      addLabel(`b = ${edgeB.toFixed(1)}`,pS.clone().add(pA).multiplyScalar(0.5).add(V(0.2,0.1,0.2)),'accent');

      const vReal=edgeB===6?25.4558:(edgeB===5?18.7350:( (1/3)*(9*Math.sqrt(3))*Math.sqrt(edgeB*edgeB - 12) ));
      document.getElementById('scene-chip').textContent=edgeB===6?'Bài 1 · Tứ diện đều cạnh 6':'Bài 1 · Chóp tam giác đều (a=6, b='+edgeB.toFixed(1)+')';
      document.getElementById('distance-readout').textContent='V = '+vReal.toFixed(2)+' cm³';
      document.getElementById('distance-readout').style.color=edgeB===6?'#34D399':'#FAC775';
    }

    /* BÀI 2: Lăng trụ đứng đáy tam giác tù (140 độ) */
    function buildStep2Scene(){
      clearScene();
      const aa=2.4; // AA' = 4 -> scale 0.6
      const c1=3.0,c2=1.8,angRad=(140*Math.PI)/180; // AB=5, BC=3

      const pB=V(0,0,0);
      const pA=V(-c1,0,0);
      const pC=V(c2*Math.cos(Math.PI-angRad),0,c2*Math.sin(Math.PI-angRad));

      const pA2=V(pA.x,aa,pA.z),pB2=V(pB.x,aa,pB.z),pC2=V(pC.x,aa,pC.z);

      // Thân lăng trụ
      const prismGeo=new THREE.BufferGeometry();
      prismGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array([
        pA.x,pA.y,pA.z, pB.x,pB.y,pB.z, pC.x,pC.y,pC.z,
        pA2.x,pA2.y,pA2.z, pC2.x,pC2.y,pC2.z, pB2.x,pB2.y,pB2.z,
        pA.x,pA.y,pA.z, pA2.x,pA2.y,pA2.z, pB2.x,pB2.y,pB2.z,
        pA.x,pA.y,pA.z, pB2.x,pB2.y,pB2.z, pB.x,pB.y,pB.z,
        pB.x,pB.y,pB.z, pB2.x,pB2.y,pB2.z, pC2.x,pC2.y,pC2.z,
        pB.x,pB.y,pB.z, pC2.x,pC2.y,pC2.z, pC.x,pC.y,pC.z,
        pC.x,pC.y,pC.z, pC2.x,pC2.y,pC2.z, pA2.x,pA2.y,pA2.z,
        pC.x,pC.y,pC.z, pA2.x,pA2.y,pA2.z, pA.x,pA.y,pA.z
      ]),3));
      prismGeo.computeVertexNormals();
      const prismMesh=new THREE.Mesh(prismGeo,new THREE.MeshStandardMaterial({color:C.slate,transparent:true,opacity:.30,side:THREE.DoubleSide,depthWrite:false}));
      root.add(prismMesh);

      // Khung viền tự đổi liền/đứt theo góc nhìn.
      addOccludedEdgeSet([
        [pA,pB],[pB,pC],[pC,pA],
        [pA2,pB2],[pB2,pC2],[pC2,pA2],
        [pA,pA2],[pB,pB2],[pC,pC2]
      ],prismMesh);

      // Cung góc 140 độ tại B
      const arcPts=[];
      for(let i=0;i<=20;i++){
        const t=i/20;
        const curAng=Math.PI - t*(angRad);
        arcPts.push(V(0.5*Math.cos(curAng),0.02,0.5*Math.sin(curAng)));
      }
      root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(arcPts),new THREE.LineBasicMaterial({color:C.accent,linewidth:2})));

      addLabel('Góc ABC = 140°',V(-0.2,0.1,0.6),'accent');
      addLabel('AB = 5',pA.clone().add(pB).multiplyScalar(0.5).add(V(0,0,-0.25)));
      addLabel('BC = 3',pB.clone().add(pC).multiplyScalar(0.5).add(V(0.3,0,0.2)));
      addLabel('AA\' = 4',V(pA.x-0.25,aa/2,pA.z),'jade');

      document.getElementById('scene-chip').textContent='Bài 2 · Lăng trụ đứng đáy tam giác có góc 140°';
      document.getElementById('distance-readout').textContent='V = 19,28 cm³';
      document.getElementById('distance-readout').style.color='#34D399';
    }

    /* BÀI 3: Phân biệt 2 chóp đặt song song (Góc cạnh bên vs Góc mặt bên) */
    function buildStep3Scene(){
      clearScene();
      const a=2.4; // cạnh đáy 5 -> scale 0.48
      const x1=-2.6, x2=2.6;

      // TH1: Góc cạnh bên SAO = 50 độ -> h1 = OA * tan(50)
      const rO1=a*Math.sqrt(2)/2;
      const h1=rO1*Math.tan((50*Math.PI)/180);

      // TH2: Góc mặt bên SMO = 40 độ -> h2 = OM * tan(40)
      const rM2=a/2;
      const h2=rM2*Math.tan((40*Math.PI)/180);

      // Dựng chóp 1 (Trái - TH1)
      const pyrGeo1=new THREE.ConeGeometry(a*0.707,h1,4);
      const pyrMesh1=new THREE.Mesh(pyrGeo1,new THREE.MeshStandardMaterial({color:C.terracotta,transparent:true,opacity:.28,side:THREE.DoubleSide,depthWrite:false}));
      pyrMesh1.rotation.y=Math.PI/4;pyrMesh1.position.set(x1,h1/2,0);root.add(pyrMesh1);
      const pS1=V(x1,h1,0);
      const base1=[V(x1+a/2,0,a/2),V(x1+a/2,0,-a/2),V(x1-a/2,0,-a/2),V(x1-a/2,0,a/2)];
      addOccludedEdgeSet([
        [base1[0],base1[1]],[base1[1],base1[2]],[base1[2],base1[3]],[base1[3],base1[0]],
        [pS1,base1[0]],[pS1,base1[1]],[pS1,base1[2]],[pS1,base1[3]]
      ],pyrMesh1);

      // Đường OA và SO chóp 1
      const pO1=V(x1,0,0),pA1=V(x1-a/2,0,a/2);
      root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([pO1,pA1]),new THREE.LineBasicMaterial({color:C.accent,linewidth:3})));
      root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([pS1,pO1]),new THREE.LineBasicMaterial({color:C.jade,linewidth:3})));

      // Dựng chóp 2 (Phải - TH2)
      const pyrGeo2=new THREE.ConeGeometry(a*0.707,h2,4);
      const pyrMesh2=new THREE.Mesh(pyrGeo2,new THREE.MeshStandardMaterial({color:C.dustyBlue,transparent:true,opacity:.28,side:THREE.DoubleSide,depthWrite:false}));
      pyrMesh2.rotation.y=Math.PI/4;pyrMesh2.position.set(x2,h2/2,0);root.add(pyrMesh2);
      const pS2=V(x2,h2,0);
      const base2=[V(x2+a/2,0,a/2),V(x2+a/2,0,-a/2),V(x2-a/2,0,-a/2),V(x2-a/2,0,a/2)];
      addOccludedEdgeSet([
        [base2[0],base2[1]],[base2[1],base2[2]],[base2[2],base2[3]],[base2[3],base2[0]],
        [pS2,base2[0]],[pS2,base2[1]],[pS2,base2[2]],[pS2,base2[3]]
      ],pyrMesh2);

      // Đường OM và SO chóp 2
      const pO2=V(x2,0,0),pM2=V(x2,0,a/2);
      root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([pO2,pM2]),new THREE.LineBasicMaterial({color:C.dustyBlue,linewidth:3})));
      root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([pS2,pO2]),new THREE.LineBasicMaterial({color:C.jade,linewidth:3})));

      addLabel('TH1: Cạnh bên 50°',V(x1,h1+0.4,0),'accent');
      addLabel('OA = 2,5√2 (Tâm → Đỉnh)',pA1.clone().add(V(0,-0.15,0.2)),'accent');
      addLabel('V₁ = 35,11 cm³',V(x1,h1/2,0),'result');

      addLabel('TH2: Mặt bên 40°',V(x2,h2+0.4,0),'blue');
      addLabel('OM = 2,5 (Tâm → Trung điểm)',pM2.clone().add(V(0,-0.15,0.2)),'blue');
      addLabel('V₂ = 17,48 cm³',V(x2,h2/2,0),'result');

      document.getElementById('scene-chip').textContent='Bài 3 · So sánh: Góc cạnh bên (50°) vs Góc mặt bên (40°)';
      document.getElementById('distance-readout').textContent='V₁ = 35,11 vs V₂ = 17,48 cm³';
      document.getElementById('distance-readout').style.color='#FAC775';
    }

    /* BÀI 4: Lăng trụ xiên có đỉnh cách đều 3 đỉnh đáy */
    function buildStep4Scene(){
      clearScene();
      const a=2.4; // đáy a=4 -> scale 0.6
      const rOuter=a*Math.sqrt(3)/3; // OA = 4*sqrt(3)/3
      const b=3.6; // A'A = 6 -> scale 0.6
      const h=Math.sqrt(b*b - rOuter*rOuter); // h = sqrt(36 - 16/3)

      const pA=V(0,0,rOuter);
      const pB=V(-a/2,0,-rOuter/2);
      const pC=V(a/2,0,-rOuter/2);
      const pO=V(0,0,0);
      const pA2=V(0,h,0); // Hình chiếu A' rơi đúng vào tâm O!

      const vShift=pA2.clone().sub(pA); // Vectơ nghiêng của lăng trụ
      const pB2=pB.clone().add(vShift);
      const pC2=pC.clone().add(vShift);

      // Thân lăng trụ xiên
      const prismGeo=new THREE.BufferGeometry();
      prismGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array([
        pA.x,pA.y,pA.z, pB.x,pB.y,pB.z, pC.x,pC.y,pC.z,
        pA2.x,pA2.y,pA2.z, pC2.x,pC2.y,pC2.z, pB2.x,pB2.y,pB2.z,
        pA.x,pA.y,pA.z, pA2.x,pA2.y,pA2.z, pB2.x,pB2.y,pB2.z,
        pA.x,pA.y,pA.z, pB2.x,pB2.y,pB2.z, pB.x,pB.y,pB.z,
        pB.x,pB.y,pB.z, pB2.x,pB2.y,pB2.z, pC2.x,pC2.y,pC2.z,
        pB.x,pB.y,pB.z, pC2.x,pC2.y,pC2.z, pC.x,pC.y,pC.z,
        pC.x,pC.y,pC.z, pC2.x,pC2.y,pC2.z, pA2.x,pA2.y,pA2.z,
        pC.x,pC.y,pC.z, pA2.x,pA2.y,pA2.z, pA.x,pA.y,pA.z
      ]),3));
      prismGeo.computeVertexNormals();
      const prismMesh=new THREE.Mesh(prismGeo,new THREE.MeshStandardMaterial({color:C.dustyBlue,transparent:true,opacity:.30,side:THREE.DoubleSide,depthWrite:false}));
      root.add(prismMesh);

      // Khung viền tự đổi liền/đứt theo góc nhìn.
      addOccludedEdgeSet([
        [pA,pB],[pB,pC],[pC,pA],
        [pA2,pB2],[pB2,pC2],[pC2,pA2],
        [pA,pA2],[pB,pB2],[pC,pC2]
      ],prismMesh);

      // Đường cao thẳng đứng OA' (vuông góc tâm đáy)
      root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([pA2,pO]),new THREE.LineBasicMaterial({color:C.jade,linewidth:3.5})));
      const oaGuide=new THREE.Line(new THREE.BufferGeometry().setFromPoints([pO,pA]),new THREE.LineDashedMaterial({color:C.jade,dashSize:0.12,gapSize:0.08}));
      oaGuide.computeLineDistances();root.add(oaGuide);

      // Điểm
      [pA2,pO,pA,pB,pC].forEach(pt=>{
        const dot=new THREE.Mesh(new THREE.SphereGeometry(0.06,12,12),new THREE.MeshBasicMaterial({color:0xffffff}));
        dot.position.copy(pt);root.add(dot);
      });

      addLabel('A\' (Đỉnh trên)',pA2.clone().add(V(0,0.18,0)));
      addLabel('O (Tâm đáy: A\'O ⊥ đáy)',pO.clone().add(V(0,-0.12,0.2)),'jade');
      addLabel('A\'A = A\'B = A\'C = 6',pA.clone().add(pA2).multiplyScalar(0.5).add(V(0.25,0,0.2)),'accent');
      addLabel('h = OA\' ≈ 5,54',V(0.25,h/2,0),'jade');

      document.getElementById('scene-chip').textContent='Bài 4 · Lăng trụ xiên có 3 cạnh bên từ A\' bằng nhau';
      document.getElementById('distance-readout').textContent='V = 38,37 cm³';
      document.getElementById('distance-readout').style.color='#34D399';
    }

        <p class="body-small" style="font-weight:700;margin-top:10px">Câu hỏi kiểm tra:</p>
        <p class="body-small">Vì sao không lấy (1/2)·5·3 trực tiếp làm diện tích đáy?</p>
        <button class="choice ${quiz2Choice===1?'correct':''}" onclick="lesson.answerQ2(1)" ${quiz2Done?'disabled':''}>A. Vì góc ABC = 140° không phải góc vuông 90°</button>
        <button class="choice ${quiz2Choice===0?'wrong':''}" onclick="lesson.answerQ2(0)" ${quiz2Done?'disabled':''}>B. Vì đáy là tam giác tù nên không có diện tích</button>
        <div id="q2-fb">${quiz2Choice===1?'<div class="feedback good">Chính xác! Tam giác thường cần nhân thêm sin của góc xen giữa.</div>':quiz2Choice===0?'<div class="feedback bad">Chưa chính xác. Tam giác tù vẫn có diện tích; hãy kiểm tra công thức diện tích khi biết hai cạnh và góc xen giữa.</div>':''}</div>
      </div>
      ${notebook('Khi tính thể tích, diện tích đáy có thể cần công thức lượng giác S = (1/2)·a·b·sin(C).')}
      ${navButtons('Tiếp: Bài 3 (So sánh góc)',quiz2Done)}`;
    }

    /* BÀI 3 UI */
    function renderStep3UI(){
      buildStep3Scene();
      stepBody.innerHTML=`
      <p class="eyebrow">Bài 3 · Dạng SGK 7.30 (Trọng tâm)</p>
      <h2 class="step-title">Góc cạnh bên-đáy vs Góc mặt bên-đáy</h2>
      <div class="athena">
        <b>✦ Athena</b>
        Cùng có đáy cạnh a = 5: TH1 cho góc CẠNH BÊN = 50°, TH2 cho góc MẶT BÊN = 40°. Hãy quan sát 2 mô hình đặt cạnh nhau để thấy rõ sự khác biệt!
      </div>
      <div class="card">
        <h3>So sánh 2 trường hợp góc:</h3>
        <p class="body-small">
          • <b>TH1 (Góc cạnh bên SAO = 50°):</b> Dùng đoạn OA = 2,5√2 ≈ 3,54 cm<br>
          <span style="font-family:'JetBrains Mono';color:var(--accent-text);font-weight:700">h₁ = OA · tan(50°) ≈ 4,21 cm ⇒ V₁ = (1/3) · 25 · 4,21 ≈ 35,11 cm³</span>
        </p>
        <p class="body-small">
          • <b>TH2 (Góc mặt bên SMO = 40°):</b> Dùng đoạn OM = a/2 = 2,5 cm<br>
          <span style="font-family:'JetBrains Mono';color:var(--info);font-weight:700">h₂ = OM · tan(40°) ≈ 2,10 cm ⇒ V₂ = (1/3) · 25 · 2,10 ≈ 17,48 cm³</span>
        </p>

        <p class="body-small" style="font-weight:700;margin-top:10px">3-Strike Quiz: Nhận diện sai lầm</p>
        <p class="body-small">Nếu ở TH1 dùng nhầm OM thay vì OA để tính h, kết quả V sẽ thế nào?</p>
        <button class="choice ${quiz3Choice===1?'correct':''}" onclick="lesson.answerQ3(1)" ${quiz3Done?'disabled':''}>A. Sai giảm hơn một nửa (17,48 so với 35,11) vì OM < OA</button>
        <button class="choice ${quiz3Choice===0?'wrong':''}" onclick="lesson.answerQ3(0)" ${quiz3Done?'disabled':''}>B. Vẫn đúng vì cùng một khối chóp đáy cạnh 5</button>
        <div id="q3-fb">${quiz3Choice===1?'<div class="feedback good">Chính xác! Góc cạnh bên gắn với bán kính OA, góc mặt bên gắn với trung đoạn OM.</div>':quiz3Choice===0?'<div class="feedback bad">Chưa chính xác. Dùng OM thay cho OA làm thay đổi chiều cao tính được nên thể tích không thể giữ nguyên.</div>':''}</div>
      </div>
      ${notebook('• Góc cạnh bên-đáy: Gắn với đoạn OA (tâm → đỉnh đáy).<br>• Góc mặt bên-đáy: Gắn với đoạn OM (tâm → trung điểm cạnh).')}
      ${navButtons('Tiếp: Bài 4 (Lăng trụ xiên)',quiz3Done)}`;
    }

    /* BÀI 4 UI */
    function renderStep4UI(){
      buildStep4Scene();
      stepBody.innerHTML=`
      <p class="eyebrow">Bài 4 · Dạng SGK 7.31</p>
      <h2 class="step-title">Lăng trụ xiên có 3 cạnh bên bằng nhau</h2>
      <div class="athena">
        <b>✦ Athena</b>
        Cho lăng trụ ABC.A'B'C' có đáy tam giác đều cạnh 4, và A' cách đều 3 đỉnh đáy: A'A = A'B = A'C = 6. Vì A' cách đều A, B, C nên hình chiếu của A' rơi đúng vào <b>tâm ngoại tiếp O</b> của tam giác đáy!
      </div>
      <div class="card">
        <h3>Tính chiều cao & Thể tích lăng trụ xiên:</h3>
        <p class="body-small">
          1. Bán kính ngoại tiếp đáy: OA = 4√3 / 3 ≈ 2,31 cm<br>
          2. Chiều cao lăng trụ h = OA' (Pythagore trong ΔA'OA vuông tại O):<br>
          <span style="font-family:'JetBrains Mono';color:var(--jade-deep);font-weight:700">h = √(6² − (4√3/3)²) = √(36 − 16/3) = √(92/3) ≈ 5,5377 cm</span>
        </p>
        <div class="formula">
          <span>S_đáy = a²√3 / 4 = 16√3 / 4 = 4√3 ≈ 6,9282 cm²</span>
        </div>
        <div class="formula">
          <span>V = S_đáy · h = 4√3 · √(92/3) = 8√23 ≈ 38,3667 cm³</span>
          <span class="formula-badge">Lăng trụ xiên</span>
        </div>

        <p class="body-small" style="font-weight:700;margin-top:10px">Câu hỏi củng cố:</p>
        <p class="body-small">Kỹ thuật "cách đều 3 điểm đáy ⇒ hình chiếu là tâm" áp dụng cho những hình nào?</p>
        <button class="choice ${quiz4Choice===1?'correct':''}" onclick="lesson.answerQ4(1)" ${quiz4Done?'disabled':''}>A. Áp dụng cho MỌI trường hợp đỉnh cách đều 3 điểm đáy (cả chóp và lăng trụ xiên)</button>
        <button class="choice ${quiz4Choice===0?'wrong':''}" onclick="lesson.answerQ4(0)" ${quiz4Done?'disabled':''}>B. Chỉ áp dụng cho hình chóp</button>
        <div id="q4-fb">${quiz4Choice===1?'<div class="feedback good">Chính xác! Đây là nguyên lý hình chiếu tổng quát trong không gian.</div>':quiz4Choice===0?'<div class="feedback bad">Chưa chính xác. Nguyên lý hình chiếu này áp dụng cả cho hình chóp và lăng trụ xiên khi điểm đang xét cách đều ba đỉnh đáy.</div>':''}</div>
      </div>
      ${notebook('• Cách đều 3 đỉnh đáy ⇒ Hình chiếu là tâm ngoại tiếp đáy.<br>• Thể tích lăng trụ xiên: V = S_đáy · h (h là khoảng cách vuông góc thật, KHÔNG lấy cạnh bên).')}
      ${navButtons('Hoàn thành toàn bộ Bài 27',quiz4Done)}`;
    }

    /* =========================================================================
       LESSON CONTROLLER
       ========================================================================= */
    window.lesson={
      goToStep(n){
        currentStep=n;
        renderStep();
        LMS().event('step-change',{step:n});
      },
      completeStep(){
        if(currentStep<4){
          unlocked=Math.max(unlocked,currentStep+1);
          this.goToStep(currentStep+1);
        }
      },
      prevStep(){
        if(currentStep>1){
          this.goToStep(currentStep-1);
        }
      },
      onEdgeB(val){
        edgeB=+val;
        const out=document.getElementById('b-out');
        if(out)out.textContent=`b = ${edgeB.toFixed(1)} ${edgeB===6?'(TỨ DIỆN ĐỀU)':''}`;
        buildStep1Scene();
      },
      answerQ2(choice){
        quiz2Choice=choice;
        quiz2Done=choice===1;
        renderStep();
        LMS().event('quiz2-answered',{correct:choice===1});
      },
      answerQ3(choice){
        quiz3Choice=choice;
        quiz3Done=choice===1;
        renderStep();
        LMS().event('quiz3-answered',{correct:choice===1});
      },
      answerQ4(choice){
        quiz4Choice=choice;
        quiz4Done=choice===1;
        renderStep();
        LMS().event('quiz4-answered',{correct:choice===1});
      },
      finish(){
        LMS().complete({score:100});
        alert('Chúc mừng bạn đã hoàn thành xuất sắc toàn bộ 3 Module của Bài 27: Thể tích khối chóp và lăng trụ!');
      }
    };

    /* Init */
    renderStep();
    setCamera('iso');
    LMS().ready({id:'bai27-module3-luyen-tap-mo-rong'});
  })();
  </script>
</body>
</html>
